  mech:`Their move pressed your STATUS and FAIRNESS buttons — recognition earned, then taken. The heat is the social brain treating invisibility as threat. What's driving him: almost certainly his own status management upward; senior people under pressure hoard credit reflexively, and it usually isn't personal.`,
  options:[
   {t:"Email him a 'summary for the record' of your contribution, cc'ing his boss.",best:false,fb:"That's escalation wearing a memo's clothes. He'll read the cc instantly, and you'll have converted an oversight into a war."},
   {t:"Privately, once cool: 'Glad it landed well. For my growth here I need some visibility at that level — can I present the follow-up?'",best:true,fb:"No accusation to defend against, and it converts the grievance into a forward ask he can grant cheaply. Status restored through the future, not litigation of the past."},
   {t:"Let it go and work even harder so the quality becomes impossible to ignore.",best:false,fb:"Quality without visibility compounds his habit, not your career. Swallowed fairness violations don't dissolve — they turn into resentment with a timestamp."}]},
 {id:"gy2",who:"Your boss",title:"The 6pm grenade",
  prompt:`Third Friday running, your boss drops a "need this first thing Monday" request at 6pm. Your weekend plans — and your team's — evaporate again.`,
  mech:`AUTONOMY and FAIRNESS pressed at once: your time claimed without consent, on a repeating pattern. What's driving her: usually her own late-landing pressure from above plus weak triage — you're the shock absorber of her disorder, which is a process problem wearing a person's face.`,
  options:[
   {t:"Push back on the spot, at 6pm, while the annoyance is fresh.",best:false,fb:"6pm Friday is the worst possible negotiating table — you're flooded, she's cornered by her own deadline. You'll get either a fight or a grudging yes that changes nothing."},
   {t:"Deliver this one — then book Monday: 'When requests land at 6 on Fridays, quality and the team's recovery both suffer. Can we set a Thursday cut-off or triage earlier in the week?'",best:true,fb:"You separate the incident from the pattern. Delivering buys standing; the Monday conversation attacks the process, not the person — which is the only version she can say yes to."},
   {t:"Comply silently again. She's the boss; this is the job.",best:false,fb:"Three data points is a pattern, and silent compliance ratifies it. The cost lands on your team too — they're watching whether you protect their weekends or trade them."}]},
 {id:"gy3",who:"Your boss",title:"Flayed in front of your team",
  prompt:`In the team meeting, your MD picks your model apart in a tone two notches too sharp — in front of the three analysts who report to you.`,
  mech:`STATUS threat, amplified: criticism in front of your tribe cuts deeper than the same words alone, because standing with your own team is on the line. What's driving him: heat rarely originates where it discharges — he's most likely transmitting pressure from above, and you were the nearest conductor.`,
  options:[
   {t:"Defend the model line by line, matching his energy so the team sees you fight.",best:false,fb:"Now it's a status battle you can't win in public — he outranks you, and escalation reads as insecurity to the very audience you're protecting."},
   {t:"Stay level, concede what's fair, correct the factual points calmly — then privately: 'Content was fair game. The manner, in front of my team, undermines me. Bring it to me direct first.'",best:true,fb:"Composure in the room IS the status recovery — your team watches you absorb heat without catching fire. The private boundary handles the pattern, clean-anger style: behaviour, impact, request."},
   {t:"Absorb it, then vent to your team afterwards about what he's really like.",best:false,fb:"Venting downward trades your authority for sympathy and teaches your team that heat rolls downhill here. They need a transformer, not a second broadcaster."}]},
 {id:"gy4",who:"A peer",title:"The land grab",
  prompt:`In a leadership meeting you weren't warned about, a peer proposes his team absorb part of your remit "for efficiency". Heads nod. You feel your chest tighten.`,
  mech:`A rare triple: STATUS (your territory), CERTAINTY (blindsided), AUTONOMY (decided about you, without you). That's why the body slams so hard — three alarms at once. What's driving him: ambition plus opportunity; land grabs test for soft boundaries more than they target people.`,
  options:[
   {t:"Counter immediately by cataloguing his team's recent failures.",best:false,fb:"Attacking his team makes you the aggressor in the room's memory and converts a boundary defence into a feud. The nodding heads remember tone longer than content."},
   {t:"Slow the decision and take co-ownership of the process: 'Worth exploring — before anything moves, he and I should map the interfaces properly. We'll bring a joint recommendation next week.'",best:true,fb:"You can't win a surprise vote, but you can dissolve it. Slowing the clock restores certainty, joint ownership restores status, and next week's terms get set by preparation instead of ambush."},
   {t:"Say nothing in the room, then lobby your boss privately to shut it down.",best:false,fb:"Silence in the room reads as consent to everyone who was there — and back-channel reversals make you look political while he looks decisive. Contest it where it was raised."}]},
 {id:"gy5",who:"A peer",title:"The reply-all sniper",
  prompt:`A peer corrects a minor figure in your email — reply-all, seniors included. The correction is technically right and utterly unnecessary at that altitude.`,
  mech:`STATUS pressed via channel choice: the content is trivial, the audience is the message. What's driving them: visibility hunger — public corrections are a cheap way to look rigorous. Read it as their campaign, not your failure.`,
  options:[
   {t:"Reply-all with a detailed defence showing the figure was within rounding.",best:false,fb:"A reply-all duel over a rounding error makes both of you look small — and you'll have amplified his stage. Never fight for an audience he chose."},
   {t:"Reply-all once, brief and unbothered: 'Good catch, updated.' Then privately: 'If you spot something, flag it to me first — I'd do the same for you.'",best:true,fb:"Public composure starves the move of its payoff; the private line names the channel violation and sets the norm. You look bigger than the correction — which reverses the status math entirely."},
   {t:"Wait for his next email and return the favour with interest.",best:false,fb:"Now it's an arms race, and the seniors on the thread will remember two people who snipe — not who started it."}]},
 {id:"gy6",who:"A peer",title:"The eye-roll",
  prompt:`In planning, a chronically negative peer rolls his eyes before you've finished presenting your idea. You feel the surge before you can name it.`,
  mech:`Contempt cues — the eye-roll, the smirk — press STATUS and RELATEDNESS simultaneously; they signal 'you're not worth engaging', which the social brain registers as pain. What's driving him: habitual critics are usually protecting their own certainty — shooting down ideas is safer than being wrong about one.`,
  options:[
   {t:"Stop mid-sentence and call it out: 'Something to say about the eye-roll?'",best:false,fb:"Confronting the gesture makes the meeting about the gesture — he'll deny it, you'll look thin-skinned, and your idea dies unheard in the scuffle."},
   {t:"Finish your point, then hand him a genuine question: 'You look sceptical — what would need to be true for this to work?'",best:true,fb:"You convert the critic into a contributor on your terms. Either he engages properly (idea improves) or he has nothing (scepticism deflates in public). Both outcomes restore your standing without a shot fired."},
   {t:"Note it, finish quickly, and stop bringing ideas to that forum.",best:false,fb:"Retreat hands him the room permanently. Your ideas' exposure shouldn't be priced by his manners."}]},
 {id:"gy7",who:"Your team",title:"The counter-offer",
  prompt:`Your best analyst tells you a rival shop has offered 20% more. After two years of investing in her, the word that surfaces in you is 'betrayal'.`,
  mech:`RELATEDNESS pressed: the loyalty story ("after everything I did") converts a market event into a personal one. But check the story — she told you, which is the opposite of betrayal. What's driving her: market forces and a career, not a verdict on you.`,
  options:[
   {t:"Let the disappointment show: 'Honestly, after the opportunities I've given you, this stings.'",best:false,fb:"Guilt might buy three awkward months, but you'll have taught her that honesty gets punished — the next offer she gets, you'll hear about via her resignation."},
   {t:"Thank her for the openness, then get curious: 'Money aside — what would make staying the more compelling career?' Then genuinely explore both comp and the answer.",best:true,fb:"The betrayal feeling is a story; her telling you is trust. Treating it as a negotiation about her future — not your wound — is what actually retains people. And if she goes anyway, she goes as an ally."},
   {t:"Match the money that day and consider it solved.",best:false,fb:"Counter-offers that ignore the underlying reasons buy an average of months, not years. If she was underpaid, fix it — but the offer usually surfaced something money wasn't."}]},
 {id:"gy8",who:"Your team",title:"The shrug",
  prompt:`A mid-level analyst misses a third internal deadline and shrugs: 'It's only internal.' The shrug lands harder than the miss.`,
  mech:`The miss pressed FAIRNESS (others carry his slack); the shrug pressed STATUS — casual dismissal of a standard you own is dismissal of you. What's driving him: possibly overload, possibly genuine confusion about what matters; the shrug may be face-saving, not defiance.`,
  options:[
   {t:"Sharpen up: 'Only internal? That attitude is exactly the problem.'",best:false,fb:"You'd be answering the shrug, not the pattern — and character verdicts ('that attitude') trigger defence, not change. The real information stays hidden."},
   {t:"SBI plus curiosity: 'Three Tuesday cuts have landed late; the team builds on those, so others stayed late twice. That's the impact. Walk me through how you're prioritising — something isn't matching.'",best:true,fb:"Behaviour, impact, then a genuine question. Three misses usually has a cause — hidden workload, unclear priority, or a wrong belief about what internal deadlines are for. You can't fix which until he says."},
   {t:"Quietly route the important work around him from now on.",best:false,fb:"Avoidance freezes his growth and doubles everyone else's load — and he'll notice the routing without ever learning why. That's a slow firing you haven't admitted to."}]},
 {id:"gy9",who:"Your team",title:"Tears in a feedback meeting",
  prompt:`A junior tears up during routine feedback. You feel a flash of irritation — then guilt about the irritation.`,
  mech:`Your irritation is usually anxiety in disguise — their tears press your CERTAINTY button (script gone, no playbook) and quietly accuse your delivery. What's driving them: accumulated overload finding an exit, not manipulation — the feedback was the last straw, rarely the cause.`,
  options:[
   {t:"Wrap up fast and cover the rest by email to spare you both.",best:false,fb:"Fleeing teaches you both that emotion ends conversations — feedback gets rarer, which juniors experience as abandonment, not kindness."},
   {t:"Pause without drama: 'Take a second — feedback lands hard on a tired week, that's human.' Then finish gently, and separately check what else is on their plate.",best:true,fb:"Normalising the tears drains their shame and your awkwardness. Finishing the feedback preserves the standard; the workload check afterwards addresses the real cause."},
   {t:"Soften the message until it's barely feedback at all, and lower the bar going forward.",best:false,fb:"Diluted standards help no one — they'll plateau, and you'll quietly resent doing their thinking. Kindness is gentle delivery of the real message, not a different message."}]},
 {id:"gy10",who:"A client",title:"The moving goalposts",
  prompt:`On a call with your MD present, the client CFO rejects the deck for 'missing' analyses that were never in scope — with a tone that implies your team is out of its depth.`,
  mech:`FAIRNESS (goalposts moved) and STATUS (competence questioned in front of your MD) pressed together. What's driving him: client-side CFOs perform rigour for their own boards — the jab is often theatre for an audience you can't see.`,
  options:[
   {t:"Politely reference the scope email, on the call, so the record is straight.",best:false,fb:"You'd win the fact and lose the room — clients don't forgive being corrected in company, and your MD needs the relationship more than the point."},
   {t:"Let the jab pass, absorb the ask: 'We'll fold that in.' Then: 'So we stay efficient for you, let's lock the full scope on one page after this call.' Debrief facts with your MD after.",best:true,fb:"The one-pager fixes the actual problem (scope drift) without litigating blame. Your composure in front of the MD is worth more than the point you didn't score."},
   {t:"Apologise comprehensively and take full responsibility for the gap.",best:false,fb:"Absorbing blame for unrequested work sets the price of all future goalpost-moving at zero. Accommodation and self-indictment are different things."}]},
 {id:"gy11",who:"A client",title:"Radio silence",
  prompt:`A client goes silent for two weeks on a live deal. Your mind runs disaster scenarios on a loop, and yesterday you snapped at an analyst over nothing.`,
  mech:`CERTAINTY starvation: ambiguity is the one thing the threat system refuses to file, so it forecasts catastrophe instead. The snap at your analyst is pressure transmission — their silence became your team's weather. What's driving them: usually their own internal chaos; silence is rarely a verdict.`,
  options:[
   {t:"Escalate the check-ins — daily emails, calls to every contact you have.",best:false,fb:"Anxiety-volume reads as desperation and prices your position down. You'd be managing your feelings with their inbox."},
   {t:"Send one crisp, value-adding nudge, park the rest on the worry ledger, and tell your team the facts: 'No word — common at this stage. We prep as planned.'",best:true,fb:"One professional touch, then deliberate uncertainty-tolerance. Naming facts-versus-forecast for your team stops the transmission — and the ledger will tell you in a month how often silence meant death. (Rarely.)"},
   {t:"Assume it's dead, deprioritise it, and mention to peers the client was never serious.",best:false,fb:"Premature certainty is just anxiety wearing a conclusion. Deals resurrect weekly — and the 'never serious' line will travel."}]},
 {id:"gy12",who:"Family",title:"The comparison at dinner",
  prompt:`Family dinner in Singapore. An uncle loudly compares your career to your cousin's startup exit. Your father joins in rather than defending you. Something old flares in your chest.`,
  mech:`STATUS pressed inside the oldest tribe you have — which is why it burns hotter than any work slight. Your father joining in presses RELATEDNESS on top. What's driving them: the family status economy runs on comparison; your uncle is playing his own game, and your father is avoiding a challenge to his brother, not casting a verdict on you.`,
  options:[
   {t:"Answer with your own scoreboard — the title, the deals, the London salary converted to dollars.",best:false,fb:"Entering the comparison validates the game and stakes your worth on its next round. You cannot win a table whose rules are someone else's insecurity."},
   {t:"One warm line — 'we're all doing fine, uncle' — change the subject, and later find the one relative you actually talk to.",best:true,fb:"Declining the game beats winning it. The deflection costs two seconds of pride; the real connection afterwards is what family dinners are actually for. Your worth was never on that table."},
   {t:"Go quiet, leave early, and replay the conversation for the rest of the night.",best:false,fb:"Withdrawal plus rumination means their thirty seconds costs you six hours. If it needs addressing, address it once with your father, in private, on another day."}]},
 {id:"gy13",who:"Family",title:"The guilt call",
  prompt:`You missed a cousin's wedding for a deal closing. Your mother, on the phone: 'You've changed since London. You never think of us anymore.'`,
  mech:`RELATEDNESS pressed with a guilt payload wired in childhood — which is why it bypasses the composure you'd have with any colleague. What's driving her: loneliness expressed as accusation. 'You never think of us' almost always decodes to 'I miss you and I'm afraid of the distance.'`,
  options:[
   {t:"Defend the logistics — the closing timeline, the flight costs, why it was impossible.",best:false,fb:"You'd be answering the words instead of the feeling. She isn't running a tribunal on your calendar; the facts will win the argument and lose the call."},
   {t:"Answer the feeling underneath: 'You miss me. I miss you too — I hated missing it. Let's plan my next trip home right now, dates in the diary.'",best:true,fb:"Decode, reflect, then act. Guilt dissolves when the underlying bid for connection gets answered with something concrete. One diary entry beats an hour of defence."},
   {t:"Absorb it and promise you'll be at everything from now on.",best:false,fb:"Promises made from guilt get broken by reality, and each break recharges the accusation. Warm honesty about what's possible beats comprehensive commitments you can't keep."}]},
 {id:"gy14",who:"Partner & friends",title:"'You're always working'",
  prompt:`You postpone on your partner (or closest friend) twice in a week for work. When you finally sit down together: 'Honestly, you're always working.' You feel yourself flare defensively.`,
  mech:`The flare is the tell: it's guilt recognising truth, plus a FAIRNESS protest ('I do all this FOR us'). What's driving them: the complaint is a bid for connection — 'I miss you' in armour. Defensiveness answers the armour; the bid goes unanswered.`,
  options:[
   {t:"Itemise the pressure you're under and everything the job funds.",best:false,fb:"All true, all beside the point. They didn't audit your effort — they reached for you. A defended bid becomes a withdrawn one, and withdrawn bids are how relationships thin out."},
   {t:"Drop the shield: 'You're right — it's been too much, and I don't want it to be the pattern. Saturday is yours. No phone.'",best:true,fb:"Concede the truth, answer the bid, make it concrete. One protected Saturday repairs more than a flawless defence ever could — this is the 'small consistent deposits' lesson, live."},
   {t:"Go quiet and let it blow over — it always does.",best:false,fb:"It blows over the way interest accrues — invisibly. The complaint stops being voiced long before it stops being felt, and silence is the worst possible sign."}]},
 {id:"gy15",who:"Partner & friends",title:"The friend who only takes",
  prompt:`A close friend calls — again — to vent about his job for an hour. He never asks about yours. Tonight, after your own brutal week, you feel resentment rising as the phone buzzes.`,
  mech:`FAIRNESS pressed in the friendship ledger — but check both columns: you've never told him your actual state, so he's overdrawing an account he can't see. What's driving him: his own overflow, plus the comfortable assumption that you're always fine. Your polish costs you here too.`,
  options:[
   {t:"Let it ring tonight, and start letting it ring generally.",best:false,fb:"Ghosting punishes him for a rule he was never told. Slow withdrawal ends friendships that one honest sentence could have fixed."},
   {t:"Answer, and say it plainly once: 'I want to hear all of it — and I've had a brutal week myself, so I need the first ten minutes. Deal?'",best:true,fb:"You renegotiate the ledger by finally showing your column. Real friends adjust instantly when told — and 'lead with the real state, not the highlight reel' has to start with you."},
   {t:"Take the call, listen resentfully, say nothing about your week. Again.",best:false,fb:"Resentful listening isn't generosity — it's an invoice you're accruing in secret. He experiences a fine friendship while you experience an unfair one; only one of you can fix that, and it's not him."}]},
 {id:"b4",who:"Your boss",title:"Half-listening",
  prompt:`You're walking your boss through the plan you built for him — and he's on his phone. "Keep going, I'm listening." He isn't.`,
  mech:`STATUS and RELATEDNESS: divided attention reads as 'you don't matter'. What's driving him: overload, not verdict — seniors triage attention badly and rarely notice the cost.`,
  options:[
   {t:"Stop talking and wait in pointed silence until he looks up.",best:false,fb:"The silent standoff wins the moment and sours the room — he'll feel policed, and the plan still won't get real attention."},
   {t:"Pause at a natural break: 'This next part needs your eyes — want me to grab you later for ten focused minutes?'",best:true,fb:"You protect the work without indicting him. Most bosses take the out gratefully — and the rescheduled ten minutes beats a distracted thirty."},
   {t:"Rush through the rest, deflated, and hope the deck speaks for itself.",best:false,fb:"Decks don't defend themselves. You'd be trading your one live shot for a maybe-read attachment."}]},
 {id:"b5",who:"Your boss",title:"The vague verdict",
  prompt:`"It's not quite there yet. Make it better." No specifics, no direction — and the deadline hasn't moved.`,
  mech:`CERTAINTY starved: you can't hit a target nobody will describe. What's driving her: she may not know what 'there' is either — vagueness often hides an unformed opinion.`,
  options:[
   {t:"Rework everything overnight, guessing at what 'better' means.",best:false,fb:"Guessing multiplies work and randomises the outcome. If you guess wrong you're 'still not there' — twice as tired."},
   {t:"Extract the criteria on the spot: 'Help me calibrate — is it the storyline, the numbers, or the format? What does \"there\" look like to you?'",best:true,fb:"Three options force her vague feeling into a decision. Even 'the story is flat' is a target; and if she can't answer, you've learned the real problem isn't your draft."},
   {t:"Defend the current draft — it addressed everything from the last review.",best:false,fb:"True, maybe — but you'd be arguing against a feeling, and feelings don't lose arguments. Get the feeling converted into criteria first."}]},
 {id:"b6",who:"Your boss",title:"The favourite",
  prompt:`Third quarter running, the plum assignments go to the same peer. Your work is solid; the visibility keeps landing elsewhere.`,
  mech:`FAIRNESS plus STATUS, on a slow drip — the kind that curdles into resentment before it's ever said out loud. What's driving him: often pure inertia; he staffs whoever's proven the exact thing before.`,
  options:[
   {t:"Work even harder on the unglamorous work until it's impossible to ignore.",best:false,fb:"Quiet excellence at invisible work earns you more invisible work. The pattern needs words, not volume."},
   {t:"Make the direct, forward-looking ask: 'I want the next client-facing mandate. Here's why I'm ready — what would you need to see to give me one?'",best:true,fb:"No complaint about the peer, no litigation of the past — a specific ask plus the request for criteria. Bosses grant asks like this far more often than people make them."},
   {t:"Raise the fairness pattern: point out that he's given the peer three in a row.",best:false,fb:"Scorekeeping puts him on trial for the past and makes the peer your rival on record. The forward ask gets the same outcome without the friction."}]},
 {id:"b7",who:"Your boss",title:"The reversed decision",
  prompt:`Monday he agreed to your approach. Thursday, in front of the team: "I never signed off on that." You remember the conversation clearly.`,
  mech:`CERTAINTY shaken hard — being contradicted about shared reality is uniquely destabilising — plus STATUS in front of your team. What's driving him: usually sloppy memory under overload, occasionally deniability. Either way, the fix is the same.`,
  options:[
   {t:"Produce the receipts in the room: 'Monday, 3pm, your office — you approved exactly this.'",best:false,fb:"Even when you win, you lose: cornering your boss publicly converts a memory dispute into a loyalty question. Save the receipts; don't brandish them."},
   {t:"Bridge in the room — 'we may be remembering differently; let me recap where we are in writing after this' — then start confirming decisions by email, routinely.",best:true,fb:"Calm in the moment, structural for the future. A two-line recap email after every decision meeting protects you both — and it never has to be announced as distrust."},
   {t:"Doubt yourself and absorb it — maybe you misread the Monday conversation.",best:false,fb:"Once, maybe. As a pattern, absorbing it trains you to distrust your own record — which is exactly backwards. Write things down; trust your notes."}]},
 {id:"b8",who:"Your boss",title:"Hoarded information",
  prompt:`A peer casually mentions a restructure that will hit your team — your boss has known for weeks and told you nothing. You lead these people.`,
  mech:`CERTAINTY, RELATEDNESS and STATUS in one hit: kept in the dark, out of the circle, undermined as a leader. What's driving him: information hoarding is usually anxiety management — control of news feels like control of outcomes.`,
  options:[
   {t:"Confront it hot: 'Why am I hearing this from him and not you?'",best:false,fb:"A fair question ruined by its temperature. Accusation triggers justification, and you'll get a defence of secrecy instead of a change in behaviour."},
   {t:"Make it about your job, not your feelings: 'I heard about the restructure secondhand. To lead the team well I need this class of news from you first — can we agree on that?'",best:true,fb:"You convert the grievance into an operating requirement he can say yes to. 'I need it to do my job' is un-arguable in a way 'you hurt me' never is at work."},
   {t:"Start building your own intelligence network and stop relying on him.",best:false,fb:"Useful as a supplement, corrosive as a substitute — you'd be institutionalising the distrust instead of repairing the channel."}]},
 {id:"b9",who:"Your boss",title:"The impossible promise",
  prompt:`In the client meeting, your boss commits your team to a timeline you know is fiction. The client is delighted. You are doing maths.`,
  mech:`AUTONOMY and FAIRNESS: your team's nights sold without consent. What's driving him: the pull of a happy client in the room beats an abstract delivery problem later — classic temporal discounting under pressure.`,
  options:[
   {t:"Gently correct the timeline in front of the client before it sets.",best:false,fb:"Contradicting your boss mid-pitch costs him face and you trust, and clients smell disunity instantly. The room is not the venue."},
   {t:"Say nothing in the room; immediately after: 'That timeline needs surgery. Here's what's actually possible and two options to close the gap — and going forward, can we sanity-check commitments before they're made?'",best:true,fb:"You bring the problem with options while the promise is hours old and still cheap to amend — and the 'going forward' clause quietly addresses the pattern, not just the incident."},
   {t:"Absorb it and drive the team to deliver the fiction.",best:false,fb:"Heroics ratify the behaviour: every rescued impossible promise buys the next one. Your team pays the interest on his optimism."}]},
 {id:"b10",who:"Your boss",title:"Praise for the wrong thing",
  prompt:`He raves — publicly — about a summary slide that took you twenty minutes. The three-week analysis underneath it goes unmentioned.`,
  mech:`A STATUS misfire rather than a wound: recognition landed on the wrong target. What's driving him: he praises what he can see; the engine room is invisible from the bridge.`,
  options:[
   {t:"Correct him: 'That slide was the easy part, actually.'",best:false,fb:"You'd be refusing a gift and lecturing the giver. Praise corrected is praise withdrawn — from both sides."},
   {t:"Take it graciously, then steer: 'Glad it landed. The engine behind it is the three-week dataset — worth ten minutes sometime, it can answer much bigger questions.'",best:true,fb:"Accept the coin, then show the vault. You convert misdirected praise into curiosity about the real work — and position the analysis for reuse."},
   {t:"Note that effort is invisible here and quietly stop going deep.",best:false,fb:"One misread compliment is thin evidence for a career strategy. Make the deep work visible before concluding it doesn't pay."}]},
 {id:"pe4",who:"A peer",title:"The idea, re-branded",
  prompt:`Your suggestion from last week's coffee chat comes out of his mouth in the team meeting — polished, confident, and his.`,
  mech:`STATUS and FAIRNESS: authorship taken. What's driving him: sometimes theft, often genuine memory-blur — ideas absorbed in conversation really do resurface feeling self-made.`,
  options:[
   {t:"Flag it flatly: 'That was my idea — I told you last week.'",best:false,fb:"True, unprovable, and it makes you the small one in the room. Paternity disputes over ideas rarely have a winner."},
   {t:"Join and extend, planting the timestamp: 'Glad you ran with what we discussed last week — the next step I'd add is X.'",best:true,fb:"One clause reclaims authorship without an accusation, and extending the idea proves you're its source better than any protest could. Then guard future ideas: float them in writing."},
   {t:"Say nothing, and stop sharing thinking with him.",best:false,fb:"Half right — calibrate what you share. But total silence in the meeting cedes the idea's history, and withdrawal without words teaches him nothing."}]},
 {id:"pe5",who:"A peer",title:"The slow-roll",
  prompt:`His team has sat on your data request for three weeks — always a plausible reason, never a delivery. Your deadline is dying of it.`,
  mech:`AUTONOMY and FAIRNESS: your outcomes hostage to his queue. What's driving him: your priority isn't his priority — this is misaligned incentives wearing a person's face.`,
  options:[
   {t:"Send the chaser email with his boss and yours in cc.",best:false,fb:"Escalation-by-cc gets this one request moved and every future one slow-rolled harder. You'd win the battle and fund the war."},
   {t:"Fix the plumbing in person: 'Three requests have averaged three weeks — walk me through your queue? Let's agree what turnaround is realistic, and I'll escalate jointly with you if you're under-resourced.'",best:true,fb:"You attack the process, offer him an out (under-resourcing), and make any escalation collaborative. Slow-rolls usually die when the cost becomes visible and shared."},
   {t:"Build the workaround and stop depending on his team.",best:false,fb:"Sometimes necessary tactically — but as a strategy it duplicates work, hides the dysfunction from management, and leaves the next person to rediscover it."}]},
 {id:"pe6",who:"A peer",title:"The corridor recruiter",
  prompt:`You learn he's been quietly sounding out your best analyst about moving to his team. No word to you.`,
  mech:`RELATEDNESS and territory: it lands as betrayal-adjacent even though talent moves are normal. What's driving him: ambition plus cowardice about the awkward conversation with you.`,
  options:[
   {t:"Warn your analyst off him and his team.",best:false,fb:"Blocking your best person's options to protect your roster is the fastest way to actually lose them — people smell a cage."},
   {t:"Address him directly, light but clear: 'If you're interested in my people, come through me first — I'd do the same for you. And if it's genuinely a great move for her, we'll do it properly.'",best:true,fb:"You set the norm without hoarding the human. The second sentence is what makes the first credible — you're defending process, not property."},
   {t:"Raise it with your shared boss as a trust issue.",best:false,fb:"Escalating before the direct word makes it political and makes you look rattled. He gets the direct sentence first; the boss only if the pattern survives it."}]},
 {id:"pe7",who:"A peer",title:"The credit auditor",
  prompt:`In the project retro, he notes — accurately — that your win 'leaned heavily' on his team's data feed. The implication hangs there.`,
  mech:`STATUS under audit. The sting is sharpest because it's partially true — half-truths are harder to wave off than lies. What's driving him: his team's work was invisible in your applause, and he's correcting the ledger clumsily.`,
  options:[
   {t:"Minimise it: 'The data was table stakes — the model was the hard part.'",best:false,fb:"Now you're doing to him exactly what the applause did — erasing contribution. He escalates, you both shrink."},
   {t:"Practise generous accuracy: 'Completely — your feed was essential, and I should've said so louder. The modelling on top was ours. Team sport.'",best:true,fb:"Generosity costs you nothing real: credit isn't zero-sum, and the person who allocates it graciously reads as the senior one in the room."},
   {t:"Over-correct: thank his team so effusively that your own work disappears.",best:false,fb:"Appeasement isn't accuracy either. Name both contributions; erase neither."}]},
 {id:"pe8",who:"A peer",title:"One-upmanship",
  prompt:`Every story you tell, he tops. Your deal, his bigger deal. Your bad week, his worse one. It's exhausting and slightly ridiculous.`,
  mech:`BELONGING corroded by competition where connection was offered. What's driving him: chronic toppers are usually running a status anxiety loop — your stories register as threats, not conversation.`,
  options:[
   {t:"Escalate your stories until he can't top them.",best:false,fb:"Now there are two people playing a game nobody enjoys. Arms races bore everyone within earshot."},
   {t:"Step off the ladder: notice the game, stop competing, and ask him questions instead. Let him have the podium you never wanted.",best:true,fb:"The topping reflex is his need, not your scoreboard. Questions cost you nothing, starve the competition, and occasionally uncover the actual person under the highlight reel."},
   {t:"Start avoiding him entirely.",best:false,fb:"Avoidance is heavy machinery for a light annoyance — and in a team, distance you can't explain reads as coldness you have to manage."}]},
 {id:"pe9",who:"A peer",title:"Sandbagged in steering",
  prompt:`In the steering committee he voices 'concerns about the readiness' of your project. He has never once raised them with you.`,
  mech:`CERTAINTY (ambushed) and STATUS (doubted in the room that matters). What's driving him: raising concerns upward looks diligent and costs him nothing — the venue was the strategy.`,
  options:[
   {t:"Dismiss it in the room: 'That's the first I'm hearing of these concerns — odd timing.'",best:false,fb:"The jab lands but reads as defensive, and now the committee remembers friction, not facts. Insinuation is his weapon; don't borrow it."},
   {t:"Take it head-on and re-route it: 'Which risks specifically? Let's go through them together after this — and bring them to me first next time so we arrive aligned.'",best:true,fb:"Specificity is kryptonite for vague concerns — they either materialise into fixable items or evaporate on request. The 'next time' clause names the venue game without theatrics."},
   {t:"Return the favour at his next steering review.",best:false,fb:"Tit-for-tat institutionalises the sandbag. You'd be building the exact culture that just bit you."}]},
 {id:"pe10",who:"A peer",title:"The joke with teeth",
  prompt:`Third time this month: 'Look who's still here — some of us have actual lives.' Delivered as banter, in front of others, always at your hours.`,
  mech:`STATUS via mockery with deniability — 'it's just banter' is the armour. What's driving him: often discomfort with his own choices; your hours are a mirror he keeps joking at.`,
  options:[
   {t:"Snap back publicly next time: 'Some of us have actual careers.'",best:false,fb:"Now it's a public duel of insults with an audience scoring it. He got exactly the reaction the joke was fishing for."},
   {t:"Kill it with flatness in the moment — a level look, no laugh, subject change — and if it persists, one private sentence: 'The hours jokes have run their course.'",best:true,fb:"Banter dies without laughter. The flat non-response removes the payoff; the private sentence, if needed, names it once without making it a scene."},
   {t:"Laugh along every time and quietly resent it.",best:false,fb:"Your laughter is the licence. Resentment you fund yourself is the most expensive kind."}]},
 {id:"pe11",who:"A peer",title:"The salary discovery",
  prompt:`Through a slip in a shared document, you learn a peer at your level earns fifteen percent more. You can't unsee it.`,
  mech:`FAIRNESS, the purest hit of it — pay is the scoreboard of how the institution values you. What's driving the gap: rarely a verdict on you; usually negotiation history, market timing at hire, or a retention scare you never had.`,
  options:[
   {t:"Take the number to your boss: 'I know what he makes. Explain this.'",best:false,fb:"You'd burn the source, put him on the defensive about confidentiality instead of your comp, and anchor the conversation to grievance rather than value."},
   {t:"Use it as intelligence, not ammunition: gather market data, build your case on your scope and results, and negotiate at the next natural window — hard, calm, and without citing his number.",best:true,fb:"The number told you the ceiling is higher than you thought — that's leverage. Cases built on 'here's my market value' get funded; cases built on 'it's not fair' get sympathy."},
   {t:"Quietly recalibrate your effort down to what they apparently pay for.",best:false,fb:"Quiet-quitting punishes your own trajectory to spite the ledger. It guarantees the gap becomes deserved."}]},
 {id:"tm4",who:"Your team",title:"The silent meeting",
  prompt:`You ask the team for input. Silence. Later you discover a lively debate about exactly that topic — in a group chat without you.`,
  mech:`RELATEDNESS (excluded) and STATUS (the real meeting isn't yours) — but flip it: silence-then-side-chat is a psychological safety readout, and the reading is about the room, not their character.`,
  options:[
   {t:"Tell them you know about the chat and expect points raised with you first.",best:false,fb:"Policing the backchannel drives it deeper underground. You can't mandate safety; you can only demonstrate it."},
   {t:"Change what speaking up costs: seed questions to individuals before meetings, ask for written thoughts first, and — above all — respond to the next piece of dissent like it's a gift.",best:true,fb:"Silence is a price signal. Your reaction to the first risky opinion sets the price for all the rest — this is your own 'demanding and safe' lesson, pointed at you."},
   {t:"Get a trusted lieutenant to report what the chat is saying.",best:false,fb:"An informant converts a safety problem into a surveillance problem. When it surfaces — and it will — you'll have proven the silence right."}]},
 {id:"tm5",who:"Your team",title:"The over-promiser",
  prompt:`'Done by tonight, definitely.' It never is. Fourth time. You're starting to plan around his words meaning nothing, and it feels like being played.`,
  mech:`CERTAINTY eroded — you can't build on his commitments. What's driving him: over-promising is usually fear of disappointing you in the moment, paid for by disappointing you later. It's anxiety, not manipulation.`,
  options:[
   {t:"Silently double-check and shadow-plan everything he owns.",best:false,fb:"Your workaround hides the problem and doubles your load. He stays inaccurate; you become his buffer forever."},
   {t:"Make honesty cheaper than optimism: 'I'd rather have a true Thursday than a fictional Tuesday — I plan on your dates. Let's rebuild this estimate together and find what keeps inflating them.'",best:true,fb:"You name the cost, lower the fear, and coach the skill in one pass. Chronic over-promisers usually just need permission to say the real number."},
   {t:"Impose a rule: everything he estimates gets 50% added, and tell him so.",best:false,fb:"Public discounting humiliates without teaching. He'll just start sandbagging — same inaccuracy, opposite direction."}]},
 {id:"tm6",who:"Your team",title:"'Above my pay grade'",
  prompt:`A capable analyst escalates every judgement call to you — even ones squarely inside his role. 'Just wanted to check' arrives hourly.`,
  mech:`Your AUTONOMY is being consumed by his fear of blame. What's driving him: somewhere he learned that decisions are dangerous — a past boss, or your own reactions to early misses.`,
  options:[
   {t:"Keep deciding — it's genuinely faster than coaching.",best:false,fb:"Faster today, structural tomorrow: you're paying the tuition for a dependence habit. In a year you'll have a senior analyst who can't make a call."},
   {t:"Give him a decision band and a safety net: 'Anything under X, make the call and tell me after. Wrong calls inside the band cost nothing — that's what the band is for.' Then ratify his first few loudly.",best:true,fb:"The band converts vague permission into explicit licence, and how you treat his first wrong call inside it decides everything. Praise the deciding, coach the decision."},
   {t:"Force growth: hand him a big decision cold and let him sink or swim.",best:false,fb:"Trial by fire teaches fear of fire. Confidence builds on survivable stakes, not spectacular ones."}]},
 {id:"tm7",who:"Your team",title:"The resignation you resent",
  prompt:`Second resignation this quarter. You feel abandoned — and exposed, because leadership will ask what's wrong with your team.`,
  mech:`RELATEDNESS ('after everything') tangled with STATUS (what this says about you upstairs). Separate them: her career move is not a referendum on you — but two in a quarter is data worth mining honestly.`,
  options:[
   {t:"Go cold and procedural: minimal handover, done by Friday.",best:false,fb:"The freeze punishes her for a normal career move and broadcasts to the team that leaving costs the relationship. Alumni are networks, not traitors."},
   {t:"Exit her with genuine grace, then mine it: a real conversation about what would have kept her, an honest look at the pattern, and a pre-emptive note to your boss framing the retention plan.",best:true,fb:"Grace protects the relationship and the team's read of you; the mining converts the loss into intelligence; the upward framing answers the optics question before it's asked."},
   {t:"Counter-offer aggressively and lean on loyalty: 'after everything this team gave you.'",best:false,fb:"Guilt-based retention buys months and poisons them. If the reasons she's leaving are real, money delays the same conversation."}]},
 {id:"tm8",who:"Your team",title:"Two claims, one win",
  prompt:`The client win lands — and two of your reports each privately claim it was mostly theirs. Both are in your office by Friday.`,
  mech:`You're the FAIRNESS arbiter now, and whatever you decide becomes team case law. What's driving them: scarcity thinking — they believe credit divides. Your job is to prove it multiplies.`,
  options:[
   {t:"Split the difference vaguely: praise 'the team' and name no one.",best:false,fb:"Vague collective praise starves the very people who did the work — and teaches them that being specific with you is pointless."},
   {t:"Get specific and additive: name each person's actual contribution publicly — 'her model, his client instinct' — and say plainly that the win needed both.",best:true,fb:"Specific credit, accurately allocated, ends the dispute better than any ruling — and it sets the norm that visibility comes from contribution, not from claiming."},
   {t:"Reward the more convincing claimant.",best:false,fb:"You'd be paying the best self-marketer, and the team will learn the lesson instantly: lobbying beats delivering."}]},
 {id:"tm9",who:"Your team",title:"The Friday 4:55 disclosure",
  prompt:`At 4:55pm Friday, a report confesses an error he found on Monday. Five days of decisions were built on it. The lateness angers you more than the error.`,
  mech:`The error presses your CERTAINTY; the concealment presses TRUST. But read the causality: five days of silence is a fear readout — of you, or of the last boss who punished bad news.`,
  options:[
   {t:"Address the concealment first, hard: 'Monday. You knew Monday.'",best:false,fb:"Justified — and it guarantees the next error arrives even later. Heat now sets the price of every future disclosure."},
   {t:"Triage first, teach second: 'Thank you for telling me — let's contain it now.' Then, calmly, next week: 'What made it hard to bring me this on Monday?' And actually listen to the answer.",best:true,fb:"Contain, then learn. The question matters more than any lecture — his answer tells you whether the fear is inherited or earned, and both are fixable once named."},
   {t:"Fix it quietly yourself and file it away for his year-end review.",best:false,fb:"The silent ledger is the worst of all worlds: he learns nothing, you carry resentment for months, and the feedback arrives too stale to use."}]},
 {id:"tm10",who:"Your team",title:"Managing your friend",
  prompt:`You were promoted over a good friend. Now he's testing it — talking over you in meetings, relitigating your calls, invoking the friendship when challenged.`,
  mech:`RELATEDNESS and STATUS in a knot: every act of authority feels like a betrayal of the friendship; every act of friendship undermines the authority. What's driving him: loss — of the peer relationship, and maybe of the promotion.`,
  options:[
   {t:"Over-correct: be visibly harder on him than anyone, so nobody can allege favouritism.",best:false,fb:"Punishing him for your promotion is its own unfairness — and he'll feel the friendship weaponised against him."},
   {t:"Have the two-hats conversation privately and explicitly: 'The friendship matters and it's not going anywhere. At work I have to hold the same line with you as everyone — here's how I need meetings to work. Call out if I ever get the hats wrong.'",best:true,fb:"Naming the awkwardness dissolves most of it. The explicit contract — plus inviting him to police your side too — makes the new geometry mutual instead of imposed."},
   {t:"Let the meeting behaviour slide — it's the tax on the friendship.",best:false,fb:"The team is watching him relitigate you in public. What you tolerate from a friend becomes the ceiling of your authority with everyone."}]},
 {id:"cl3",who:"A client",title:"The scope creep smile",
  prompt:`"While you're in there, could you just also model the downside case? Shouldn't take long." Third 'just also' this month, delivered with total charm.`,
  mech:`FAIRNESS eroded by niceness — charm makes the extraction feel unchargeable. What's driving them: it works. Every absorbed 'just also' prices the next one at zero.`,
  options:[
   {t:"Absorb it again — the relationship is worth more than the hours.",best:false,fb:"The relationship isn't what's being tested; your boundary is. Absorbed creep compounds until the account is unprofitable and your team is bitter."},
   {t:"Yes-and-price it, warmly: 'Happy to — that's beyond the current scope, so let me send you the impact on timeline and fees today, and you decide.'",best:true,fb:"You never say no; you attach the price tag and hand them the decision. Charm meets commerce — most 'just alsos' quietly evaporate when they cost something."},
   {t:"Draw the line: 'That's out of scope, I'm afraid.'",best:false,fb:"Right boundary, brittle delivery. A flat no with no path forward reads as unhelpful; the priced yes gets the same protection with none of the friction."}]},
 {id:"cl4",who:"A client",title:"The screamer",
  prompt:`The client director is shouting — actually shouting — on the call about a delay that was substantially his own team's doing. Your people are on the line, listening.`,
  mech:`FAIRNESS (misassigned blame) and the raw contagion of someone else's rage. What's driving him: he's performing for someone — his boss is probably angrier at him than he is at you.`,
  options:[
   {t:"Correct the record now: walk through whose approvals came late.",best:false,fb:"Accurate and fatal. A man mid-performance cannot concede causality; you'd be feeding the fire evidence to burn."},
   {t:"Drop your voice low and slow, acknowledge the impact without accepting the causality — 'this delay is hurting you, and we're going to fix it; here's the next 48 hours' — and park the post-mortem for later, in writing.",best:true,fb:"Low and slow is physiologically disarming. You validate the pain, commit to motion, and defer the blame question to a venue where facts beat volume. Your team hears composure under fire."},
   {t:"Match his energy so he knows you can't be bullied.",best:false,fb:"Two people shouting is a relationship ending in real time — with your analysts as the audience."}]},
 {id:"cl5",who:"A client",title:"Ghost, then grenade",
  prompt:`Three weeks of silence on every email. Then Friday, 6pm: 'Need the full pack Monday 9am. Where are we?' As if the silence were yours.`,
  mech:`FAIRNESS and AUTONOMY: their disorganisation delivered as your emergency. What's driving them: internal chaos on their side — someone senior just asked THEM the same question.`,
  options:[
   {t:"Point out, politely, the three weeks of unanswered emails before committing to anything.",best:false,fb:"The receipts are real, but Friday 6pm is not the tribunal. Scorekeeping while they're in crisis reads as unhelpfulness with a timestamp."},
   {t:"Deliver what's genuinely possible — 'here's what you'll have Monday 9, full pack Wednesday' — then, once the fire's out, reset the cadence: a standing 30-minute weekly so this can't recur.",best:true,fb:"Help first, fix the system second. The weekly cadence is the real move — it converts their chaos from your recurring emergency into a managed rhythm."},
   {t:"Pull the all-nighter and deliver the full pack Monday, again.",best:false,fb:"Heroics teach the client that silence-then-grenade works perfectly. You'd be rewarding the exact behaviour that's burning you."}]},
 {id:"cl6",who:"A client",title:"Your junior, condescended to",
  prompt:`On every call, the client VP talks over your analyst, dismisses her answers, then asks you the identical question. She's visibly shrinking.`,
  mech:`Her STATUS is being ground down and — watch it — your RELATEDNESS to her is being tested: the team is learning whether you protect people or revenue. What's driving him: cheap dominance where he thinks it's costless.`,
  options:[
   {t:"Coach her privately to toughen up — clients are like this.",best:false,fb:"You'd be socialising his behaviour as her deficiency. She doesn't need thicker skin; she needs a leader who redirects the grinding."},
   {t:"Re-route in the moment — 'She's closest to the data, I'd let her finish' — hand questions back to her deliberately, and if it persists, one quiet word with the client lead about how the sessions run best.",best:true,fb:"Live redirection restores her standing where it was taken; the offline word handles the pattern without a scene. Your analyst will remember this call for years — one way or the other."},
   {t:"Absorb her airtime yourself so there's nothing for him to dismiss.",best:false,fb:"Shielding by erasure completes his work for him — she disappears from her own account."}]},
 {id:"cl7",who:"A client",title:"The competitor whisper",
  prompt:`'I'll be honest — the other firm came in well under you. I like you guys, but I have to justify this upstairs.' It smells like a squeeze.`,
  mech:`CERTAINTY (is the deal dying?) and FAIRNESS (is this real or theatre?). What's driving them: sometimes a genuine budget bind, often a standard procurement lever. Panic is the only wrong read.`,
  options:[
   {t:"Protect the deal: offer a discount on the spot.",best:false,fb:"An instant concession confirms your price was padded and teaches them that this whisper works annually. Discounts requested casually should never be granted casually."},
   {t:"Hold, calmly, and reframe the axis: 'Understood — help me see what they scoped, because pricing only compares on identical work. Here's what ours includes and where it earns its fee. If budget is the binding constraint, we can re-scope rather than re-price.'",best:true,fb:"Scope-versus-price is the professional's ground: you respect the pressure, refuse the squeeze, and offer a path that trades work for money instead of just money."},
   {t:"Call the bluff: 'Then take the cheaper firm.'",best:false,fb:"Machismo as strategy. Even if it's a bluff, you've made continuing feel like a defeat for him — and he has a boss watching too."}]},
 {id:"cl8",who:"A client",title:"Wrong, and very senior",
  prompt:`In the board-adjacent meeting, the client CEO confidently states a 'fact' about your model that is simply wrong — and builds his next point on it.`,
  mech:`CERTAINTY versus STATUS at maximum altitude: let the error stand and it becomes the record; correct him flatly and you've corrected a CEO in his own boardroom.`,
  options:[
   {t:"Correct it precisely and immediately — accuracy is what you're paid for.",best:false,fb:"Accuracy delivered as public correction of a CEO costs more than the error did. There's a version that gets truth AND keeps face — use it."},
   {t:"Offer the exit ramp: 'There's a version of the model where that holds — for this one, the driver is X, which actually strengthens your point about Y. Happy to walk anyone through the detail after.'",best:true,fb:"You fix the record while handing him a bridge — 'a version where that holds' lets him be almost-right, and tying the truth to HIS point makes correction feel like support."},
   {t:"Let it stand and correct it quietly in the follow-up note.",best:false,fb:"Decisions were being built on it in the room. A correction that arrives after the concrete sets is a memo, not a fix."}]},
 {id:"cl9",who:"A client",title:"The nudge to soften the numbers",
  prompt:`'Could the downside scenario feel a bit less... alarming? The committee gets nervous.' He isn't asking you to lie. He's asking you to make the truth quieter.`,
  mech:`Integrity pressure wrapped in politeness — FAIRNESS to yourself and to whoever relies on the work. What's driving him: fear of his own committee, borrowing your credibility to manage it.`,
  options:[
   {t:"Soften it — the base case is unchanged, and the relationship matters.",best:false,fb:"Today it's tone; the next ask is substance, and you've already shown the line moves. Numbers that bend for nerves aren't analysis, they're decoration."},
   {t:"Hold the numbers, offer legitimate framing: 'The scenarios stay as modelled — that's what protects you if it's ever questioned. What I can do is add context: likelihood, mitigants, and what would have to be true. That usually settles committees better than softer numbers.'",best:true,fb:"A calm boundary plus a genuine alternative — you refuse the massage while solving his actual problem, which was the committee's fear, not the font size of the downside."},
   {t:"Refuse on principle, with a short lecture about integrity.",best:false,fb:"Right answer, wrong music. The sermon humiliates him for asking; the boundary-plus-alternative gets compliance AND keeps him."}]},
 {id:"fa3",who:"Family",title:"The loan that isn't a loan",
  prompt:`A relative asks to 'borrow' a sum everyone silently knows will never return. Your father has already implied that saying yes is what family does.`,
  mech:`FAIRNESS versus duty, with the family honour economy as enforcement. What's driving them: real need, probably — and a system where the London salary is presumed communal.`,
  options:[
   {t:"Lend the full amount, resentfully — refusing costs too much politically.",best:false,fb:"Resentful lending buys neither peace nor gratitude: you'll be angry about the money AND the next ask, which your yes just scheduled."},
   {t:"Decide what you can give freely — as a gift in your own head, sized so its loss costs you nothing — offer that, and hold it: 'This is what I can do.'",best:true,fb:"The reframe from loan to mental gift removes the resentment engine entirely — no repayment to track, no betrayal to feel. The cap does the boundary work without a confrontation."},
   {t:"Escape with a soft fiction: money's tied up right now, markets, you know how it is.",best:false,fb:"Fictions need maintenance and relatives compare notes. One honest capped offer beats a decade of remembering what you told whom."}]},
 {id:"fa4",who:"Family",title:"The report card at thirty",
  prompt:`Sunday call. Your father, casually: 'And the bonus this year? Ravi's son cleared how much, you think?' The audit has begun.`,
  mech:`STATUS inside the oldest hierarchy, and for a father who runs a narcissistic pattern, your numbers are his currency. Remember the ration: achievements shared become trophies or comparisons.`,
  options:[
   {t:"Give him the number — it's good this year, and maybe it finally settles something.",best:false,fb:"It settles nothing; it restocks. A good number becomes his bragging chip and next year's floor. The audit is not passable — that's the design."},
   {t:"The warm broken record: 'Work's going well, I'm happy with the year.' Repeat as needed, unchanged, then ask about his garden.",best:true,fb:"No numbers, no JADE, no coldness — a boundary in the shape of a pleasant sentence. The pivot to his world isn't evasion; it's steering toward the relationship that's actually possible."},
   {t:"Deflect with a joke about London taxes eating everything.",best:false,fb:"Humour works once, but jokes about the topic keep the topic alive — and self-deprecation about money invites the audit to dig deeper 'in concern'."}]},
 {id:"fa5",who:"Family",title:"The WhatsApp landmine",
  prompt:`The extended-family group chat: an uncle posts inflammatory politics, then tags you — 'what does our London banker think?' Forty relatives watching.`,
  mech:`A BELONGING trap: engage and you're the arrogant foreign liberal; ignore and you're too grand for family. The tag is the game — your discomfort is the entertainment.`,
  options:[
   {t:"Write the careful, sourced, three-paragraph reply the topic deserves.",best:false,fb:"Nobody in a family group chat has ever been persuaded by paragraphs. You'd be feeding an arena that only wants the spectacle of you in it."},
   {t:"One light line that declines the bait without disrespect — 'above my pay grade, uncle 😄 — someone post the wedding photos instead' — and take anything real to a private chat.",best:true,fb:"Deflection with warmth beats both silence and essays: you stay in the family without entering the ring. The photo request redirects the room better than any argument."},
   {t:"Mute the group and stop responding entirely.",best:false,fb:"Muting is fine for sanity — but pure silence gets narrated for you ('too important for us now'). One light line every so often keeps your absence from becoming a story."}]},
 {id:"fa6",who:"Family",title:"The visit inspection",
  prompt:`Your parents are visiting London. By day two your mother has reorganised the kitchen, commented on your fridge, your hours, and the 'state' of a flat you find perfectly clean.`,
  mech:`AUTONOMY pressed in the one territory that's yours — but decode the behaviour: reorganising your kitchen is how she still gets to mother you from eight time zones away. The control IS the love, badly translated.`,
  options:[
   {t:"Assert the boundary on everything: this is my home, my systems, please stop.",best:false,fb:"Winning every square metre turns the visit into a border dispute. She'll comply, hurt — and you'll have spent the week defending cutlery placement."},
   {t:"Choose two battles and release the rest: let the kitchen reorganisation land as the care it is, and hold the line warmly on the one or two comments that actually cut.",best:true,fb:"Strategic surrender on the harmless stuff costs you nothing and gives her the mothering she flew eleven hours to do. Saving the boundary for what matters makes it audible when you use it."},
   {t:"Go quiet and endure the week — it's only ten days.",best:false,fb:"Teenage silence in a thirty-year-old body. You'd protect nothing and connect with no one, and she'll feel the wall without understanding it."}]},
 {id:"fa7",who:"Family",title:"Praised at your sibling",
  prompt:`Family gathering. 'Look at him — London, big job. And you?' — the last two words aimed at your struggling sibling, using your success as the stick.`,
  mech:`A poisoned STATUS gift: the praise is real but it's being weaponised against someone you love, and the pedestal comes with guilt pre-installed.`,
  options:[
   {t:"Accept the praise graciously and let the moment pass — it's not your comparison.",best:false,fb:"Silence co-signs it. Your sibling won't remember who made the comparison; they'll remember you standing comfortably on it."},
   {t:"Redirect the frame in the moment — 'careers aren't a race, and she's building something real' — and find your sibling privately later: solidarity, not charity.",best:true,fb:"The public redirect defuses the weapon without a scene; the private word is what your sibling will actually keep. Refusing the pedestal costs you nothing you wanted."},
   {t:"Deflate your own success — 'it's just a job, mostly spreadsheets, honestly it's nothing.'",best:false,fb:"Self-erasure doesn't protect your sibling; it just adds a second casualty. The problem was the comparison, not your career."}]},
 {id:"fa8",who:"Family",title:"The health news, withheld",
  prompt:`Your aunt lets it slip: your father had a health scare three weeks ago. Hospital, tests, the works. Nobody told you. 'We didn't want to worry you in London.'`,
  mech:`RELATEDNESS breached from the outside — excluded from your own family's emergency — with distance-guilt detonating on top: the move abroad made them protect you like a guest.`,
  options:[
   {t:"Call and let the hurt lead: 'How could you keep this from me?'",best:false,fb:"The accusation lands on people who were frightened and made a clumsy loving choice. They'll defend the secrecy instead of changing it."},
   {t:"Answer the fear under the secrecy: 'I want to be worried — that's my job. Being in the dark is worse than any news.' Then build the channel: regular calls with the doctor cousin, and a visit in the diary now.",best:true,fb:"You correct the premise — protection-by-silence — without punishing the protectors, and the concrete channel plus the booked flight does more than any promise to 'communicate better'."},
   {t:"Spiral privately: this is what moving abroad costs; maybe they're right that you're not really there.",best:false,fb:"The guilt is real; its verdict is not. Distance changed the logistics of belonging, not the fact of it — build the channel instead of prosecuting yourself."}]},
 {id:"pf3",who:"Partner & friends",title:"The neutral face",
  prompt:`Third dinner party of theirs you've arrived late to, straight from the office. This time there's no annoyance when you slip in — just a neutral 'hey'. The neutrality scares you more than anger did.`,
  mech:`Read the signal: anger is investment; neutrality is withdrawal-in-progress. Their FAIRNESS protest went unanswered so long it stopped being worth making.`,
  options:[
   {t:"Explain the deal timeline again — this quarter is genuinely exceptional.",best:false,fb:"Every quarter has been genuinely exceptional. The explanation is true and irrelevant: they stopped needing reasons around the second dinner."},
   {t:"Name it and repair with behaviour: 'I've been late to three of these and I hate what that says. The next one, I'm there at seven, phone off' — and then be there at seven, phone off.",best:true,fb:"Withdrawal reverses on evidence, not apology. One fully-present arrival rebuilds more than any speech — and naming the pattern yourself tells them you saw it before losing them entirely."},
   {t:"Send something generous tomorrow — great wine, a proper gift, a long message.",best:false,fb:"Gifts are presence substitutes, and they've had enough substitutes. The currency they're owed is you, at seven, phone off."}]},
 {id:"pf4",who:"Partner & friends",title:"'You're rich, you get it'",
  prompt:`Every bill, the same joke: 'Banker's got it, right?' You've quietly covered the last four dinners. It's stopped being funny and started being policy.`,
  mech:`FAIRNESS in the friendship ledger, tangled with guilt about earning more — which is exactly what the joke leans on. What's driving them: drift, mostly; comfortable arrangements calcify unless someone speaks.`,
  options:[
   {t:"Keep paying — you CAN afford it, and money shouldn't matter between friends.",best:false,fb:"It's not the money, it's the assumption — and resentment funded quietly compounds. 'Shouldn't matter' is doing a lot of unpaid work in that sentence."},
   {t:"Name it once, lightly, and set the new normal: 'I'm happy to treat sometimes — but let's split as the default, it keeps things clean.' Then just split, without ceremony.",best:true,fb:"One clean sentence beats forty silent invoices. Real friends recalibrate instantly; the awkwardness lasts a minute, the resentment would have lasted years."},
   {t:"Start ordering less and reaching slowly for the bill until they notice.",best:false,fb:"Passive signalling makes them guess at a grievance you won't name. Nobody decodes a slow reach; they just notice you got weird about dinner."}]},
 {id:"pf5",who:"Partner & friends",title:"Solutions at the wrong moment",
  prompt:`Brutal day. You start telling your partner about it and within ninety seconds they're fixing: 'Have you tried talking to HR? You should just—'. You feel yourself shutting down mid-sentence.`,
  mech:`A care mis-tune, not a care failure: they're pressing CERTAINTY (solve it!) when you needed RELATEDNESS (see me). Your shutdown reads to them as rejection of help — two good intentions missing in the dark.`,
  options:[
   {t:"Snap the honest thing: 'You never just listen.'",best:false,fb:"'Never' converts a mis-tune into an indictment. They'll defend their helpfulness, and now there are two hurt people and still no listening."},
   {t:"Ask for the mode you need, explicitly: 'Can I get ten minutes of just venting first? Then I genuinely want your take.' — and later, agree the shorthand for next time.",best:true,fb:"Nobody can tune to an unnamed channel. The explicit ask gets you tonight's listening; the shorthand ('venting or fixing?') upgrades every future hard day. This is emotional granularity as a couple's skill."},
   {t:"Stop bringing work home — it's easier to decompress alone.",best:false,fb:"Easier tonight, expensive forever: you'd be solving a tuning problem with distance, and the distance becomes its own problem."}]},
 {id:"pf6",who:"Partner & friends",title:"The success that stings",
  prompt:`Your closest friend's startup just exited. Life-changing money. You're genuinely happy for him — and underneath, unmistakably, something green and sour you're ashamed of.`,
  mech:`Envy and love coexisting — both real, neither cancelling the other. The shame is the only unnecessary part: comparison with a friend's peak is wiring, not character.`,
  options:[
   {t:"Create a little distance until the feeling settles — see him less for a while.",best:false,fb:"Distance protects your comfort at the exact moment friendship is being tested. He'll notice the flatness precisely because it's his biggest week."},
   {t:"Congratulate him at full volume — the friendship deserves it whole — and privately treat the envy as data: what exactly does his exit make you want? Freedom? A swing of your own? Take that to your values, not your shame.",best:true,fb:"You can celebrate him completely AND mine the sting — envy is the most honest career counsellor you have, once it's read instead of suppressed. Both moves beat pretending either feeling isn't there."},
   {t:"Perform the enthusiasm and quietly stew — the feeling is too ugly to look at.",best:false,fb:"Suppressed envy leaks — as edge, as absence, as the joke with teeth. Looking at it directly is what defuses it."}]},
 {id:"pf7",who:"Partner & friends",title:"'Too big for us now'",
  prompt:`The Singapore group chat is planning the reunion. You can't make the dates — again. Someone writes: 'Leave him, lah. Too big for us now.' A joke. Mostly.`,
  mech:`BELONGING strained by distance and by the story forming in your absence — the chat is writing your character while you're not in the room. What's driving them: they miss you, and mockery is how the group grieves.`,
  options:[
   {t:"Type the long message: work realities, time zones, flight costs, how unfair 'too big' is.",best:false,fb:"A defence brief confirms the distance it argues against. Nobody wanted the explanation; they wanted the person."},
   {t:"Send a voice note — your actual voice: 'Oi. I miss you idiots. These dates are impossible, but I'm booking for [real date] — who's in?' Then book it.",best:true,fb:"Voice carries what text can't — warmth, accent, home. And a concrete counter-date converts 'he never comes' into 'he's coming in March'. The story dies of contact with the person."},
   {t:"Go quiet in the chat — the joke stung more than they know.",best:false,fb:"Silence waters the exact seed they planted. The wound wants tending, but in person — or by voice — not by withdrawal."}]},
 {id:"pf8",who:"Partner & friends",title:"'Where is this going?'",
  prompt:`Your partner asks the question you've deferred twice already: 'Where is this going?' And you hear yourself begin, again, with 'once this deal closes—'`,
  mech:`Their CERTAINTY about their own life is hostage to your calendar — and your deferral IS an answer, just the worst available one. What's driving the dodge: not doubt about them, usually — fear of deciding anything else while everything feels mid-flight.`,
  options:[
   {t:"'After this quarter, I promise — I just can't think about this properly right now.'",best:false,fb:"Third deferral reads as verdict regardless of intent. There will always be a quarter. They're not asking for a wedding date; they're asking if they're a priority or a default."},
   {t:"Stop the reflex mid-sentence and give the conversation real time this week — phones off, honest, whatever the answer actually is. If it's 'I want this, and here's what the next year looks like,' say that. If you genuinely don't know, say THAT — with a date by which you will.",best:true,fb:"The deal will survive one honest evening; the relationship may not survive another deferral. Even 'I don't know, and here's when I will' is a real answer — it treats them as someone with a life to plan."},
   {t:"Answer with a gesture — book the big trip, let it speak for itself.",best:false,fb:"Grand gestures are eloquent about affection and silent about direction. They asked a question; book the conversation before the flights."}]},
 {id:"pf9",who:"Partner & friends",title:"Cancelled on, for once",
  prompt:`You moved mountains to protect this evening — and your friend cancels forty minutes before, with a flimsy reason. The irony of your own rage is not lost on you.`,
  mech:`FAIRNESS with a mirror in it: you've been the canceller for years, and the fury has a guilt-lining. Their flimsy reason presses the same button your 'deal closing' pressed on them.`,
  options:[
   {t:"Fire back the loaded 'no worries!! 👍' and add it to a private ledger.",best:false,fb:"The exclamation marks fool no one. Ledgered grievances pay out eventually — always at the worst moment, always with interest."},
   {t:"Say the plain true thing without the ledger: 'Ah, that's genuinely disappointing — I'd carved tonight out. Rebook for next week?' And privately, let the sting teach you what your own cancellations have been landing like.",best:true,fb:"Disappointment expressed cleanly is intimacy, not conflict — friends can hold it. And the mirror is the real gift: now you know the feeling from the inside. Spend it on your own reliability."},
   {t:"Let it go completely — you of all people have no standing to mind.",best:false,fb:"Your history doesn't disqualify your feelings; it contextualises them. Swallowed disappointment plus guilt is a worse cocktail than either alone."}]},
 {id:"mp1",who:"Meetings & politics",title:"Interrupted, again",
  prompt:`Third time this meeting: you're four words into your point and he's talking over you. The room lets it happen.`,
  mech:`STATUS trimmed in public, in slices too thin to protest individually — that's what makes interruption patterns so corrosive. What's driving him: conversational habit plus a room that's never priced it.`,
  options:[
   {t:"Yield each time — fighting for airtime looks needy.",best:false,fb:"Habitual yielding teaches the room your points are optional. Airtime isn't vanity; it's how your work gets weighed."},
   {t:"Hold the floor calmly and physically: a raised hand, level voice — 'Let me land this point' — then finish, unhurried. If the pattern survives, one private word.",best:true,fb:"'Let me land this point' is five words that reclaim the floor without a duel — no accusation, no heat, just continuation. Rooms recalibrate fast when someone holds ground gracefully."},
   {t:"Interrupt him right back at his next point.",best:false,fb:"Symmetry feels like justice but reads as squabbling — and he's better at it than you, from practice."}]},
 {id:"mp2",who:"Meetings & politics",title:"Ninety seconds at the end",
  prompt:`You were given ten minutes on the agenda. The meeting ran long, everyone's packing up, and the chair says: 'Quick version? Ninety seconds.'`,
  mech:`FAIRNESS (your slot consumed by others' overruns) and a status test in miniature: how you handle compression IS the presentation now.`,
  options:[
   {t:"Race through all twelve slides at double speed.",best:false,fb:"A sprint through twelve slides communicates exactly one thing: panic. Nobody retains sprayed content."},
   {t:"Deliver the headline like it was the plan all along: 'One slide, one ask — here's the finding, here's the decision I need, detail is in your inboxes tonight.' Then pre-book a real slot next time, first on the agenda.",best:true,fb:"Grace under compression is a senior signal — arguably better than the ten minutes would have been. The follow-up note carries the detail; the composure carries you."},
   {t:"Decline pointedly: 'This needs the full ten minutes — I'll wait for a proper slot.'",best:false,fb:"Technically fair, practically self-defeating: you'd convert a scheduling accident into a visible sulk, and the decision you needed slips a month."}]},
 {id:"mp3",who:"Meetings & politics",title:"The meeting before the meeting",
  prompt:`Halfway through the 'decision meeting' you realise the decision is already made — settled on a call you weren't invited to. This meeting is theatre.`,
  mech:`CERTAINTY (blindsided) and RELATEDNESS (outside the real circle). What's driving it: pre-alignment isn't necessarily conspiracy — it's how organisations actually decide. The question is why you weren't in the pre-round.`,
  options:[
   {t:"Relitigate the decision in the room — the arguments weren't properly tested.",best:false,fb:"Arguing with a decision that's already social reality makes you the person who 'doesn't read rooms'. The meeting was never the venue; it was the announcement."},
   {t:"Play the actual game: log the decision gracefully today, then start doing your own pre-alignment before big meetings — and ask your sponsor directly how to get into the pre-rounds that touch your remit.",best:true,fb:"Pre-alignment is a skill, not a scandal. The ask to your sponsor is the key move: naming that you want in — calmly, once — is how the circle usually opens."},
   {t:"Disengage: if decisions happen elsewhere, stop investing in the theatre.",best:false,fb:"Cynicism reads instantly and compounds the exclusion. Absent from the theatre AND the pre-rounds is the worst seat in the house."}]},
 {id:"mp4",who:"Meetings & politics",title:"'Can you take the notes?'",
  prompt:`For the fourth consecutive leadership meeting, the chair turns to you — the same seniority as everyone at the table: 'Can you do the honours with notes?'`,
  mech:`STATUS by a thousand small assignments: the note-taker is heard less and remembered less. What's driving it: unexamined habit — you did it well once and became the default.`,
  options:[
   {t:"Take them again, resentfully — it's not worth a scene.",best:false,fb:"It's never worth a scene, which is how it becomes permanent. Roles assigned four times are yours until you speak."},
   {t:"Accept once more while installing the fix: 'Happy to — and let's rotate it going forward; I'll set up the rota today.' Then actually send the rota.",best:true,fb:"You solve it structurally in one breath — no grievance, no confrontation, just a system that makes the default impossible. Sending the rota same-day is what makes it real."},
   {t:"Decline flatly: 'I did them last time. Someone else's turn.'",best:false,fb:"Correct in substance, sharp in a room that hasn't heard the pattern named. The rota gets the same result and makes you the organised one instead of the prickly one."}]},
 {id:"mp5",who:"Meetings & politics",title:"The pile-on",
  prompt:`An absent colleague is getting shredded — some of it fair, most of it sport. Someone turns to you, grinning: 'You've worked with him. Go on.'`,
  mech:`BELONGING offered at someone else's expense — the cheapest membership fee there is. Whatever you say lands twice: on the absent colleague eventually, and on the room's read of your character now.`,
  options:[
   {t:"Add something mild and jokey — refusing outright reads as sanctimonious.",best:false,fb:"Mild contributions still co-sign the pile-on, and corridors have excellent acoustics. Everyone in that room now also knows what happens when THEY'RE absent."},
   {t:"Decline without the sermon: 'He's had a rough stretch — anything real here, let's put it to him directly.' Then move the topic along.",best:true,fb:"One neutral sentence ends your part in it without indicting anyone. Quietly refusing pile-ons is one of the fastest reputations you can build — people file away who's safe."},
   {t:"Call out the room: 'This is exactly the gossip culture that's poisoning this team.'",best:false,fb:"The lecture converts you from non-participant to prosecutor. You wanted out of the game, not a starring role in a new one."}]},
 {id:"mp6",who:"Meetings & politics",title:"Blank, on the spot",
  prompt:`The CFO turns to you: 'What's our exposure on that book?' You know this number. You knew it an hour ago. Your mind is a white corridor.`,
  mech:`Acute STATUS threat triggering the exact freeze it fears — working memory is the first casualty of the spotlight. Everyone at that table has had this moment; composure about the blank matters more than the blank.`,
  options:[
   {t:"Approximate confidently — a wrong-ish number beats a silence.",best:false,fb:"A guessed number to a CFO is a landmine with your name etched on it. Confidence plus wrongness is the worst available combination."},
