  <div class="center sub" id="br-time" style="min-height:22px"></div>
  <button class="btn" id="br-btn" style="max-width:240px; margin:14px auto 0" onclick="toggleBreath()">Begin</button>`;
}
function initBreath(){ br.on=false; br.elapsed=0; }
function toggleBreath(){ br.on?stopBreath(true):startBreath(); }
function startBreath(){
  br.on=true; br.elapsed=0; br.pi=0;
  document.getElementById("br-btn").textContent="Finish";
  document.getElementById("br-sel").disabled=true;
  br.clock=setInterval(()=>{
    br.elapsed++;
    const el=document.getElementById("br-time");
    if(el) el.textContent=`${Math.floor(br.elapsed/60)}:${String(br.elapsed%60).padStart(2,"0")}`;
  },1000);
  breathPhase();
}
function breathPhase(){
  const phases=PATTERNS[br.pat].phases;
  const ph=phases[br.pi];
  const orb=document.getElementById("borb");
  if(!orb||!br.on) return;
  orb.style.transitionDuration=ph[1]+"s";
  orb.style.transform=`scale(${ph[2]})`;
  orb.textContent=ph[0];
  br.task=setTimeout(()=>{ br.pi=(br.pi+1)%phases.length; breathPhase(); },ph[1]*1000);
}
function stopBreath(fromBtn){
  if(!br.on) return;
  br.on=false;
  clearTimeout(br.task); clearInterval(br.clock);
  if(br.elapsed>=15){ S.calmSec+=br.elapsed; save(); }
  if(fromBtn){
    const orb=document.getElementById("borb");
    if(orb){ orb.style.transitionDuration="1s"; orb.style.transform="scale(.55)"; orb.textContent="Ready"; }
    const btn=document.getElementById("br-btn"); if(btn) btn.textContent="Begin";
    const sel=document.getElementById("br-sel"); if(sel) sel.disabled=false;
    const tm=document.getElementById("br-time"); if(tm) tm.textContent="";
  }
  br.elapsed=0;
}

const RF_EMOTIONS=["Anxious","Frustrated","Angry","Helpless","Overwhelmed","Guilty","Embarrassed","Low"];
let rf={};
function viewReframe(){
  rf={sel:[],emo:null,before:70};

  <label class="q">4 · Spot the distortion</label>
  <div class="hint">Which patterns is it running? (Pick any that fit.)</div>
  <div class="grid2">${DISTORTIONS.map((d,i)=>`
    <button class="opt" id="rf-d-${i}" onclick="rfTog(${i})" style="margin-top:7px">
      <b style="font-size:14px">${d[0]}</b><div class="tiny">${d[1]}</div></button>`).join("")}</div>

  <label class="q">5 · Put it on trial</label>

function rfEmo(e){

function saveReframe(){
  const sit=document.getElementById("rf-sit").value.trim();

    body:`Situation: ${sit||"—"}\nFeeling: ${rf.emo||"—"} ${rf.before}% → ${after}%`
      +`\nThought: ${t}\nPatterns: ${pats||"—"}\nFor: ${evFor||"—"}\nAgainst: ${evAg||"—"}\nBalanced: ${b}`});

  document.getElementById("app").innerHTML=`<div class="fade center" style="padding-top:14vh">
    <div style="font-size:48px">⚖️</div>
    <h2 style="margin-top:12px">Record closed.</h2>
    <p class="sub" style="max-width:320px; margin:8px auto 4px">${rf.emo?rf.emo:"The feeling"} went from <b>${rf.before}%</b> to <b>${after}%</b>${drop>0?" — that's the reframe doing its work.":"."}</p>
    <p class="sub" style="max-width:320px; margin:0 auto 24px">${drop>0?"":"No drop this time is still a win — you now know this thought needs a different tool, or a real conversation."}</p>
    <button class="btn" style="max-width:220px; margin:0 auto" onclick="goTab('tools')">Done</button>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- Decompress ---------- */
function viewDecompress(){
  return `<button class="back" onclick="goTab('today')">‹ Back</button>
  <h1 style="margin-top:2px">Decompress</h1>
  <p class="sub" style="margin:-6px 2px 8px">Three questions to close the day. Your brain files the day by its ending — give it a clean one.</p>
  <label class="q">What was the hardest moment today?</label>
  <div class="hint">Name it plainly. Naming closes loops.</div>
  <textarea id="dc-1" rows="2"></textarea>
  <label class="q">What did you handle better than you would have a year ago?</label>
  <div class="hint">There's always one. It counts.</div>
  <textarea id="dc-2" rows="2"></textarea>
  <label class="q">What's tomorrow's first move?</label>
  <div class="hint">One concrete thing. Then the desk is closed.</div>
  <textarea id="dc-3" rows="2"></textarea>
  <button class="btn plum" style="margin-top:16px" onclick="saveDecompress()">Shutdown complete</button>`;
}
function saveDecompress(){
  const a=document.getElementById("dc-1").value.trim();
  const b=document.getElementById("dc-2").value.trim();
  const c=document.getElementById("dc-3").value.trim();
  if(!a&&!b&&!c) return;
  S.journal.unshift({date:new Date().toISOString(),kind:"Decompress",title:"Day closed",
    body:`Hardest: ${a}\nHandled well: ${b}\nTomorrow's first move: ${c}`});
  save(); goTab("today");
}

/* ---------- Prepare (pre-meeting primer) ---------- */
let ppTimer=null;
function viewPrepare(){
  return `<button class="back" onclick="goTab('tools')">‹ Toolkit</button>
  <h1 style="margin-top:2px">Prepare</h1>
  <p class="sub" style="margin:-6px 2px 4px">Ninety seconds before the meeting that matters. Walk in already regulated.</p>
  <label class="q">The outcome</label>
  <div class="hint">One sentence: what does a good result from this meeting look like?</div>
  <textarea id="pp-1" rows="2"></textarea>
  <label class="q">The spike</label>
  <div class="hint">What's most likely to trigger you in there — and what's your body's tell?</div>
  <textarea id="pp-2" rows="2"></textarea>
  <label class="q">The pre-decision</label>
  <div class="hint">Decide now: "If that happens, I will…" — pause and sip water, ask a question, write it down.</div>
  <textarea id="pp-3" rows="2"></textarea>
  <button class="btn indigo" id="pp-btn" style="margin-top:16px" onclick="finishPrepare()">Seal it with one slow breath</button>`;
}
function finishPrepare(){
  const a=document.getElementById("pp-1").value.trim(),
        b=document.getElementById("pp-2").value.trim(),
        c=document.getElementById("pp-3").value.trim();
  if(!a&&!b&&!c) return;
  const btn=document.getElementById("pp-btn");
  btn.disabled=true;
  let n=8;
  clearInterval(ppTimer);
  ppTimer=setInterval(()=>{
    const el=document.getElementById("pp-btn");
    if(!el){ clearInterval(ppTimer); return; }
    el.textContent=n>4?`Breathe in… ${n}`:`Breathe out… ${n}`;
    if(--n<0){
      clearInterval(ppTimer);
      S.journal.unshift({date:new Date().toISOString(),kind:"Prepare",title:"Prepared",
        body:`Outcome: ${a||"—"}\nLikely spike: ${b||"—"}\nIf it happens: ${c||"—"}`});
      S.calmSec+=10; save(); goTab("today");
    }
  },1000);
}

/* ---------- Say it cleanly (conversation script) ---------- */
function viewScript(){
  return `<button class="back" onclick="goTab('tools')">‹ Toolkit</button>
  <h1 style="margin-top:2px">Say it cleanly</h1>
  <p class="sub" style="margin:-6px 2px 4px">Turn a charged message into one you'll be glad you delivered: situation → feeling → value → request.</p>
  <label class="q">When…</label>
  <div class="hint">The specific, factual situation — what a camera would have recorded.</div>
  <textarea id="sc-1" rows="2" placeholder="the deck came back at 11pm with the numbers unchecked"></textarea>
  <label class="q">I was…</label>
  <div class="hint">One feeling word, owned. Not "you made me".</div>
  <textarea id="sc-2" rows="1" placeholder="frustrated"></textarea>
  <label class="q">Because I care about…</label>
  <div class="hint">The value or standard underneath the heat.</div>
  <textarea id="sc-3" rows="1" placeholder="being accurate in front of the client"></textarea>
  <label class="q">Next time…</label>

}
function buildScript(){
  const w=document.getElementById("sc-1").value.trim(), f=document.getElementById("sc-2").value.trim(),
        v=document.getElementById("sc-3").value.trim(), r=document.getElementById("sc-4").value.trim();
  if(!w||!f||!v||!r) return;
  const script=`When ${w}, I was ${f} — because I care about ${v}. Next time, ${r}.`;
  S.journal.unshift({date:new Date().toISOString(),kind:"Script",title:"Clean words",body:script});
  save();
  document.getElementById("sc-out").innerHTML=`<div class="card" style="margin-top:14px">
    <div class="eyebrow" style="color:var(--moss); margin-bottom:6px">Your script — deliver after the wave, in private, once</div>
    <p class="quote" style="margin:0 0 10px">“${esc(script)}”</p>
    <button class="chip" onclick="copyScript(this)" data-s="${esc(script)}">Copy</button>
  </div>`;
}
function copyScript(el){
  try{ navigator.clipboard.writeText(el.dataset.s); el.textContent="Copied ✓"; }catch(e){}
}

/* ---------- Worry parking ---------- */
function viewWorries(){
  const open=S.worries.filter(w=>w.status==="open");
  const reviewed=S.worries.filter(w=>w.status!=="open");
  const never=reviewed.filter(w=>w.status==="didnt").length;
  const handled=reviewed.filter(w=>w.status==="handled").length;
  return `<button class="back" onclick="goTab('tools')">‹ Toolkit</button>
  <h1 style="margin-top:2px">Worry parking</h1>
  <p class="sub" style="margin:-6px 2px 8px">Write it down, park it, and come back when the facts are in. Over time the ledger teaches your brain how often its forecasts actually land.</p>
  <textarea id="wp-text" rows="2" placeholder='e.g. "The MD will hate the revised model"'></textarea>
  <button class="btn steel" style="margin:10px 0 18px" onclick="parkWorry()">Park it</button>
  ${open.length?`<div class="eyebrow" style="margin-bottom:8px">Parked (${open.length})</div>`+open.map(w=>`
    <div class="card"><p style="font-size:14.5px; margin:0 0 3px">${esc(w.text)}</p>
      <div class="tiny" style="margin-bottom:9px">parked ${new Date(w.date).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</div>
      <div class="chips">
        <button class="chip" onclick="resolveWorry('${w.id}','didnt')">Never happened</button>
        <button class="chip" onclick="resolveWorry('${w.id}','handled')">Happened — I handled it</button>
        <button class="chip" onclick="resolveWorry('${w.id}','happened')">Happened — still live</button>
      </div></div>`).join(""):""}
  ${reviewed.length>=3?`<div class="card"><b style="font-size:14px">Your ledger</b>
    <p class="sub" style="font-size:14px; margin:6px 0 0">Of <b>${reviewed.length}</b> worries reviewed, <b>${Math.round(never/reviewed.length*100)}%</b> never happened${handled?` — and you handled ${handled} of the ones that did`:""}.</p></div>`:""}`;
}
function parkWorry(){
  const t=document.getElementById("wp-text").value.trim(); if(!t) return;
  S.worries.unshift({id:String(Date.now()),date:new Date().toISOString(),text:t,status:"open"});
  save(); render();
}
function resolveWorry(id,st){
  const w=S.worries.find(x=>x.id===id); if(w) w.status=st;
  save(); render();
}

/* ---------- Reflect ---------- */
// Cross-tool pattern engine: mirrors what your check-ins, thought records,
// resets and worry ledger say about you — observations, never verdicts.
function insights(){
  const out=[];
  const cutoff=Date.now()-14*86400000;
  const recent=S.checkIns.filter(c=>new Date(c.date).getTime()>cutoff);

  // Thought-record analytics (all time)
  const trs=S.journal.filter(j=>j.kind==="Reframe"&&j.meta);
  if(trs.length>=2){
    const avg=Math.round(trs.reduce((a,t)=>a+(t.meta.before-t.meta.after),0)/trs.length);
    if(avg>0) out.push(`Across ${trs.length} thought records, putting the thought on trial has dropped the feeling by ${avg} points on average. The tool works for you — reach for it early.`);
    const dc={};
    trs.forEach(t=>(t.meta.patterns||[]).forEach(p=>dc[p]=(dc[p]||0)+1));
    const topD=Object.entries(dc).sort((a,b)=>b[1]-a[1])[0];
    const DL={"Mind reading":"Regulate before you respond","Catastrophising":"You are not your thoughts","All-or-nothing":"Micro-moves","Personalising":"The control map","Should-storms":"The inner critic","Discounting wins":"The inner critic"};
    if(topD&&topD[1]>=2&&DL[topD[0]]) out.push(`“${topD[0]}” is your mind's favourite pattern — it appears in ${topD[1]} of ${trs.length} thought records. The lesson “${DL[topD[0]]}” is aimed straight at it.`);
  }

  // Worry ledger calibration
  const reviewed=(S.worries||[]).filter(w=>w.status!=="open");
  if(reviewed.length>=3){
    const never=reviewed.filter(w=>w.status==="didnt").length;
    out.push(`Of ${reviewed.length} worries you've parked and reviewed, ${Math.round(never/reviewed.length*100)}% never happened. Worth remembering at the next 2am forecast.`);
  }

  // Reset pattern
  if((S.resetLog||[]).length>=2){
    const rc={}; S.resetLog.forEach(k=>rc[k]=(rc[k]||0)+1);
    const topR=Object.entries(rc).sort((a,b)=>b[1]-a[1])[0];
    if(topR[1]>=2) out.push(`${topR[0]} is what most often sends you to Reset (${topR[1]} of ${S.resetLog.length} times). That's a pattern the courses are built for — not a failing.`);
  }

  if(recent.length>=3){
    const diff=recent.filter(c=>c.emotions.some(e=>DIFFICULT.has(e)));
    if(diff.length){
      const ev=diff.filter(c=>new Date(c.date).getHours()>=18).length;
      if(ev/diff.length>0.6) out.push("Most of your harder moments land in the evening. A short decompress before you leave the desk may change how the night goes.");
    }
    // Which emotion travels with which trigger
    const pairs={};
    diff.forEach(c=>c.emotions.filter(e=>DIFFICULT.has(e)).forEach(e=>c.contexts.forEach(x=>{
      const k=e+"|"+x; pairs[k]=(pairs[k]||0)+1;
    })));
    const topP=Object.entries(pairs).sort((a,b)=>b[1]-a[1])[0];
    if(topP&&topP[1]>=3){
      const [e,x]=topP[0].split("|");
      out.push(`“${e}” and “${x}” travel together in your check-ins — ${topP[1]} times in two weeks. That exact pairing is worth one thought record.`);
    }
    const famHard=diff.filter(c=>c.contexts.includes("Family")).length;
    if(famHard>=2) out.push(`Family appears in ${famHard} of your harder check-ins this fortnight. The Kin course was written for exactly that terrain — gently, and at your pace.`);
    const ctx={};
    recent.forEach(c=>c.contexts.forEach(x=>ctx[x]=(ctx[x]||0)+1));
    const top=Object.entries(ctx).sort((a,b)=>b[1]-a[1])[0];
    if(top&&top[1]>=3&&top[0]!=="Family") out.push(`“${top[0]}” shows up most often in your check-ins. Worth a look at the Control Map lesson if you haven't yet.`);
    const fr=recent.filter(c=>c.emotions.includes("Frustrated")||c.emotions.includes("Angry")).length;
    if(fr>=3) out.push(`Frustration has come up ${fr} times in two weeks. The Heat course and the 60-second Reset are built exactly for this.`);
    const avg=recent.reduce((a,c)=>a+c.mood,0)/recent.length;
    if(avg>=3.6) out.push("Your average mood over the last two weeks has been on the brighter side. Notice what's working — that's data too.");
  }
  return out.slice(0,5);
}
function moodChartSVG(){
  const cutoff=Date.now()-14*86400000;
  const pts=S.checkIns.filter(c=>new Date(c.date).getTime()>cutoff);
  if(!pts.length) return `<p class="sub center" style="padding:22px 0">Check in for a few days and your weather pattern will appear here.</p>`;
  const W=440,H=150,PL=18,PR=8,PT=10,PB=14;
  const x=t=>PL+((t-cutoff)/(Date.now()-cutoff))*(W-PL-PR);
  const y=m=>PT+(1-(m-1)/4)*(H-PT-PB);
  const coords=pts.map(c=>[x(new Date(c.date).getTime()),y(c.mood)]);
  const line=coords.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto">
    ${[1,3,5].map(m=>`<line x1="${PL}" x2="${W-PR}" y1="${y(m)}" y2="${y(m)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${PL-4}" y="${y(m)+3}" font-size="8.5" fill="var(--faint)" text-anchor="end">${m===1?"Rough":m===3?"Steady":"Great"}</text>`).join("")}
    ${coords.length>1?`<path d="${line}" fill="none" stroke="var(--teal)" stroke-width="2" opacity=".55" stroke-linejoin="round"/>`:""}
    ${coords.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--teal)"/>`).join("")}
  </svg>`;
}
function viewReflect(){
  const ins=insights();
  const earned=MILESTONES.filter(m=>m.f(S)).length;
  return `<h1>Reflect</h1>
  <div class="stats">
    <div class="card"><div style="font-size:17px">🌬️</div><div class="v">${Math.floor(S.calmSec/60)}</div><div class="tiny">calm minutes</div></div>
    <div class="card"><div style="font-size:17px">📖</div><div class="v">${S.done.length}</div><div class="tiny">lessons done</div></div>
    <div class="card"><div style="font-size:17px">🌤️</div><div class="v">${S.checkIns.length}</div><div class="tiny">check-ins</div></div>
  </div>
  <div class="card"><b style="font-size:14px">Mood · last 14 days</b><div style="margin-top:10px">${moodChartSVG()}</div></div>
  ${ins.length?`<div class="card"><div class="eyebrow" style="color:var(--indigo); margin-bottom:8px">Noticed</div>
    ${ins.map(i=>`<div class="take"><b>·</b><span>${i}</span></div>`).join("")}</div>`:""}
  <div class="card">
    <div class="row" style="justify-content:space-between; margin-bottom:10px">
      <b style="font-size:14px">Milestones</b><span class="tiny">${earned} of ${MILESTONES.length}</span></div>
    <div class="badgegrid">${MILESTONES.map(m=>{
      const e=m.f(S);
      return `<div class="badge${e?" earned":""}"><div class="bi">${m.i}</div><div class="bt">${m.t}</div><div class="bd">${m.d}</div></div>`;
    }).join("")}</div>
  </div>
  <div class="card"><b style="font-size:14px">Journal</b>
    ${S.journal.length?S.journal.slice(0,20).map(j=>`
      <div class="jentry">
        <div class="row" style="justify-content:space-between; margin-bottom:2px">
          <b style="color:var(--teal); font-size:12.5px">${esc(j.kind)}${j.kind==="Reflection"?" · "+esc(j.title):""}</b>
          <span class="tiny">${new Date(j.date).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span>
        </div>${esc(j.body)}</div>`).join("")
    :`<p class="sub" style="margin:8px 0 0">Reflections, reframes and decompress notes will collect here — private, in this browser only.</p>`}
  </div>`;
}
