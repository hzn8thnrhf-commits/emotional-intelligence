   {t:"Buy the seconds without apology: 'Pulling that up — two seconds.' Breathe, check, answer. If it won't surface: 'I'll confirm the exact figure before end of meeting' — then do.",best:true,fb:"No apology spiral, no performance of panic — just a person retrieving a fact, which is all this ever was. The recovery, delivered precisely, erases the blank entirely."},
   {t:"Apologise, explain you're stretched across three deals, apologise again.",best:false,fb:"The triple apology converts a two-second retrieval delay into a competence question. Nobody was doubting you until the third sorry."}]},
 {id:"mp7",who:"Meetings & politics",title:"The devil's advocate",
  prompt:`Every proposal you've brought this quarter has met the same voice: 'Just playing devil's advocate, but—'. The advocate never brings proposals of his own.`,
  mech:`Your CERTAINTY taxed by someone whose scepticism is free — critique without stake is the cheapest seat in the room. What's driving him: relevance. Objection is his production function.`,
  options:[
   {t:"Armour every proposal with twenty pre-emptive appendix slides.",best:false,fb:"You'd be doing his job for him at your expense — and thoroughness aimed at one heckler bloats every deck for everyone."},
   {t:"Give the advocate a portfolio: 'Genuinely useful — take the risk column. Bring the top three risks WITH mitigations to Thursday and we'll pressure-test together.'",best:true,fb:"Assigning ownership converts free-floating scepticism into accountable work. Either he delivers (your proposal gets stronger) or he declines (the room notices whose scepticism was decorative)."},
   {t:"Puncture it publicly: 'The devil has enough advocates — bring a proposal sometime.'",best:false,fb:"A great line that costs more than it earns: he becomes a committed enemy, and the room learns you have a temper worth probing."}]},
 {id:"mp8",who:"Meetings & politics",title:"The vulnerability exercise",
  prompt:`Team offsite. The facilitator beams: 'Now everyone share a moment of real personal struggle.' You're a private person. Your turn approaches like weather.`,
  mech:`AUTONOMY over your own disclosure — the one territory that should never be conscripted. Forced vulnerability isn't intimacy; it's compliance wearing intimacy's clothes.`,
  options:[
   {t:"Match the room's deepest sharer — anything less reads as closed.",best:false,fb:"Disclosure under social pressure is the kind you wake up regretting at 3am. Depth on demand isn't authenticity; it's performance with a hangover."},
   {t:"Prepare a middle-depth truth you can share freely — real, meaningful, and yours to give: the early-career failure, the hard year, what it taught you. Deliver it warmly and fully own its boundary.",best:true,fb:"A prepared authentic story satisfies the exercise without surrendering the private core. Boundaries held gracefully read as self-possession — often the strongest presence in the room."},
   {t:"Pass, visibly uncomfortable: 'I'd rather not.'",best:false,fb:"Your right, entirely — but a cold pass in a warm room writes its own story. The middle-depth option protects the same core at zero social cost."}]},
 {id:"mp9",who:"Meetings & politics",title:"Corrected from below",
  prompt:`You quote a figure with full confidence. Your own analyst, from the end of the table: 'Actually — it's 340, not 390.' He's right. The room waits.`,
  mech:`STATUS inverted in public — corrected by someone junior, in front of peers. But the room isn't scoring the error; it's scoring the next five seconds.`,
  options:[
   {t:"Defend the nuance: 'Well, it depends how you cut the data—'",best:false,fb:"It doesn't, and half the room knows it. Face-saving wriggle costs more status than the correction did — errors are forgotten, wriggling is remembered."},
   {t:"Own it instantly and cleanly: 'You're right — 340. Good catch.' Move on without ceremony.",best:true,fb:"Five words, zero drama. You just showed the room that accuracy outranks ego at your table — which raises your standing AND teaches every junior watching that correcting you is safe. Composure over the error IS the status recovery."},
   {t:"Thank him smoothly now, have a word later about the right channel for corrections.",best:false,fb:"The 'later word' undoes the public grace and teaches him to sit on your errors. You'd be optimising for face over accuracy — backwards."}]},
 {id:"mp10",who:"Meetings & politics",title:"The ask that met silence",
  prompt:`You made the headcount case — clean, costed, rehearsed. A beat of silence. Then the chair: 'Right, next item.' Nobody said no. Nobody said anything.`,
  mech:`CERTAINTY denied its verdict: silence is the hardest answer to metabolise because it might mean no, later, or nothing at all. Don't let the ambiguity write itself as rejection.`,
  options:[
   {t:"Read the room's silence as a soft no and quietly shelve the ask.",best:false,fb:"Self-rejection on ambiguous evidence — the most common way good asks die. Silence in a crowded agenda usually means 'not now', not 'never'."},
   {t:"Re-enter once, crisply, before the close: 'Before we wrap — I need a decision path on the headcount ask. Who should I follow up with, and by when?' Then work that path offline with your sponsor.",best:true,fb:"You convert silence into process — a name and a date — which is all an unanswered ask ever needs. The offline follow-up is where headcount actually gets won anyway."},
   {t:"Raise it again mid-meeting, louder and with more slides.",best:false,fb:"Volume against silence reads as desperation. The ask didn't fail on decibels; it needs an owner and a deadline, not a reprise."}]},
 {id:"em1",who:"Messages & email",title:"'Fine.'",
  prompt:`Your proposal took two evenings: eight sections, three options, a recommendation. The reply, fourteen hours later, in full: 'fine.'`,
  mech:`CERTAINTY starved by compression — one word carrying anything from enthusiasm to dismissal. What's driving it: senior inboxes run on triage; brevity is bandwidth, not verdict.`,
  options:[
   {t:"Reread the thread for tone clues, then draft three interpretations of 'fine' with a friend.",best:false,fb:"Forensic analysis of four letters is anxiety cosplay as diligence. The word contains exactly no additional information — stop mining."},
   {t:"Bank it as the approval it most likely is, confirm scope in one line — 'Great, proceeding with option B, first milestone Friday' — and move.",best:true,fb:"The confirmation line does double duty: locks the decision on record and flushes out any real objection. If 'fine' didn't mean yes, you'll hear back in minutes."},
   {t:"Reply asking whether everything's okay with the proposal.",best:false,fb:"'Is everything okay?' converts his two-second triage into your emotional weather — and reads as needing reassurance you shouldn't need at your level."}]},
 {id:"em2",who:"Messages & email",title:"Left on read",
  prompt:`Your promotion case — carefully argued, personally vulnerable — shows as read two days ago. No reply. The read receipt sits there like a verdict.`,
  mech:`CERTAINTY plus stakes: ambiguity hurts in proportion to what's riding on it. 'Read' means his eyes crossed it between meetings — not that he's drafting a rejection.`,
  options:[
   {t:"Follow up across channels — a Slack nudge, a mention after standup, maybe a corridor pass.",best:false,fb:"Multi-channel pursuit of a two-day silence reads as anxiety in surround sound. The case was strong; don't dilute it with chase energy."},
   {t:"One nudge with an easy handle after a respectable interval: 'Whenever you've had a chance — happy to walk through it in 15 minutes this week.' Then park it on the worry ledger and work.",best:true,fb:"The nudge does its job once; the calendar handle makes replying frictionless. The ledger will teach you what these silences almost always were: nothing."},
   {t:"Take the silence as the answer and start recalibrating expectations.",best:false,fb:"Two days is an inbox, not a verdict. Pre-emptive disappointment doesn't soften outcomes; it just doubles the days you feel bad."}]},
 {id:"em3",who:"Messages & email",title:"The cc landmine",
  prompt:`A peer replies to your email correcting a footnote — technically right, utterly minor — and adds your boss to the cc line for the occasion.`,
  mech:`STATUS via audience engineering: the correction is the pretext, the cc is the payload. What's driving him: visibility hunger — your footnote is his stage prop.`,
  options:[
   {t:"Reply-all with a robust defence of the original footnote's methodology.",best:false,fb:"A footnote duel in front of your boss makes the cc gambit a success — he wanted a spectacle with you in it."},
   {t:"Reply to him alone — 'good catch, fixed' — and let the thread die in front of the audience it was staged for.",best:true,fb:"De-escalation by de-amplification: the audience sees a non-event, which is exactly what it was. Your boss notices composure; the sniper's stage collapses quietly."},
   {t:"Counter-cc: find his next slip and return the audience with interest.",best:false,fb:"Cc warfare has no winners, only participants — and seniors reading the crossfire remember both names, not who fired first."}]},
 {id:"em4",who:"Messages & email",title:"The 22:47 ping",
  prompt:`Your boss WhatsApps at 22:47: 'quick thought on the deck when you get a sec'. Not urgent. Never urgent. But the tick marks are on, and your evening is now a waiting room.`,
  mech:`AUTONOMY over your own evening, eroded by ambient availability. What's driving her: she's clearing HER backlog at 22:47 — the timestamp is her workflow, not your deadline.`,
  options:[
   {t:"Reply within minutes, every time — responsiveness is your brand.",best:false,fb:"Instant replies at 23:00 train the system that you're always on — and the asks will expand to fill the availability you've advertised. Your brand becomes 'no boundaries'."},
   {t:"Answer at 8am, consistently, unless something is flagged urgent — and let the pattern itself teach the norm. If needed once: 'Evenings I'm offline unless it's marked urgent — I'll always catch it first thing.'",best:true,fb:"Consistency is the boundary — no announcement required in most cases. The 8am reply that's crisp and complete proves the system works; most seniors adjust without ever discussing it."},
   {t:"Reply at 23:40 with a pointed one-worder so she senses the imposition.",best:false,fb:"Passive signal, actively bad: you still worked the evening AND transmitted resentment she has to decode. Boundaries whispered in subtext protect nothing."}]},
 {id:"em5",who:"Messages & email",title:"Misrepresented on a list",
  prompt:`A teammate's email to a wide distribution — seniors included — describes your workstream as 'delayed pending her analysis'. Your analysis was delivered nine days ago. The heat rises as you read.`,
  mech:`FAIRNESS and STATUS: a false record propagating at inbox speed. What's driving him: possibly a stale status doc, possibly blame-drift — either way the record needs correcting more than he needs prosecuting.`,
  options:[
   {t:"Reply-all with the full timeline: delivery date, read receipts, the works.",best:false,fb:"A forensic reply-all wins the fact and stages a public trial nobody asked to attend. The seniors will remember the friction longer than the timeline."},
   {t:"Correct the record briefly and generously on the list — 'small update: that analysis landed on the 12th, happy to resend — flag anything else blocking' — then sort the real story with him directly, off-list.",best:true,fb:"Two sentences fix the record without a scent of blood; the generosity ('happy to resend') makes the correction unanswerable. The off-list conversation handles whether it was sloppiness or spin."},
   {t:"Let it slide — people who matter know your work was done.",best:false,fb:"Wide-list errors become institutional memory with terrifying speed. 'People who matter' includes people who only know what the thread told them."}]},
 {id:"em6",who:"Messages & email",title:"Forwarded with a '?'",
  prompt:`Your boss forwards a client complaint about your workstream. His entire commentary: '?'. One character, infinite readings.`,
  mech:`CERTAINTY vacuum plus STATUS threat — a complaint plus an ambiguous grunt from above is premium anxiety fuel. Decode it plainly: '?' means 'handle this and tell me what I need to know', not 'defend your existence'.`,
  options:[
   {t:"Reply with a thorough account of why the complaint is largely unfair.",best:false,fb:"He didn't ask whose fault it was; he asked (in one keystroke) for ownership. A defence brief answers a question nobody posed — and reads as rattled."},
   {t:"Respond like the owner he's hoping you are: 'On it. Root cause is X, client called, fix lands Thursday — I'll confirm when done.' Short, factual, closed-loop.",best:true,fb:"The one-character forward is a delegation test. Facts, action, deadline — that's the entire correct answer, and it's also the reply that stops these forwards feeling like threats."},
   {t:"Acknowledge with 'looking into it' and investigate thoroughly before saying more.",best:false,fb:"'Looking into it' followed by silence reads as drift precisely when he's watching. Even a holding reply needs a time-stamped next step."}]},
 {id:"em7",who:"Messages & email",title:"The 👍 on your risk flag",
  prompt:`You flagged a genuine delivery risk in the team channel — carefully worded, clearly serious. It received one 👍 and the conversation moved to lunch plans.`,
  mech:`Your CERTAINTY need (is this handled or not?) met by emoji ambiguity. What's driving it: channel physics — chat flattens everything to the same weight, and a 👍 costs nothing to give.`,
  options:[
   {t:"Repost the risk, longer and bolder, maybe with red text.",best:false,fb:"Escalating formatting in the same channel is shouting into the same wind. The channel is the problem, not the font."},
   {t:"Change the venue to match the stakes: put it on the next meeting agenda or book 15 minutes with the owner — 'flagging this properly because I don't think chat carried the weight.'",best:true,fb:"Serious things need synchronous venues — that's the whole lesson. Moving it deliberately also models the norm for your team: chat for coordination, meetings for risk."},
   {t:"Drop it — you flagged it, it's on the record, your conscience is clear.",best:false,fb:"'I did technically flag it' is a post-mortem sentence. If the risk is real, the record won't matter; the outcome will."}]},
 {id:"em8",who:"Messages & email",title:"The typo, discovered after send",
  prompt:`You spot it eleven minutes after sending to the exec floor: 'pubic markets'. Your stomach drops through the building.`,
  mech:`SHAME'S favourite genre: the tiny, laughable, unrecallable error. The spotlight effect is lying to you — your typo is enormous in your evening and a half-second smirk in theirs.`,
  options:[
   {t:"Send the correction email with an apology paragraph and a small joke to defuse it.",best:false,fb:"A paragraph-length correction of a one-letter typo gives it a second act it never earned. You'd be the only person still reading about it."},
   {t:"Calibrate to materiality: a wrong number gets a one-line correction now; a comic typo gets nothing but your own forgiveness. Nobody archives your typos — file it under human.",best:true,fb:"The materiality test is the whole skill: correct what misleads, release what merely embarrasses. The execs have sent worse; the smirk lasted half a second; the replay loop is optional."},
   {t:"Recall the email, resend corrected, then message the key recipients to disregard the earlier version.",best:false,fb:"The recall-resend-explain cascade is a marching band announcing what three people had scrolled past. Maximum amplification, minimum benefit."}]},
 {id:"em9",who:"Messages & email",title:"The chat that went quiet",
  prompt:`You posted in the team channel and the lively conversation... stopped. Twenty minutes of silence. You're now fairly sure there's a side-channel, and that it's about you.`,
  mech:`Textbook MIND READING with a data set of one silence — chat rhythms break for a hundred reasons, and 'they've moved to talk about me' is the reading your threat system prefers, not the likeliest one.`,
  options:[
   {t:"Test the theory: post something minor and time the response gap.",best:false,fb:"Running experiments on your own team's chat rhythm is surveillance dressed as science — and any result will feed the story, not settle it."},
   {t:"Treat one silence as noise; watch the pattern over days instead. If engagement genuinely sags, ask a trusted report an open question — 'how's the channel feeling lately?' — and make the main room safer, not the side rooms scarcer.",best:true,fb:"Pattern over incident is the anti-mind-reading discipline. And if there IS a side channel, the cause is safety, not conspiracy — same fix as the silent meeting: make candour cheaper where you are."},
   {t:"Ask someone straight out whether there's a side chat about you.",best:false,fb:"The question puts them in an impossible spot and broadcasts insecurity in one move. Even a honest 'no' can't reassure the part of you that asked."}]},
 {id:"em10",who:"Messages & email",title:"The thread heating up",
  prompt:`The Slack exchange with your peer has gone four rounds, each sharper than the last. Colleagues are quietly watching the channel. Your next message is drafted, and it's a good one — sharp as glass.`,
  mech:`Text strips tone and adds audience — the two ingredients that turn disagreement into performance. The drafted zinger is your flooded brain optimising for the watching room, not the outcome.`,
  options:[
   {t:"Send it. It's accurate, well-crafted, and he started the sharpness.",best:false,fb:"Accuracy is not the question at round five — the medium is. Zingers win channels and lose colleagues, and the audience remembers the temperature, not the scorer."},
   {t:"Kill the arena: 'This deserves better than Slack — calling you in five.' Then be genuinely warm on the call.",best:true,fb:"Voice restores tone, removes the audience, and collapses most text-fights in ninety seconds — half these wars are two reasonable people misreading flatness as hostility. The one who moves it to a call reads as the grown-up."},
   {t:"Stop replying mid-thread and let your silence make the point.",best:false,fb:"Pointed silence in a watched channel is its own performance — ambiguous to him, awkward for the audience, and the disagreement is still unresolved tomorrow."}]},
 {id:"sf1",who:"Yourself",title:"Passed over",
  prompt:`The promotion went to your peer. You found out an hour ago, and the team announcement — with clapping-hands emojis expected — is in five minutes.`,
  mech:`STATUS wound at full depth plus a FAIRNESS audit running hot. And a timer: the next five minutes are public; the grief can be private and honoured later. Both are real; they need different rooms.`,
  options:[
   {t:"Skip the announcement — you can't perform enthusiasm right now and shouldn't have to.",best:false,fb:"The absence will be read with total accuracy by everyone, including the people who decide the next promotion. Five minutes of grace now buys you the privacy to feel it fully later."},
   {t:"Deliver clean congratulations — brief, genuine, done — then take the evening for the real feelings, and book a career conversation for next week: 'What was the gap, and what's the path?' Data, not grievance.",best:true,fb:"Dignity in the moment, grief in private, strategy within the week — in that order. The gap conversation, held calm, often does more for the next cycle than the last year of work did."},
   {t:"Congratulate him, then ask your boss today — while it's raw — why it wasn't you.",best:false,fb:"Today the question comes out as an accusation wearing a query's clothes. The same conversation next week, with the wave passed, is the one that actually gets answered."}]},
 {id:"sf2",who:"Yourself",title:"The 2am replay",
  prompt:`You said something slightly off in a meeting eleven hours ago. Your brain has now staged the eighty-fifth re-enactment, with commentary. It is 2:14am.`,
  mech:`Rumination — the replay IS the re-trigger, each loop refreshing a 90-second wave that would otherwise have died before dinner. The night amplifies: at 2am every thought gains false profundity.`,
  options:[
   {t:"Draft the clarifying email now, while the wording is vivid.",best:false,fb:"Nothing composed at 2am should meet an audience. And the clarification would enlarge a moment that — check the evidence — nobody else has thought about since lunch."},
   {t:"Break the loop physically: write the worry in one sentence on the pad by your bed — 'parked until 9am' — then 4-7-8 breathing until the body outvotes the brain. If it still matters at 9, it gets a thought record.",best:true,fb:"The written parking note satisfies the brain's fear of forgetting, which is half of what fuels the loop. Almost nothing survives the 9am review — daylight reprices these things brutally."},
   {t:"Rehearse tomorrow's recovery: how you'll re-raise the point and correct the impression.",best:false,fb:"Rehearsal feels productive but it's the replay loop in a work costume — same wave, new trigger, still 2am."}]},
 {id:"sf3",who:"Yourself",title:"The LinkedIn spiral",
  prompt:`Twenty idle minutes on LinkedIn: a peer's promotion, a classmate's fund launch, a junior's — a JUNIOR'S — startup raise. You arrived content. You leave behind.`,
  mech:`Comparison mechanics at industrial scale: a feed is everyone's peak spliced into one scroll, and your STATUS system can't not keep score against it. The input created the feeling — that's the whole diagnosis.`,
  options:[
   {t:"Counter-post: you have wins worth announcing too.",best:false,fb:"Posting from the sting means joining the machine that just processed you. Your announcement becomes someone else's 2am spiral — the wheel turns, nobody wins."},
   {t:"Name the mechanism — 'the feed did this, not my career' — then treat any real residue as data: which post stung most? That's a signal about what you actually want. Take it to your values, and prune the scroll.",best:true,fb:"Twenty minutes ago you were content and your career was identical. The sting-audit is the useful part: envy is precise even when it's unpleasant — it points at wants your plans should know about."},
   {t:"Keep scrolling to the bottom of the feeling — exposure is how you toughen up.",best:false,fb:"There is no bottom; the feed regenerates faster than resilience does. This isn't exposure therapy, it's just exposure."}]},
 {id:"sf4",who:"Yourself",title:"Your error, found late",
  prompt:`Re-checking an old model, you find it: your mistake, three weeks old, and decisions have been built on it since. Nobody knows. You could probably patch it quietly.`,
  mech:`SHAME advocating for concealment — its favourite policy, and always its worst. The status maths is counterintuitive: disclosure done well builds more trust than the error costs.`,
  options:[
   {t:"Patch it quietly and adjust the numbers going forward — surfacing it now helps no one.",best:false,fb:"Quiet patches metastasise: the decisions built on the error stay uncorrected, and if it surfaces later — errors surface — the concealment becomes the story, not the mistake."},
   {t:"Own it upward today, in the shape leaders trust: 'Found an error in the March model — here's the impact, here's the corrected view, here's what I've changed so it can't recur.' Error, impact, fix. No flagellation.",best:true,fb:"The structure does the work: impact quantified, correction attached, process improved. Delivered that way, disclosure reads as exactly the person you'd want running the model — this is 'own your misses out loud', applied to yourself."},
   {t:"Disclose it with full ceremony — how badly you feel, how you can't believe you missed it, how you'll understand any loss of trust.",best:false,fb:"Self-flagellation makes your error everyone else's emotional labour — they end up consoling you for your mistake. State it clean; save the feelings for your journal."}]},
 {id:"sf5",who:"Yourself",title:"The imposter at the offsite",
  prompt:`Leadership offsite. Oxbridge accents, HBS anecdotes, someone's father who 'was at the Bank'. A familiar voice starts up: you got in through the side door, and today's the day they notice.`,
  mech:`BELONGING alarm wearing your oldest wiring — and note whose voice the critic borrows. The evidence audit matters: you were promoted by people with complete information about your background. The side door is a story; the results are the record.`,
  options:[
   {t:"Stay quiet and observational today — safer to contribute once you've calibrated the room.",best:false,fb:"The spell feeds on silence: every unspoken hour confirms you don't belong at the volume everyone else talks. Calibration becomes camouflage becomes invisibility."},
   {t:"Contribute early — first ten minutes, anything solid — and let the spell break on contact. Privately, run the audit: who hired you, who promoted you, what your book says. They're not wrong about you; the wiring is.",best:true,fb:"Early contribution is the pattern-interrupt: the room responds to your point like a point, and the imposter script loses its evidence. The audit handles the residue — feelings aren't findings."},
   {t:"Overcorrect: drop your own credentials and biggest deals early and often.",best:false,fb:"Credential-broadcasting is the imposter voice negotiating, not defeated — and rooms like this read it instantly. Substance early beats biography loudly."}]},
 {id:"sf6",who:"Yourself",title:"Sunday, 4pm",
  prompt:`The weekend was good. Then, around four on Sunday, the chest tightens — the week ahead arriving early, uninvited, while you're still at lunch.`,
  mech:`Anticipatory dread, usually an UNPROCESSED LIST rather than a real threat: the brain previews Monday because nothing is written down and everything is therefore urgent. Vagueness is the fuel.`,
  options:[
   {t:"Give in productively: open the laptop and work the evening so Monday feels covered.",best:false,fb:"You'd be paying Sunday's hours to buy Monday's calm — a trade that consumes the weekend that was supposed to restore you. The dread doesn't need labour; it needs specificity."},
   {t:"Twenty contained minutes: list the week, mark the two real priorities, write Monday's first move. Then close it — the desk is shut — and do the evening ritual you'd defend for anyone else.",best:true,fb:"The dread is almost always the unwritten list. Twenty minutes converts fog into items, and items are survivable. The hard close after matters as much as the list — detachment is the skill."},
   {t:"Distract through it: the tightness fades once the film starts.",best:false,fb:"Distraction mutes the alarm without reading the message, so it re-fires at bedtime with interest. Process first, then the film actually works."}]},
 {id:"sf7",who:"Yourself",title:"The hollow win",
  prompt:`The number you chased for two years landed this week. Bonus, title, the congratulations. You feel... administrative. A flicker, then inbox.`,
  mech:`Arrival fallacy: goal-chasing brains treat targets as happiness futures, then reprice instantly on delivery. The flatness isn't ingratitude or brokenness — it's how the machinery works when wins go unmarked and unexamined.`,
  options:[
   {t:"Set the next, bigger target today — momentum is the point and flatness proves you're built for more.",best:false,fb:"That's the exact treadmill setting that made this win weightless. Stacking targets without marking arrivals guarantees the next one lands hollow too."},
   {t:"Mark it deliberately — the dinner, the call to the person who believed early, the thing you said you'd do 'when this lands' — and then sit with the useful question: which parts of the CHASE fed you? Those, not the number, are what the next goal should be built from.",best:true,fb:"Celebration isn't indulgence; it's how wins get metabolised. And the chase-audit reroutes ambition toward what actually generated the aliveness — craft, the team, the build — before the next number gets picked by default."},
   {t:"Take the flatness as the verdict: the ladder's against the wrong wall, time to rethink everything.",best:false,fb:"One unmarked win is thin evidence for demolition. Mark it, mine it, THEN ask the wall question with real data — the Steel course's values lesson, not a Tuesday crisis."}]},
 {id:"sf8",who:"Yourself",title:"The wrong target",
  prompt:`Brutal call at 4. At 4:20 you were short with the barista; at 4:40 you snapped at a junior over a formatting nit. Neither of them was on the call. You caught yourself in the lift, ashamed.`,
  mech:`Pressure transmission, one hop downstream: the charge from the call discharged onto whoever was nearest and safest. The shame you feel is actually good sensor data — it caught the pattern within the hour.`,
  options:[
   {t:"Let it go — everyone has days; they'll understand, and revisiting it makes it weird.",best:false,fb:"Unrepaired snaps compound quietly: the junior now carries a data point about you that a ten-second repair would have deleted. Small ruptures are cheap to fix only while fresh."},
   {t:"Repair fast and plainly — 'that was my afternoon landing on you, not your work; sorry' — then trace the circuit: where did the charge come from, and what's your discharge move for next time? A walk before re-entering the floor. A Reset in the lift.",best:true,fb:"The repair costs ten seconds and models everything: pressure gets owned, not relayed. The trace is what stops the rerun — you can't uncatch the call, but the block-walk before the floor is a choice available every time."},
   {t:"Over-repair: apologise today, again tomorrow, and once more with coffee on Thursday.",best:false,fb:"The triple apology converts your discomfort into their burden — now they're managing your guilt. One clean repair, then behave differently. Done."}]},
 {id:"sf9",who:"Yourself",title:"The reflex yes",
  prompt:`'Can you take the Zurich workshop too?' 'Of course.' The yes was out before the calendar loaded. Tonight, looking at the week, you understand what you agreed to — and who'll pay for it.`,
  mech:`People-pleasing wiring: the yes protects the moment's harmony by mortgaging the week — a tiny RELATEDNESS win purchased with AUTONOMY. The skill isn't never agreeing; it's noticing the reflex has a signature.`,
  options:[
   {t:"Deliver it — a yes is a yes, and renegotiating looks flaky.",best:false,fb:"Delivering resentfully costs more than the awkward correction: the work arrives thin, the resentment leaks sideways, and the reflex gets reinforced for next time."},
   {t:"Renegotiate early, while it's cheap: 'I said yes too fast — looking at the week, here's what's possible: Zurich OR the pitch prep at full quality, or Zurich with the analysis pushed to Monday. Your call.' Then install the buffer: 'let me check the calendar' as your default reply.",best:true,fb:"A correction within a day reads as diligence; the same correction on deadline eve reads as failure. And the calendar-check phrase is the structural fix — it inserts five seconds between the ask and your wiring."},
   {t:"Keep the yes but quietly trim scope on something else to make room.",best:false,fb:"The silent trade means someone downstream gets surprise-shortchanged without a decision ever being made. Trades are fine — invisible ones aren't."}]},
 {id:"sf10",who:"Yourself",title:"The pool with a phone in it",
  prompt:`First real leave in a year. Day two, and you've checked the phone eleven times before noon. The handover was thorough. The team is fine. Your thumb disagrees.`,
  mech:`Detachment failure with a physiological engine: a year of vigilance doesn't switch off at the gate — checking IS the withdrawal symptom. The vigilance was adaptive at the desk; at the pool it's just the habit outliving its habitat.`,
  options:[
   {t:"Compromise: work a light hour each morning to stay calm for the rest of the day.",best:false,fb:"The workation hour re-arms the vigilance daily — you'd be taking eleven small doses of the desk. Recovery research is blunt: partial detachment restores almost nothing."},
   {t:"Structure the detox: one defined check window (or none) agreed with your deputy, notifications off outside it, phone physically elsewhere at the pool. Expect the twitchiness for two days — it's withdrawal, and it passes.",best:true,fb:"The defined window satisfies the vigilance system without feeding it — 'the check is at 5pm' quiets the thumb at noon. By day four the twitch fades and actual restoration starts. This is rest as a skill, practised."},
   {t:"Cold turkey with willpower: phone in the safe, white knuckles at the pool.",best:false,fb:"Willpower against wiring loses by day three — and the anxiety of total blackout can outcost the checking. Structure beats abstinence: a window, a deputy, a taper."}]},
 {id:"ow1",who:"Out in the world",title:"The Central line shove",
  prompt:`Rush hour. A shoulder catches you hard boarding at Bank — no glance back, no apology, gone into the crowd. The surge arrives instantly, absurdly large for what happened.`,
  mech:`A FAIRNESS-and-STATUS microdose: anonymous disrespect with no venue for redress — which is exactly why it burns; the account can never be settled. The 90-second wave, in its purest lab conditions.`,
  options:[
   {t:"Catch up and make the point — people shouldn't get away with that.",best:false,fb:"A confrontation with a stranger over a shove has no winning outcome: best case an empty apology, worst case an incident. The account you'd be settling doesn't exist to them."},
   {t:"Let the wave be a wave: name it — 'that's anger, fair enough' — breathe out long, and let the walk from the platform metabolise it. It was weather; you were rained on.",best:true,fb:"This is the cheapest 90-second practice rep the city offers — no relationship at stake, pure wave-riding. Handled here, the skill is warmer when it matters at 2pm with an MD."},
   {t:"Replay it up the escalator, compose the retort you didn't make, arrive at the office still boarding that train.",best:false,fb:"The stranger spent zero seconds on this; the replay bills you for twenty minutes. Whoever you greet first at the office inherits the residue."}]},
 {id:"ow2",who:"Out in the world",title:"The queue jumper",
  prompt:`Pret, 12:40, queue out the door. Someone slides in three places ahead with practised nonchalance. Nobody says anything. The injustice is microscopic and somehow enormous.`,
  mech:`FAIRNESS again — the button fires identically for queue theft and credit theft; only the stakes differ. Useful data: your fairness sensitivity is calibrated hot, which serves you in deals and taxes you at lunch.`,
  options:[
   {t:"Announce it to the room: 'Excuse me, the queue is back THERE.'",best:false,fb:"Public prosecution over ninety seconds of queue time — the room's discomfort will outweigh the justice, and your heart rate pays either way."},
   {t:"Choose deliberately: one calm line — 'mate, queue's back there' — if it matters to you today, or a conscious let-it-go if it doesn't. The key is CHOOSING, not swallowing.",best:true,fb:"Both options are composure when chosen; only the involuntary swallow-and-seethe costs you. Chosen tolerance and chosen assertion are the same skill wearing different coats."},
   {t:"Say nothing and prosecute him silently through your entire sandwich.",best:false,fb:"The unspoken version is the expensive one: he's forgotten you exist and you're still holding court at 1:15. Speak or release — the middle path is where the tax lives."}]},
 {id:"ow3",who:"Out in the world",title:"Gate C47, cancelled",
  prompt:`The red-eye to Zurich is cancelled — client meeting at nine tomorrow. The gate agent has a queue of forty and control over none of it. The man ahead of you is already shouting.`,
  mech:`CERTAINTY and AUTONOMY vaporised at once — trapped, late, powerless. And a live demonstration ahead of you: the shouter is negotiating with the one person present who didn't cancel anything.`,
  options:[
   {t:"When your turn comes, make the stakes vivid — this meeting matters more than a leisure trip; press hard.",best:false,fb:"The agent can't weigh your meeting against anyone's anything — she has a rebooking screen and a queue. Pressure spends her goodwill, which is the only currency at this desk."},
   {t:"Run parallel tracks: on the app and with your travel desk while queueing, then give the agent the easiest case of her hour — 'I know none of this is yours; here's what would save me: anything landing Zurich by 8.' Warm, specific, brief.",best:true,fb:"Kindness-as-strategy is real: agents quietly do more for the civil ones, and the parallel rebooking usually wins the race anyway. Save the feedback for the airline survey; the person at the desk is not the airline."},
   {t:"Accept doom: the meeting's blown, draft the apologetic email from the queue.",best:false,fb:"Catastrophe declared before options explored — there are two other airlines, a 6am, and a train. Forecast after the facts, not before."}]},
 {id:"ow4",who:"Out in the world",title:"The wrong dish, mid-pitch",
  prompt:`Client dinner, the relationship kind. Your main arrives wrong — properly wrong. The conversation is flowing, the client mid-story, the waiter hovering with a question mark.`,
  mech:`A tiny AUTONOMY blip against a large context: the dinner's actual purpose is trust, and everything at the table — including how you treat a wrong plate — is content.`,
  options:[
   {t:"Handle it properly but discreetly: pause, explain the error to the waiter, get it re-fired.",best:false,fb:"Even a polite correction inserts a fifteen-minute asymmetry — the client eating while you wait — and moves the table's attention to logistics. High cost for a plate."},
   {t:"Wave it through with a smile and stay in the conversation — the dinner is the meal.",best:true,fb:"The client's story doesn't get interrupted, and what the table registers is someone unbothered by small friction — which is quietly excellent content. You can eat properly tomorrow; the trust is tonight."},
   {t:"Make it a lightly comic bit with the waiter to show you're easy-going.",best:false,fb:"The performance of easy-going is not easy-going — it still redirects the room to your plate and your bit. The genuinely unbothered version needs no audience."}]},
 {id:"ow5",who:"Out in the world",title:"The near-miss",
  prompt:`Cycling in, a cab pulls out without looking — you brake into a skid, heart slamming, inches from real damage. The driver shrugs. You arrive at the office six minutes later, fully flooded, first meeting at nine.`,
  mech:`This isn't metaphorical threat — it's the survival system doing its actual job, and the adrenaline is fully justified. The risk is transmission: a body in genuine fight-or-flight walking straight into a budget discussion.`,
  options:[
   {t:"Straight to the desk — coffee, emails, the meeting. Motion will burn it off.",best:false,fb:"Desk adrenaline doesn't burn off; it re-targets. The first ambiguous email becomes the cab, and someone innocent takes the horn you didn't get to sound."},
   {t:"Give the chemistry its exit before the floor: two minutes walking the block, physiological sighs, name it — 'near-miss, system did its job, standing down.' THEN the lift.",best:true,fb:"Completing the stress cycle takes minutes when you do it deliberately and hours when you don't. The block-walk is the difference between arriving as yourself and arriving as the skid."},
   {t:"Recount it vividly to the first three colleagues you see, driver's shrug included.",best:false,fb:"One telling is discharge; three tellings is rehearsal — each rerun re-fires the wave. Tell it once, then let the walk do the rest."}]},
 {id:"ow6",who:"Out in the world",title:"The 1am bassline",
  prompt:`Your neighbour's party finds its second wind at 1am. Presentation at nine. The bassline is now personally addressed to you, and you're composing wall-bangs of increasing eloquence.`,
  mech:`AUTONOMY (your sleep hostage), FAIRNESS (their fun, your bill) — amplified by night-brain, which converts nuisance into persecution and tomorrow's meeting into ruins-in-advance.`,
  options:[
   {t:"Doorstep them now, at 1am, in the state you're in.",best:false,fb:"A flooded confrontation with a party crowd at 1am has every bad ending and no good one. The doorstep conversation exists — it's tomorrow's, sober and daylit."},
   {t:"Solve tonight tactically — earplugs, white noise, the far room — and decouple the catastrophe: you've presented well on short sleep before. Tomorrow, one civil doorstep line: 'heads-up when it's a late one, and Thursdays are brutal for me.'",best:true,fb:"Tonight is triage, tomorrow is diplomacy — separating the two is the skill. And the sleep-catastrophe deflation matters: the presentation dies from doom-forecasting at 1:30, not from the bassline."},
   {t:"Lie there prosecuting them, checking the clock at 1:40, 2:10, 2:35 — filing each timestamp as evidence.",best:false,fb:"The clock-checking ritual is co-hosting their party from your bed. The earplugs are IN THE DRAWER. Rage is optional; the drawer is right there."}]},
 {id:"ow7",who:"Out in the world",title:"Your friend and the waiter",
  prompt:`Dinner with friends. The food's slow, and one of your group starts in on the waiter — sarcastic, sharp, enjoying it slightly. The waiter is about nineteen. Your toes curl.`,
  mech:`Vicarious SHAME plus a values collision: someone at your table is spending status on the one person who can't spend it back. Complicity is the quiet risk — the waiter experiences 'the table', not the individual.`,
  options:[
   {t:"Stay out of it — not your conversation, and correcting a friend publicly breaks its own rule.",best:false,fb:"Half right — no public correction — but full silence makes the table unanimous. The waiter needs a counter-signal from SOMEONE, and counter-signals don't require confrontation."},
   {t:"Counter-signal in real time — warm eye contact, 'no rush at all, thanks so much' — visibly tip well, and if it's a pattern, one private word later: 'you're better than how that landed.'",best:true,fb:"You repair the waiter's ledger without prosecuting your friend at the table — kindness as a counterweight rather than a courtroom. The private word, friend-to-friend, is where the actual correction lives."},
   {t:"Call it at the table: 'Mate, don't take it out on him.'",best:false,fb:"Public correction converts embarrassment into a standoff — your friend defends the sarcasm to save face, the waiter becomes the arena, dinner curdles. Same message travels better in private."}]},
 {id:"ow8",who:"Out in the world",title:"The quiet carriage",
  prompt:`The 7:14, quiet carriage, clearly marked. A man settles in and starts a speakerphone call of magnificent volume and no urgency. Every third passenger performs a sigh. Nobody speaks.`,
  mech:`FAIRNESS at commuter scale — a rule you honour, flouted at your expense — plus the peculiar rage of collective silence: everyone waiting for someone else to be the enforcement.`,
  options:[
   {t:"Deploy the escalating stare-and-sigh repertoire until he senses the carriage's judgement.",best:false,fb:"Passive signalling is invisible to phone-callers by definition — the audience seethes for forty minutes and he exits unaware anyone existed. Maximum cost, zero delivery."},
   {t:"Decide the price and act once: either one civil line — 'quiet carriage, would you mind?' — delivered friendly, or headphones and a genuine release. Renting him forty minutes of your head is the only losing trade.",best:true,fb:"Most people comply instantly when asked pleasantly — the ask is cheaper than the resentment. And if you choose headphones instead, choose them fully: released is released."},
   {t:"Hold the principle: you shouldn't NEED headphones in the quiet carriage — someone must uphold the standard, silently and bitterly.",best:false,fb:"'Shouldn't need to' is correct and useless — the standard isn't being upheld by your suffering; it's just suffering. Principles need enforcement or release, and glaring is neither."}]}];

// Test-your-knowledge quizzes, one per course.
const QUIZZES={
 foundations:[
  {q:"The chemical surge of an emotion — adrenaline, cortisol — physically washes through in about…",o:[["90 seconds",1,"Right — anything longer is your thoughts re-triggering the wave."],["15 minutes",0,"Shorter: about 90 seconds. If it lasts 15 minutes, rumination is re-firing it."],["An hour",0,"About 90 seconds. The hour version is the replay loop, not the chemistry."]]},
  {q:"Naming an emotion ('that's frustration') helps because…",o:[["It measurably reduces amygdala activity",1,"Affect labelling — the label moves the experience toward the part of the brain that can act on it."],["It distracts you from the feeling",0,"It's not distraction — labelling engages the feeling and measurably lowers the alarm response."],["It suppresses the emotion politely",0,"The opposite of suppression: you acknowledge precisely, which is why it works."]]},
  {q:"'Stressed' is a weak label because…",o:[["Different emotions underneath it need different responses",1,"Frustration, anxiety, and helplessness each have a different fix — 'stressed' hides which one you need."],["It sounds unprofessional",0,"Nothing to do with polish — it's that the label carries no information about the fix."],["Stress isn't a real emotion",0,"It's real — just imprecise. The problem is it doesn't tell you what to do next."]]},
  {q:"Being micromanaged presses which of the five buttons?",o:[["Autonomy",1,"Control over your own work — micromanagement takes the choice away, and that's the sting."],["Status",0,"There can be a status flavour, but the core wound is autonomy — your control was taken."],["Certainty",0,"Micromanagers usually give you MORE certainty. What they take is autonomy."]]}],
 heat:[
  {q:"HALT — the four states that make an amygdala hijack far more likely — stands for…",o:[["Hungry, Angry, Lonely, Tired",1,"On a 14-hour day you can be all four — which is why the 10pm reply reads so differently at 9am."],["Hostile, Anxious, Late, Tense",0,"Close in spirit — but it's Hungry, Angry, Lonely, Tired: depletion states, not emotions."],["Heated, Agitated, Loud, Terse",0,"Those are symptoms of the hijack. HALT is what makes you vulnerable to it: Hungry, Angry, Lonely, Tired."]]},
  {q:"The one iron rule while emotionally flooded:",o:[["No irreversible actions",1,"No sent email, no verdict, no 'quick word'. The queue can hold ten minutes; regret can't be recalled."],["Tell everyone you're flooded",0,"Sometimes useful, never required. The rule is narrower and harder: nothing irreversible."],["Leave the building",0,"A walk helps — but the rule is about actions, not location: nothing irreversible while the wave is up."]]},
  {q:"Research on venting anger (ranting, punching pillows) shows it…",o:[["Rehearses and deepens the anger",1,"Each retelling re-runs the wave and carves the groove deeper. Movement discharges; narration rehearses."],["Releases it harmlessly",0,"The catharsis theory failed testing — venting is practice, not release."],["Works only in private",0,"Private or public, rehearsal is rehearsal. What discharges the charge is physical: movement, cold water, one write-out."]]},
  {q:"The clean anger formula, in order:",o:[["Situation → feeling → value → request",1,"'When X happened → I was frustrated → because I care about Y → next time, Z.' No character verdicts anywhere."],["Feeling → blame → apology → moving on",0,"Blame triggers defence and apologies you extract don't change behaviour. Situation → feeling → value → request."],["Warning → escalation → consequence",0,"That's a disciplinary ladder, not clean anger. Clean anger is one conversation: situation, feeling, value, request."]]}],
 ground:[
  {q:"In the control map, your worry-energy should concentrate on…",o:[["The Control and Influence circles",1,"Energy pooled in the Concern circle achieves nothing and costs everything — find each worry's handle one ring inward."],["The Concern circle — that's where the threats are",0,"That's exactly where energy is wasted. The threats live there; your leverage doesn't."],["All three equally",0,"Deliberately unequal: Control first, Influence second, and Concern gets acknowledged, not worked."]]},
  {q:"The trap in learned helplessness is that the feeling…",o:[["Generalises beyond the facts",1,"One uncontrollable thing whispers that everything is uncontrollable. The antidote is a precise audit."],["Is always inaccurate",0,"It's often accurate about specific things — the trap is the spread from 'this decision' to 'everything'."],["Only affects junior people",0,"Seniority doesn't immunise — reorgs and markets manufacture it at every level."]]},
  {q:"Agency is rebuilt primarily by…",o:[["Small completed actions",1,"Mastery experience: each completion is evidence that effort still connects to outcome. Size barely matters."],["Positive affirmations",0,"Helplessness is broken by evidence, not affirmations — one absurdly small completed step beats any mantra."],["Waiting for conditions to improve",0,"Waiting is the helplessness talking. Shrink the next move until it's doable now, then complete it."]]},
  {q:"The strongest way to ask for help:",o:[["Specific and optioned: 'a day's extension OR one analyst for two days — which works better?'",1,"Easy to grant, reads as judgement. Surprise blow-ups damage reputations; early precise asks build them."],["Broad and honest: 'I'm drowning'",0,"Honest, but it hands the other person the sizing work. Specific + optioned asks get granted."],["Only after exhausting every alternative",0,"That's the lone-hero tax — by then it's expensive. Early asks signal judgement, not weakness."]]}],
 presence:[
  {q:"Emotional contagion in a team flows mainly…",o:[["Down the hierarchy, from leader to team",1,"Your Tuesday stress becomes the team's within an hour, unspoken. You stopped having private moods with your first direct report."],["Up the hierarchy",0,"Some flows up, but the strong current runs downward — which is why your regulation is multiplied by headcount."],["Sideways between peers only",0,"Peer contagion exists, but the leader's mood is the dominant weather system."]]},
  {q:"SBI stands for…",o:[["Situation, Behaviour, Impact",1,"Specific situation, observable behaviour, real impact — and no character verdicts anywhere."],["Standards, Blame, Improvement",0,"Blame is exactly what SBI removes. Situation, Behaviour, Impact."],["Summary, Background, Instruction",0,"That's a briefing format. Feedback is Situation, Behaviour, Impact."]]},
  {q:"Your reaction when someone brings you bad news early sets…",o:[["The price of the next early warning",1,"Heat teaches the team to sit on problems until they explode; 'good catch — what do we do?' buys an early-warning system."],["Their annual rating",0,"It sets something more valuable: whether you ever hear bad news early again."],["The tone for the whole quarter",0,"Narrower and more important: it prices the next warning. Expensive warnings stop coming."]]},
  {q:"Handling pressure from above, a leader should…",o:[["Pass urgency and facts through; filter panic and heat",1,"Transformer, not wire: raw forwarding burns the team, silent absorption burns you."],["Shield the team from all of it",0,"Full shielding means absorbing it yourself — that's the ulcer path. Pass the facts; filter the heat."],["Forward it verbatim so everyone feels the stakes",0,"'The MD is furious, everything by Monday' produces burnt-out teams, not better output."]]}],
 roots:[
  {q:"The exhaustion after code-switching between cultural worlds is…",o:[["A real metabolic cost of a real skill",1,"Switching operating systems all day costs energy — it's infrastructure work, not a character flaw."],["A sign of inauthenticity",0,"The opposite: multiple registers are range. The cost is real precisely because the skill is real."],["Something that fades with practice",0,"It gets more efficient but never free — which is why a no-switch zone is infrastructure, not luxury."]]},
  {q:"What actually restores you after work, per recovery research:",o:[["Psychological detachment — a genuine mental sign-off",1,"Hours off don't restore; detachment does. Scrolling with Slack open is low-grade work with worse posture."],["Total hours away from the desk",0,"Hours don't do it if the mind stays on the desk. Detachment is the active ingredient."],["Sleep alone",0,"Sleep is necessary but evening detachment is what recovery research keeps isolating — and it improves the sleep too."]]},
  {q:"In most families, the heavy repeated questions (promotion? marriage?) usually decode to…",o:[["'We miss you and want to know you're safe'",1,"The delivery is expectation; the payload is love. (Where a parent consistently leaves you smaller, not loved — that's Kin course terrain.)"],["A genuine audit of your progress",0,"It lands like an audit from eight time zones away, but the payload underneath is usually connection and worry."],["Pressure you're obliged to satisfy",0,"Translate before obeying: answer the love, set warm boundaries on the script."]]},
  {q:"On 70-hour weeks, friendship survives on…",o:[["Small consistent deposits",1,"The two-line message, the standing dinner. Five minutes reliably beats five hours theoretically."],["Occasional grand gestures",0,"Grandeur can't compound. Consistency can — small deposits, kept up."],["Waiting for a quieter season",0,"The quieter season is a myth on this calendar. Friendships are equipment for the demanding years, not a reward after them."]]}],
 kin:[
  {q:"The core reframe when a parent runs a narcissistic pattern:",o:[["The pattern is about their regulation, not your worth",1,"The deficit was never yours. Explanation isn't excuse — but it relocates the problem where it belongs."],["They'll change if you finally explain it well enough",0,"The old game has no winning move — the goalposts serve their regulation. Redefine the win instead."],["You must have contributed to it somehow",0,"Children of such parents are trained to assume the deficit is theirs. It isn't, and it never was."]]},
  {q:"JADE — the four hooks to avoid — stands for…",o:[["Justify, Argue, Defend, Explain",1,"Every explanation opens a debate you can't win, because the argument was never about the topic."],["Judge, Accuse, Dismiss, Escalate",0,"Those are his moves. Yours to avoid are Justify, Argue, Defend, Explain — the calm broken record instead."],["Joke, Avoid, Deflect, Exit",0,"Deflection has its place, but JADE names the hooks: Justify, Argue, Defend, Explain."]]},
  {q:"A boundary with someone who steamrolls boundaries works because…",o:[["It's an action you take, not an agreement they honour",1,"'If X happens, I end the call, warmly.' He doesn't have to agree — just to experience it, consistently."],["Repetition eventually persuades them",0,"Persuasion is the old game. The boundary works without their agreement — that's the whole design."],["You announce consequences firmly enough",0,"Announcements invite negotiation. Actions, taken calmly and consistently, don't need his sign-off."]]},
  {q:"With such a parent, sharing achievements and vulnerabilities should be…",o:[["Rationed — achievements become trophies, vulnerabilities can become ammunition",1,"Give the relationship only the weight it can carry; save your full self for people who've earned it."],["Increased, to build trust over time",0,"With this pattern, more disclosure means more material. Ration the supply and the ammunition."],["Shared fully but only in person",0,"The channel isn't the problem — the pattern is. Ration what, not just where."]]}],
 steel:[
  {q:"A stress cycle actually completes when…",o:[["The body gets a physical full stop — movement, breath, warmth, connection",1,"The stressor ending doesn't end the stress; the adrenaline needs its own exit. That's why you can win the day and lie awake at 1am."],["The task that caused it is finished",0,"Sending the email closes the task, not the chemistry — the body needs its own signal."],["Enough time passes",0,"Uncompleted cycles accumulate as allostatic load. Completion is active: move, breathe, connect."]]},

let S;
function load(){
  try{ S=JSON.parse(localStorage.getItem("samatva"))||null; }catch(e){ S=null; }
  if(!S) S={name:"",onboarded:false,checkIns:[],journal:[],done:[],calmSec:0,reframes:0,resets:0};
  if(!S.theme) S.theme="auto";
  if(!S.worries) S.worries=[];
  if(!S.resetLog) S.resetLog=[];
  if(!S.profile) S.profile=[];
  if(S.voice===undefined) S.voice=true;
  if(!S.doneAt) S.doneAt={};
  if(!S.gymDone) S.gymDone=[];
  if(!S.quizScores) S.quizScores={};
}
function save(){ try{ localStorage.setItem("samatva",JSON.stringify(S)); }catch(e){} }
function effectiveTheme(){
  if(S.theme!=="auto") return S.theme;
  return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
}
function applyTheme(){
  if(S.theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",S.theme);
}
function toggleTheme(){
  S.theme=effectiveTheme()==="dark"?"light":"dark";
  save(); applyTheme(); render();
}
function setTheme(t){ S.theme=t; save(); applyTheme(); render(); }

/* ---------- Voice (on-device speech synthesis — free, private, no network) ---------- */
const TTS={
  enabled:("speechSynthesis" in window),
  voice:null,
  pick(){
    if(!this.enabled) return;
    const vs=speechSynthesis.getVoices();
    this.voice=
      vs.find(v=>/en(-|_)GB/i.test(v.lang)&&/kate|serena|sonia|stephanie|martha|female/i.test(v.name))||
      vs.find(v=>/en(-|_)GB/i.test(v.lang))||
      vs.find(v=>/^en/i.test(v.lang))||null;
  },
  speak(text,rate){
    if(!this.enabled||!text) return null;
    const u=new SpeechSynthesisUtterance(text);
    if(this.voice) u.voice=this.voice;
    u.rate=rate||0.95;
    speechSynthesis.speak(u);
    return u;
  },
  stop(){ if(this.enabled) speechSynthesis.cancel(); }
};
if(TTS.enabled){ TTS.pick(); speechSynthesis.onvoiceschanged=()=>TTS.pick(); }

let reading=false;
function stopAllAudio(){
  stopBreath(); stopMed(); stopUnwind(); TTS.stop(); reading=false;
}

// Read a full lesson aloud: sections, takeaways, reflection prompt.
function toggleRead(lid){
  if(!TTS.enabled) return;
  const btn=document.getElementById("read-btn");
  if(reading){
    TTS.stop(); reading=false;
    if(btn) btn.textContent="🔊 Listen to this lesson";
    return;
  }
  const l=COURSES.flatMap(c=>c.lessons).find(x=>x.id===lid);
  reading=true;
  if(btn) btn.textContent="⏹ Stop listening";
  TTS.stop();
  const parts=[
    l.title+".",
    ...l.sections.flatMap(s=>[s[0]+".", s[1]]),
    "To keep. "+l.take.join(" … "),
    "To reflect on. "+l.reflect
  ];
  parts.forEach((p,i)=>{
    const u=TTS.speak(p,0.95);
    if(u&&i===parts.length-1){
      u.onend=()=>{
        reading=false;
        const b=document.getElementById("read-btn");
        if(b) b.textContent="🔊 Listen to this lesson";
      };
    }
  });
}

function nextLesson(){
  for(const c of COURSES){ const l=c.lessons.find(l=>!S.done.includes(l.id)); if(l) return [c,l]; }

  else if(nav.page==="gymrun") html=viewGymRun(nav.p.id);

// Spaced resurfacing: one takeaway per day, rotating through completed lessons,
// so what you've learned keeps coming back instead of fading.
function keeperCard(){
  const pool=[];
  COURSES.forEach(c=>c.lessons.forEach(l=>{
    if(S.done.includes(l.id)) l.take.forEach(t=>pool.push([t,l.title]));
  }));
  if(!pool.length) return "";
  const day=Math.floor(Date.now()/86400000);
  const k=pool[day%pool.length];
  return `<div class="card" style="margin-top:12px">
    <div class="eyebrow" style="color:var(--moss); margin-bottom:6px">Worth keeping</div>
    <p class="quote" style="margin:0 0 6px">${k[0]}</p>
    <div class="tiny">from “${k[1]}” · a takeaway from your completed lessons resurfaces here each day</div>
  </div>`;
}

function importData(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(typeof d!=="object"||!Array.isArray(d.checkIns)||!Array.isArray(d.journal)) throw 0;
      S=d;
      if(!S.theme) S.theme="auto";
      if(!S.worries) S.worries=[];

      if(!S.profile) S.profile=[];
      save(); applyTheme(); render();
      alert("Backup restored.");
    }catch(e){ alert("That file doesn't look like a Samatva backup."); }
  };
  reader.readAsText(f);
  input.value="";
}

// Profile- and pattern-driven lesson suggestions: which course matters most
// to this person right now, given who they told us they are and what they log.
function suggestedLessons(){
  const firstUndone=cid=>{
    const c=COURSES.find(x=>x.id===cid);
    const l=c.lessons.find(x=>!S.done.includes(x.id));
    return l?{c,l}:null;
  };
  const picks=[];
  const addPick=(cid,why)=>{
    const p=firstUndone(cid);
    if(p&&!picks.some(x=>x.l.id===p.l.id)) picks.push({...p,why});
  };
  // Recent difficult family check-ins outrank everything
  const cutoff=Date.now()-14*86400000;
  const famHard=S.checkIns.filter(c=>new Date(c.date).getTime()>cutoff
    &&c.contexts.includes("Family")&&c.emotions.some(e=>DIFFICULT.has(e))).length;
  if(famHard>=1||S.profile.includes("Family is complicated")) addPick("kin","Because family is complicated");
  if(S.profile.includes("I manage a team")) addPick("presence","Because you lead a team");
  if(S.profile.includes("High-stakes meetings")) addPick("presence","For the rooms that matter");
  if(S.profile.includes("Long hours")) addPick("steel","For the long hours");
  if(S.profile.includes("Far from home")) addPick("roots","For the distance from home");
  const nl=nextLesson();
  if(nl&&!picks.some(x=>x.l.id===nl[1].id)) picks.push({c:nl[0],l:nl[1],why:"Next in your path"});
  return picks.slice(0,2);
}

function quizQ(){
  const qs=QUIZZES[qz.cid];
  const item=qs[qz.i];
  // Shuffle options per render so the right answer moves around.
  const order=item.o.map((_,i)=>i).sort(()=>Math.random()-0.5);

  return `<div class="eyebrow" style="margin:2px 2px 8px">Question ${qz.i+1} of ${qs.length}</div>

    <div id="quiz-fb"></div>
  </div>`;
}
function quizPick(pos){
  const qs=QUIZZES[qz.cid];
  const item=qs[qz.i];
  const oi=qz.order[pos];
  const picked=item.o[oi];
  const correct=picked[1]===1;
  if(correct) qz.score++;
  qz.order.forEach((o2,p2)=>{
    const el=document.getElementById("qopt-"+p2);
    el.disabled=true;
    if(p2===pos) el.classList.add(correct?"best":"notbest");
    else if(item.o[o2][1]===1) el.classList.add("best");
  });

/* ---------- Ripples (mindless unwind game) ---------- */
let uw={on:false};
function viewUnwind(){
  return `<button class="back" onclick="goTab('tools')">‹ Toolkit</button>
  <h1 style="margin-top:2px">Ripples</h1>
  <p class="sub" style="margin:-6px 2px 10px">Nothing to win, nothing to lose. Tap the water, pop the bubbles, let the mind idle.</p>
  <canvas id="uw-canvas" style="width:100%; height:60vh; display:block; border-radius:20px; touch-action:none"></canvas>
  <div class="center tiny" id="uw-time" style="margin-top:10px"></div>`;
}
function initUnwind(){
  const cv=document.getElementById("uw-canvas");
  if(!cv) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=cv.clientWidth, h=cv.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext("2d");
  ctx.scale(dpr,dpr);
  const dark=effectiveTheme()==="dark";
  uw={on:true, ctx, w, h, dark, ripples:[], bubbles:[], parts:[],
      last:performance.now(), spawn:0.9, elapsed:0, raf:null, clock:null};
  uw.clock=setInterval(()=>{
    uw.elapsed++;
    const el=document.getElementById("uw-time");
    if(el) el.textContent=`${Math.floor(uw.elapsed/60)}:${String(uw.elapsed%60).padStart(2,"0")} adrift`;
  },1000);
  cv.addEventListener("pointerdown",uwTap);
  uw.raf=requestAnimationFrame(uwFrame);
}
const UW_HUES=[[95,179,196],[147,160,216],[132,165,126],[176,139,171]];
function uwSpawnBubble(){
  const hue=UW_HUES[Math.floor(Math.random()*UW_HUES.length)];
  uw.bubbles.push({
    x:20+Math.random()*(uw.w-40), y:uw.h+20,
    r:9+Math.random()*17, vy:14+Math.random()*18,
    phase:Math.random()*6.28, sway:6+Math.random()*14, hue
  });
}
function uwTap(ev){
  if(!uw.on) return;
  const rect=ev.target.getBoundingClientRect();
  const x=ev.clientX-rect.left, y=ev.clientY-rect.top;
  let popped=false;
  for(let i=uw.bubbles.length-1;i>=0;i--){
    const b=uw.bubbles[i];
    if(Math.hypot(b.x-x,b.y-y)<b.r+14){
      for(let k=0;k<9;k++){
        const a=Math.random()*6.28, sp=30+Math.random()*70;
        uw.parts.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.7,hue:b.hue,r:1.5+Math.random()*2.5});
      }
      uw.bubbles.splice(i,1);
      popped=true;
      if(navigator.vibrate) navigator.vibrate(8);
      break;
    }
  }
  if(!popped) uw.ripples.push({x,y,t:0});
}
function uwFrame(now){
  if(!uw.on) return;
  const dt=Math.min((now-uw.last)/1000,0.05);
  uw.last=now;
  const c=uw.ctx;
  // water
  const g=c.createLinearGradient(0,0,0,uw.h);
  if(uw.dark){ g.addColorStop(0,"#0d1c22"); g.addColorStop(1,"#0a141c"); }
  else{ g.addColorStop(0,"#e3f0f2"); g.addColorStop(1,"#d3e6ea"); }
  c.fillStyle=g;
  c.fillRect(0,0,uw.w,uw.h);
  // spawn
  uw.spawn+=dt;
  if(uw.spawn>1.15&&uw.bubbles.length<12){ uw.spawn=0; uwSpawnBubble(); }
  // ripples
  for(let i=uw.ripples.length-1;i>=0;i--){
    const r=uw.ripples[i];
    r.t+=dt;
    for(let ring=0;ring<3;ring++){
      const rad=r.t*90+ring*16;
      const alpha=Math.max(0,(1.5-r.t)/1.5)*0.35*(1-ring*0.25);
      if(alpha<=0) continue;
      c.beginPath();
      c.arc(r.x,r.y,rad,0,6.29);
      c.strokeStyle=uw.dark?`rgba(120,200,215,${alpha})`:`rgba(31,122,140,${alpha})`;
      c.lineWidth=1.6;
      c.stroke();
    }
    if(r.t>1.5) uw.ripples.splice(i,1);
  }
  // bubbles
  for(let i=uw.bubbles.length-1;i>=0;i--){
    const b=uw.bubbles[i];
    b.y-=b.vy*dt;
    b.phase+=dt;
    const x=b.x+Math.sin(b.phase)*b.sway*0.15;
    if(b.y<-30){ uw.bubbles.splice(i,1); continue; }
    const [R,G,B]=b.hue;
    const grad=c.createRadialGradient(x-b.r*0.3,b.y-b.r*0.35,b.r*0.15,x,b.y,b.r);
    grad.addColorStop(0,`rgba(255,255,255,${uw.dark?0.30:0.75})`);
    grad.addColorStop(1,`rgba(${R},${G},${B},${uw.dark?0.34:0.42})`);
    c.beginPath(); c.arc(x,b.y,b.r,0,6.29);
    c.fillStyle=grad; c.fill();
    c.strokeStyle=`rgba(${R},${G},${B},${uw.dark?0.5:0.55})`;
    c.lineWidth=1; c.stroke();
  }
  // pop particles
  for(let i=uw.parts.length-1;i>=0;i--){
    const pa=uw.parts[i];
    pa.life-=dt;
    if(pa.life<=0){ uw.parts.splice(i,1); continue; }
    pa.x+=pa.vx*dt; pa.y+=pa.vy*dt; pa.vy+=40*dt;
    const [R,G,B]=pa.hue;
    c.beginPath(); c.arc(pa.x,pa.y,pa.r*pa.life,0,6.29);
    c.fillStyle=`rgba(${R},${G},${B},${pa.life})`;
    c.fill();
  }
  uw.raf=requestAnimationFrame(uwFrame);
}
function stopUnwind(){
  if(!uw.on) return;
  uw.on=false;
  cancelAnimationFrame(uw.raf); clearInterval(uw.clock);
  if(uw.elapsed>=30){ S.calmSec+=uw.elapsed; save(); }
}

/* ---------- CBT engine (guided thought record) ---------- */
// A step-by-step cognitive-restructuring wizard. The engine reads the
// automatic thought, detects likely distortions from wording, asks targeted
// Socratic questions per distortion, and offers balanced-thought starters.
const SOCRATIC={
 "Mind reading":["What hard evidence do you have for what they're actually thinking?","What are two other explanations for their behaviour?"],
 "Catastrophising":["What's the most likely outcome — not the worst one?","If the bad version did happen, how would you actually cope?"],
 "All-or-nothing":["What's the 70% version of this — the ground between perfect and failure?","What partial wins is this thought deleting?"],
 "Personalising":["What share of this was genuinely within your control?","Who and what else contributed to the outcome?"],
 "Should-storms":["Who wrote this rule — and would you hold a friend to it?","What would 'good enough for today' look like?"],
 "Discounting wins":["If a colleague did exactly the same thing, would you call it luck?","What skill or judgement did it actually take?"]};
const STARTERS={
 "Mind reading":"I don't actually know what they think. What I do know is…",
 "Catastrophising":"The most likely outcome here is…",
 "All-or-nothing":"Parts of this went wrong AND parts went fine:…",
 "Personalising":"My share of this was…, but it also depended on…",
 "Should-storms":"It would have been better if…, and it's workable that…",
 "Discounting wins":"It counts. What it took was…"};
function detectDistortions(text){
  const s=" "+text.toLowerCase()+" ";
  const hits=[];
  if(/(always|never|everyone|every ?one|no ?one|nothing ever|every time|completely|totally)/.test(s)) hits.push("All-or-nothing");
  if(/(should|shouldn'?t|must|mustn'?t|have to|ought to|supposed to)/.test(s)) hits.push("Should-storms");
  if(/(he thinks|she thinks|they think|they'?ll think|must think|everyone (saw|thinks|knows)|they can (see|tell)|judg)/.test(s)) hits.push("Mind reading");
  if(/(disaster|ruined|catastroph|worst|career (is|will be)|finished|it'?s over|what if|fall apart|lose everything|fired)/.test(s)) hits.push("Catastrophising");
  if(/(my fault|because of me|i caused|all on me|i ruined|i let)/.test(s)) hits.push("Personalising");
  if(/(just luck|a fluke|doesn'?t count|anyone could|only because)/.test(s)) hits.push("Discounting wins");
  return [...new Set(hits)];
}

let cbt={};
function viewReframe(){

function cbtEmoChip(e){

  return `<button class="chip emo" data-e="${e}"
    style="${on?`background:${c}; color:#fff`:`background:color-mix(in srgb, ${c} 13%, var(--card)); border-color:color-mix(in srgb, ${c} 40%, transparent)`}"
    onclick="cbtPickEmo('${e}')">${e}</button>`;
}
function cbtStep(){
  switch(cbt.step){
    case 0: return cbtHead("The situation","Just the facts a camera would record — one or two lines.")+
      `<textarea id="cb-sit" rows="3" placeholder='e.g. "The CFO questioned my numbers in the steering committee"'>${esc(cbt.sit)}</textarea>`+cbtNav();
    case 1: return cbtHead("The feeling, and how strong","Pick the closest word — colour is the family. Then rate it right now.")+
      EMOFAM.filter(f=>f.name!=="Calm"&&f.name!=="Joy & energy").map(f=>`
        <div class="tiny" style="margin:10px 2px 6px"><span class="famdot" style="background:${f.color}; display:inline-block; width:9px; height:9px; margin-right:5px"></span>${f.name}</div>
        <div class="chips">${f.list.map(e=>cbtEmoChip(e)).join("")}</div>`).join("")+
      `<div class="row" style="margin-top:16px">
        <input type="range" min="0" max="100" step="5" value="${cbt.before}" oninput="cbt.before=+this.value; document.getElementById('cb-bval').textContent=this.value+'%'">
        <b id="cb-bval" style="width:52px; text-align:right; font-variant-numeric:tabular-nums">${cbt.before}%</b></div>`+cbtNav();
    case 2: return cbtHead("The automatic thought","The sentence your mind produced, verbatim — not the polished version.")+
      `<textarea id="cb-th" rows="3" placeholder='e.g. "Everyone in that room now thinks I can&#39;t be trusted with the numbers"'>${esc(cbt.thought)}</textarea>`+cbtNav("Analyse it");
    case 3: {
      const note=cbt.sugg.length
        ?`<div class="card" style="margin-bottom:10px"><div class="eyebrow" style="color:var(--indigo); margin-bottom:4px">Engine analysis</div>
          <p style="font-size:13.5px; margin:0">Your wording shows the signature of <b>${cbt.sugg.join("</b> and <b>")}</b> — pre-selected below. Adjust freely; you know the thought better than the pattern-matcher.</p></div>`
        :`<div class="hint" style="margin-bottom:10px">No obvious pattern in the wording — pick whichever fits from the inside.</div>`;
      return cbtHead("Spot the distortion","Which thinking patterns is it running?")+note+
        DISTORTIONS.map((d,i)=>{
          const on=cbt.sel.includes(d[0]);
          return `<button class="opt${on?" notbest":""}" id="cb-d-${i}" onclick="cbtTogD(${i})" style="margin-top:7px">
            <b style="font-size:14px">${d[0]}${cbt.sugg.includes(d[0])?" · <span style='color:var(--indigo)'>detected</span>":""}</b>
            <div class="tiny">${d[1]}</div></button>`;
        }).join("")+cbtNav();
    }
    case 4: {
      const qs=cbt.sel.flatMap(d=>SOCRATIC[d]||[]).slice(0,4);
      return cbtHead("Put it on trial","Answer the engine's questions in your head, then log the evidence.")+
        (qs.length?`<div class="card" style="margin-bottom:12px">${qs.map(q=>`<div class="take"><b>?</b><span style="font-size:14px">${q}</span></div>`).join("")}</div>`:"")+
        `<label class="q" style="margin-top:4px">Evidence FOR the thought</label>
        <div class="hint">Facts only — what a prosecutor could actually prove.</div>
        <textarea id="cb-for" rows="2">${esc(cbt.evFor)}</textarea>
        <label class="q">Evidence AGAINST it</label>
        <div class="hint">What the thought conveniently ignores.</div>
        <textarea id="cb-ag" rows="2">${esc(cbt.evAg)}</textarea>`+cbtNav();
    }
    case 5: {
      const starters=cbt.sel.filter(d=>STARTERS[d]).slice(0,3);
      return cbtHead("The balanced verdict","Not fake positivity — what a fair-minded colleague who saw all the evidence would conclude.")+
        (starters.length?`<div class="hint" style="margin-bottom:6px">Tap a starter to begin from it:</div>
        <div class="chips" style="margin-bottom:10px">${starters.map(d=>`<button class="chip" onclick="cbtStarter('${d}')">${STARTERS[d].slice(0,28)}…</button>`).join("")}</div>`:"")+
        `<textarea id="cb-bal" rows="4">${esc(cbt.bal)}</textarea>`+cbtNav();
    }
    case 6: return cbtHead("Re-rate the feeling","Same feeling, now — after the trial. Lower is the win; zero isn't the goal.")+
      `<div class="card" style="margin-bottom:12px">
        <div class="tiny" style="margin-bottom:4px">Your balanced verdict</div>
        <p class="quote" style="margin:0">“${esc(cbt.bal)}”</p></div>
      <div class="row">
        <input type="range" min="0" max="100" step="5" value="${cbt.after}" oninput="cbt.after=+this.value; document.getElementById('cb-aval').textContent=this.value+'%'">
        <b id="cb-aval" style="width:52px; text-align:right; font-variant-numeric:tabular-nums">${cbt.after}%</b></div>`+
      cbtNav("Close the record");
  }
}
function cbtRefresh(){ document.getElementById("cbt-body").innerHTML=cbtStep(); window.scrollTo(0,0); }
function cbtCollect(){
  const g=id=>{ const el=document.getElementById(id); return el?el.value.trim():null; };
  if(cbt.step===0){ const v=g("cb-sit"); if(v!==null) cbt.sit=v; }
  if(cbt.step===2){ const v=g("cb-th"); if(v!==null) cbt.thought=v; }
  if(cbt.step===4){ const f=g("cb-for"); if(f!==null) cbt.evFor=f; const a=g("cb-ag"); if(a!==null) cbt.evAg=a; }
  if(cbt.step===5){ const v=g("cb-bal"); if(v!==null) cbt.bal=v; }
}
function cbtNext(){
  cbtCollect();
  if(cbt.step===2){
    if(!cbt.thought) return;
    cbt.sugg=detectDistortions(cbt.thought);
    cbt.sugg.forEach(d=>{ if(!cbt.sel.includes(d)) cbt.sel.push(d); });
  }
  if(cbt.step===5&&!cbt.bal) return;
  if(cbt.step===6){ cbtSave(); return; }
  cbt.step++;
  cbtRefresh();
}
function cbtBack(){ cbtCollect(); if(cbt.step>0){ cbt.step--; cbtRefresh(); } }
function cbtPickEmo(e){ cbt.emo=cbt.emo===e?null:e; cbtRefresh(); }
function cbtTogD(i){
  const d=DISTORTIONS[i][0];
  const j=cbt.sel.indexOf(d);
  if(j>=0) cbt.sel.splice(j,1); else cbt.sel.push(d);
  cbtRefresh();
}
function cbtStarter(d){
  const el=document.getElementById("cb-bal");
  if(el){ el.value=STARTERS[d]+" "+el.value; el.focus(); }
}
function cbtSave(){
  const pats=cbt.sel.join(", ");
  S.journal.unshift({date:new Date().toISOString(),kind:"Reframe",title:"Thought record",
    meta:{emo:cbt.emo,before:cbt.before,after:cbt.after,patterns:[...cbt.sel]},

Feeling: ${cbt.emo||"—"} ${cbt.before}% → ${cbt.after}%`

Thought: ${cbt.thought}

For: ${cbt.evFor||"—"}
