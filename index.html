<style>
:root{
  --teal:#256a7a; --teal-soft:#5a98a3; --ember:#c05f41; --indigo:#4a5185;
  --moss:#5f7d59; --plum:#815a7a;
  --bg:#eae2d0; --card:#f6f1e4; --ink:#2a2f2c; --muted:#6d7268; --faint:#9c9c8d;
  --chip:#e0d7c1; --line:#d9cfb8; --shadow:0 4px 14px rgba(70,60,40,.07);
  --steel:#54748c; --rose:#96555f;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141a1c; --card:#1f2629; --ink:#e8e6e0; --muted:#9aa5a3; --faint:#6b7674;
    --chip:#2a3235; --line:#2b3336; --shadow:none;
    --teal:#5a98a3; --ember:#d07a5e; --moss:#83a07c; --indigo:#8b93c4; --plum:#a97f9f;
    --steel:#93aec2; --rose:#c78e97;
  }
}
:root[data-theme="light"]{
  --teal:#256a7a; --teal-soft:#5a98a3; --ember:#c05f41; --indigo:#4a5185;
  --moss:#5f7d59; --plum:#815a7a;
  --bg:#eae2d0; --card:#f6f1e4; --ink:#2a2f2c; --muted:#6d7268; --faint:#9c9c8d;
  --chip:#e0d7c1; --line:#d9cfb8; --shadow:0 4px 14px rgba(70,60,40,.07);
  --steel:#54748c; --rose:#96555f;
}
:root[data-theme="dark"]{
  --bg:#141a1c; --card:#1f2629; --ink:#e8e6e0; --muted:#9aa5a3; --faint:#6b7674;
  --chip:#2a3235; --line:#2b3336; --shadow:none;
  --teal:#5a98a3; --ember:#d07a5e; --moss:#83a07c; --indigo:#8b93c4; --plum:#a97f9f;
  --steel:#93aec2; --rose:#c78e97;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
}
#app{max-width:520px; margin:0 auto; padding:18px 16px calc(86px + env(safe-area-inset-bottom));}
h1,h2,h3,.serif{font-family:ui-serif,Georgia,"Times New Roman",serif; letter-spacing:.1px;}
h1{font-size:26px; margin:8px 2px 16px; font-weight:650;}
h2{font-size:19px; margin:0 0 6px; font-weight:650;}
h3{font-size:16.5px; margin:0 0 6px; font-weight:650;}
.sub{color:var(--muted); font-size:14px;}
.tiny{color:var(--faint); font-size:12px;}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; color:var(--muted);}
.card{
  background:var(--card); border-radius:18px; padding:16px 17px; margin-bottom:12px;
  box-shadow:var(--shadow); border:1px solid var(--line);
}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit; padding:0;}
.btn{
  display:block; width:100%; text-align:center; padding:13px 16px; border-radius:14px;
  background:var(--teal); color:#fff; font-weight:600; font-size:16px;
}
.btn.ghost{background:var(--chip); color:var(--ink);}
.btn.ember{background:var(--ember);} .btn.plum{background:var(--plum);} .btn.moss{background:var(--moss);} .btn.indigo{background:var(--indigo);} .btn.steel{background:var(--steel);}
.btn:disabled{opacity:.4;}
.row{display:flex; align-items:center; gap:13px;}
.row .grow{flex:1; min-width:0;}
.chev{color:var(--faint); font-size:18px;}
.tap{width:100%; text-align:left;}
.hero{
  background:linear-gradient(135deg,var(--teal),var(--indigo));
  color:#fff; border:none;
}
.hero .sub{color:rgba(255,255,255,.85);}
.icon{font-size:24px; width:36px; text-align:center; flex:none;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  padding:7px 14px; border-radius:999px; background:var(--chip); font-size:14px; color:var(--ink);
}
.chip.on{background:var(--teal); color:#fff;}
textarea,input[type=text]{
  width:100%; font:inherit; color:var(--ink); background:var(--chip);
  border:none; border-radius:12px; padding:11px 12px; resize:none; outline:none;
}
input[type=range]{width:100%; accent-color:var(--teal);}
.quote{font-family:ui-serif,Georgia,serif; font-style:italic; font-size:15.5px;}
.tools3{display:flex; gap:10px;}
.tools3 .card{flex:1; text-align:center; margin:0; padding:14px 6px;}
.overlay{
  position:fixed; inset:0; background:var(--bg); z-index:40; overflow-y:auto;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));
}
.overlay .inner{max-width:520px; margin:0 auto;}
.sheetbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.sheetbar button{color:var(--teal); font-weight:600; font-size:16px; padding:6px 2px;}
.center{text-align:center;}
.bigring{position:relative; width:150px; height:150px; margin:18px auto;}
.bigring svg{transform:rotate(-90deg);}
.bigring .num{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:42px; font-weight:300; font-variant-numeric:tabular-nums;
}
.breath-wrap{height:300px; display:flex; align-items:center; justify-content:center;}
#borb{
  width:230px; height:230px; border-radius:50%;
  background:radial-gradient(circle at 42% 38%, var(--teal-soft,#5a98a3), var(--teal));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:ui-serif,Georgia,serif; font-size:19px;
  transform:scale(.55); transition:transform 4s ease-in-out;
}
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--card); border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
}
.tabbar .inner{max-width:520px; margin:0 auto; display:flex;}
.tabbar button{flex:1; text-align:center; color:var(--faint); font-size:11px; font-weight:600;}
.tabbar button.on{color:var(--teal);}
.tabbar .ticon{display:block; margin:0 auto 3px;}
.tabbar svg{width:23px; height:23px; display:block; margin:0 auto 3px;}
.opt{
  width:100%; text-align:left; padding:11px 12px; border-radius:12px; background:var(--chip);
  margin-top:8px; font-size:14.5px; line-height:1.45;
}
.opt.best{background:color-mix(in srgb, var(--moss) 15%, var(--card)); outline:1.5px solid var(--moss);}
.opt.notbest{background:color-mix(in srgb, var(--ember) 13%, var(--card)); outline:1.5px solid var(--ember);}
.take{display:flex; gap:8px; margin:6px 0; font-size:14.5px;}
.take b{color:var(--teal);}
.badgegrid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
.badge{
  border-radius:13px; padding:10px 7px; text-align:center; background:var(--chip); opacity:.45;
}
.badge.earned{opacity:1; background:color-mix(in srgb, var(--moss) 12%, var(--card)); outline:1px solid color-mix(in srgb, var(--moss) 40%, transparent);}
.badge .bi{font-size:21px;}
.badge .bt{font-size:11.5px; font-weight:650; margin-top:3px;}
.badge .bd{font-size:9.5px; color:var(--muted); margin-top:1px;}
.stats{display:flex; gap:10px; margin-bottom:12px;}
.stats .card{flex:1; margin:0; text-align:center; padding:13px 4px;}
.stats .v{font-size:23px; font-weight:650; font-variant-numeric:tabular-nums;}
.jentry{padding:10px 0; border-bottom:1px solid var(--line); font-size:14.5px; white-space:pre-line;}
.jentry:last-child{border-bottom:none;}
.back{color:var(--teal); font-weight:600; font-size:15.5px; padding:4px 2px; margin-bottom:10px; display:inline-block;}
.lessonbody{font-size:15.5px; line-height:1.62; color:var(--ink);}
.moodface{font-size:38px; width:56px; text-align:center; flex:none;}
.progress-ring{flex:none;}
.fade{animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important;}
}
label.q{display:block; font-weight:650; font-family:ui-serif,Georgia,serif; margin:16px 0 4px; font-size:16px;}
.hint{font-size:12.5px; color:var(--muted); margin-bottom:6px;}
.grid2{display:flex; flex-direction:column; gap:0;}
svg.ring circle{fill:none;}
</style>

<script>
/* ================= Data ================= */
const QUOTES=[
["Samatvam yoga ucyate — equanimity is excellence in action.","Bhagavad Gita 2.48"],
["You have power over your mind, not outside events. Realise this, and you will find strength.","Marcus Aurelius"],
["Between stimulus and response there is a space. In that space is our power to choose.","Viktor Frankl"],
["The quieter you become, the more you are able to hear.","Rumi"],
["Feelings come and go like clouds in a windy sky. Conscious breathing is my anchor.","Thich Nhat Hanh"],
["He who angers you conquers you.","Elizabeth Kenny"],
["Nothing gives one person so much advantage over another as to remain always cool and unruffled.","Thomas Jefferson"],
["You can't stop the waves, but you can learn to surf.","Jon Kabat-Zinn"],
["The obstacle is the way.","Marcus Aurelius"],
["Slow is smooth, smooth is fast.","Old operator's maxim"]];

const EMOTIONS=["Calm","Content","Energised","Anxious","Frustrated","Angry","Helpless","Overwhelmed","Drained","Low"];
const DIFFICULT=new Set(["Anxious","Frustrated","Angry","Helpless","Overwhelmed","Drained","Low"]);
const CONTEXTS=["Deadline","Meetings","My team","Senior stakeholders","Deal pressure","Workload","Family","Social life","Sleep & health","Something else"];
const MOODS=["","Rough","Strained","Steady","Good","Great"];
const PROFILE_OPTS=["Corporate finance","I manage a team","Long hours","High-stakes meetings","Family is complicated","Far from home"];
const MOODFACE=["","🌧️","☁️","⛅","🌤️","☀️"];

const COURSES=[
{id:"foundations",title:"Foundations",subtitle:"Learn to read your own weather",icon:"🌤️",tint:"var(--teal)",lessons:[
 {id:"f1",title:"The sharpest people feel more, not less",min:3,sections:[
  ["The myth of the ice-cold operator",`Finance culture prizes the unflappable. But "unflappable" done badly is just suppression — and suppression is expensive. Studies of professionals under pressure keep finding the same thing: the ones who ignore their emotions don't decide better; they blow up more expensively. The best performers feel everything and use it as information.`],
  ["Emotions are data, not noise",`Every emotion is your brain's fast summary of a situation: anger flags a violated boundary, anxiety flags an unpriced risk, helplessness flags a control problem. You already read a boardroom for signal. This course teaches you to read yourself the same way — quickly, without drama, and then decide what to do.`],
  ["What this app will and won't do",`Samatva won't make you feel nothing. It will shorten the time between feeling something and understanding it, and widen the gap between feeling and reacting. That gap — Viktor Frankl's "space between stimulus and response" — is where composure lives.`]],
  take:["Suppressing emotion degrades judgement; reading it sharpens judgement.","Each emotion carries a specific message about the situation.","The goal is a wider gap between feeling and reacting — not feeling less."],
  reflect:"Think of the last time you 'kept it together' at work but paid for it later. What did keeping it together actually cost?",
  scenario:{prompt:`It's 7pm. A deal document comes back from legal riddled with errors and the client call is at 8am. You feel heat rising in your chest. What's the most emotionally intelligent first move?`,options:[
   {t:"Push the feeling aside — no time for it, just fix the document.",best:false,fb:"Suppression works for about an hour, then leaks out — usually at whoever messages you next. The feeling doesn't need an hour; it needs ten seconds of acknowledgement."},
   {t:"Notice: 'That's anger. It's telling me a standard was violated and I'm time-pressed.' Then plan.",best:true,fb:"Exactly. Naming it takes ten seconds, drops its intensity, and turns it into information: the anger is about a standard and a deadline — both of which are solvable problems."},
   {t:"Fire off a sharp email to legal so they know this isn't acceptable.",best:false,fb:"Maybe deserved — but sent at peak anger it will be 20% too hot, and you'll spend tomorrow managing the fallout instead of the client."}]}},
 {id:"f2",title:"Name it to tame it",min:3,sections:[
  ["The label lowers the volume",`Neuroscience calls it affect labelling: putting a feeling into words measurably reduces amygdala activity. Saying — even silently — "this is frustration" moves the experience from the alarm system to the part of the brain that can actually do something about it. It feels almost too simple. It works anyway.`],
  ["Get more precise than 'stressed'",`"Stressed" is like flagging a variance without naming the driver — true, but useless for action. Is it frustration (blocked goal)? Anxiety (uncertain threat)? Helplessness (no control)? Resentment (unfair load)? Each has a different fix. Psychologists call this emotional granularity, and people who have it recover faster and make better decisions under pressure.`],
  ["The one-line check-in",`This is why Samatva's check-in takes fifteen seconds, not five minutes. One honest label, logged. Over weeks, the pattern becomes visible — which meetings, which hours, which people. You can't manage what you never name.`]],
  take:["Naming an emotion reduces its grip — measurably.","Precision matters: frustration, anxiety, and helplessness need different responses.","Fifteen honest seconds a day builds a map of your patterns."],
  reflect:"What word do you reach for when someone asks how you are? What's the more precise word underneath it today?"},
 {id:"f3",title:"The 90-second wave",min:3,sections:[
  ["Chemistry has a half-life",`When something triggers you, a chemical surge — adrenaline, cortisol — floods the body. Here's the part nobody tells you: physiologically, that surge washes through in about 90 seconds. If you're still furious ten minutes later, it's because your thoughts keep re-triggering the wave — replaying the comment, drafting the comeback.`],
  ["Ride it, don't feed it",`The skill is to let the first wave pass without adding fuel. Feel the heat, the tight jaw, the fast pulse — and just observe it like weather crossing a window, without opening the mental argument. Ninety seconds of watching beats thirty minutes of stewing.`],
  ["Where the Reset button comes in",`Samatva's Reset is built around this: when something hits, open it, and it walks you through the 90 seconds — breath, body, label — so the wave passes through you instead of into your next meeting.`]],
  take:["The chemical part of an emotion lasts about 90 seconds.","Rumination — replaying and rehearsing — is what keeps it alive.","Ride the first wave without feeding it; then decide."],
  reflect:"When you stay angry for hours, what's the loop your mind replays? What would it be like to let the first wave pass just once?"},
 {id:"f4",title:"Your body is the dashboard",min:3,sections:[
  ["The body knows first",`By the time you consciously think "I'm annoyed," your body has known for minutes: shoulders creeping toward ears, jaw tight, breath gone shallow, that specific heat behind the sternum. Interoception — reading these internal signals — is trainable, and it's your earliest warning system.`],
  ["Find your tell",`Every negotiator has a tell; so does every temper. Maybe yours is rereading the same email three times, typing harder, or going very quiet in meetings. Identify your two or three reliable tells and they become tripwires — catch the emotion at 3/10 instead of 8/10, when it's still cheap to handle.`],
  ["The desk scan",`Three times a day — coffee, lunch, the 4pm slump — run a ten-second scan: jaw, shoulders, breath, stomach. Release what's held. You're not meditating; you're checking the dashboard the way you'd glance at the numbers before a call.`]],
  take:["Your body registers emotion before your conscious mind does.","Know your two or three physical 'tells' and treat them as tripwires.","A ten-second body scan, three times a day, catches trouble early."],
  reflect:"Where does pressure show up first in your body? Jaw, shoulders, chest, stomach — what's your tell?"}]},
{id:"heat",title:"Heat",subtitle:"Frustration and anger, handled",icon:"🔥",tint:"var(--ember)",lessons:[
 {id:"h1",title:"What anger is actually for",min:3,sections:[
  ["Anger is a boundary alarm",`Anger fires when something you value is violated — your time, your standards, your team, your sense of fairness. That makes it useful: it tells you exactly what you care about. The problem is never the signal; it's the untranslated signal, delivered raw to a colleague at volume.`],
  ["Frustration is blocked progress",`Frustration is anger's cousin: a goal you're driving toward, blocked — by a slow approval chain, a flaky system, a person who won't decide. In a demanding job, frustration is structural, not personal. Expecting a frictionless day in corporate finance is like expecting a quarter close with no late adjustments. The question isn't how to never feel it; it's what to do in the first minute.`],
  ["Translate before transmitting",`The practice: when heat rises, ask "what boundary or goal is this about?" "I'm furious at legal" translates to "I care about quality and I'm time-pressed." That sentence you can say out loud in a meeting. The untranslated version you can't.`]],
  take:["Anger marks a violated boundary; frustration marks a blocked goal.","The signal is useful; the raw transmission is what causes damage.","Ask: what is this heat actually about? Then say that instead."],
  reflect:"What do your last three flashes of anger have in common? What value of yours were they defending?"},
 {id:"h2",title:"The hijack",min:4,sections:[
  ["Why smart people say dumb things at 9pm",`Under acute stress, the amygdala can effectively hijack the prefrontal cortex — the part of you that models consequences, reads the room, and remembers that the person opposite you controls your bonus. In hijack mode your IQ is temporarily unavailable. Everyone's is. The skill isn't preventing the hijack; it's recognising it and refusing to make decisions inside it.`],
  ["Your vulnerability multipliers",`The hijack triggers far more easily when you're depleted. The checklist is HALT: Hungry, Angry (already), Lonely, Tired. On a 14-hour day you may be all four. That snappish reply at 10pm isn't your personality — it's your physiology. Which means the fix is often boring: eat, walk, sleep, call someone who knew you before the job.`],
  ["Never trade during a hijack",`Make one rule and keep it absolutely: no irreversible action while flooded. No sent email, no verdict on a direct report, no 'quick word' with a stakeholder. The queue can hold for ten minutes. Nothing written in the flood reads well in the morning.`]],
  take:["Acute stress temporarily disconnects your best thinking. For everyone.","HALT — hungry, angry, lonely, tired — makes hijacks far more likely.","One iron rule: no irreversible actions while flooded."],
  reflect:"What time of day, and in what state, do your worst moments happen? What does that tell you about HALT?",
  scenario:{prompt:`A managing director dismisses your team's analysis in front of everyone with a wave of the hand: 'This is half-baked.' You feel the flood — hot face, fast heart. The meeting is still going. What now?`,options:[
   {t:"Defend the work immediately and firmly — silence looks like agreement.",best:false,fb:"Anything said in the first 30 seconds of a flood comes out sharper than intended, and now it's you versus an MD in public. The work can be defended better in five minutes than in five seconds."},
   {t:"Breathe out slowly, note 'that's anger — my team was attacked', and say: 'I'd push back on half-baked — let me walk you through the assumptions after this.'",best:true,fb:"You bought your prefrontal cortex three seconds, protected your team on the record, and moved the fight to ground where evidence — not volume — decides it."},
   {t:"Say nothing, then vent to your team afterwards about how impossible the MD is.",best:false,fb:"Your team watched the work get dismissed and then watched you absorb it. Venting downward transfers your flood to people who can do even less about it than you."}]}},
 {id:"h3",title:"The STOP protocol",min:3,sections:[
  ["S — Stop. T — Take a breath.",`When you notice the tell, stop — mid-sentence if needed; "give me a second" is a complete sentence. Then one slow breath with a long exhale. The extended exhale activates the parasympathetic brake directly; it's the fastest legal intervention on your own nervous system.`],
  ["O — Observe.",`Three quick observations: What's in my body? (heat, tight chest.) What's the emotion? (frustration, edging to anger.) What's the story I'm telling? ("they don't respect my time.") That last one matters — the story is usually the accelerant, and it's usually only one of several possible readings.`],
  ["P — Proceed on purpose.",`Now choose: address it, park it, or drop it. All three are legitimate. What was never on the menu was the auto-reply your flooded brain drafted at second zero. STOP takes about fifteen seconds and works in an open-plan office, on a call, or mid-meeting. Practise it on small annoyances — the delayed train, the double-booked room — so it's there for the big ones.`]],
  take:["Stop, Take a breath, Observe, Proceed — about fifteen seconds.","The long exhale is the fastest way to slow your own system.","The story you're telling is the accelerant. Question it first."],
  reflect:"What small daily annoyance could you use as STOP practice this week?"},
 {id:"h4",title:"Discharge, don't suppress — and don't 'vent'",min:3,sections:[
  ["The venting myth",`Punching pillows and ranting to colleagues feels productive but research is blunt: rehearsing anger deepens it. Each retelling re-runs the wave and carves the groove deeper. Venting isn't release — it's practice.`],
  ["What actually discharges the charge",`The stress chemicals want physical completion, not narrative. A fast walk around the block, two flights of stairs, twenty push-ups, a hard gym session after work — movement metabolises the cortisol. Cold water on the wrists and face works surprisingly well between meetings. Write the furious version down once — then close the notebook; that's discharge. Reading it to three people is venting.`],
  ["The email rule",`Angry email? Write it with the To: field empty. Say everything. Then leave it in drafts until after your next meal. Nine times out of ten you'll send a shorter, colder, far more effective version — or nothing, which is sometimes the strongest move available.`]],
  take:["Venting rehearses anger; it doesn't release it.","Movement, cold water, and one private write-out actually discharge it.","Angry emails: empty To: field, and nothing sends before your next meal."],
  reflect:"What's your current discharge method — and is it discharge, or is it rehearsal?"},
 {id:"h5",title:"Clean anger",min:4,sections:[
  ["Composed doesn't mean silent",`There's a failure mode on the other side of shouting: swallowing everything to seem professional, then leaking it as sarcasm, cc'd escalations, or sudden coldness. If you grew up where open disagreement with seniors felt disrespectful, this route is extra tempting. But unexpressed anger doesn't disappear — it compounds, and it collects interest.`],
  ["The clean formula",`Clean anger is specific, unheated, and aimed at behaviour, not character: "When the deck came back at 11pm with the numbers unchecked → I was frustrated → because I care that we're accurate in front of the client → next time, flag it by 6 if you're stuck." Situation, feeling, value, request. No verdicts on anyone's competence or character.`],
  ["Deliver it cool",`Timing is the multiplier: after the wave has passed, in private, once. Said calmly within a day, that script builds more respect than either the explosion or the swallow. People trust leaders whose displeasure is precise, predictable, and proportionate.`]],
  take:["Swallowed anger leaks — as sarcasm, coldness, or escalation.","Clean formula: situation → feeling → value → request.","Deliver after the wave, in private, once."],
  reflect:"Is there a conversation you've been swallowing? What would the clean, four-part version sound like?",
  scenario:{prompt:`A peer keeps committing your team to deadlines in meetings you're not in. It's the third time. You're past annoyed. What's the clean-anger move?`,options:[
   {t:"Mention it lightly with a laugh so it doesn't get awkward: 'Ha, stop selling my team's weekends!'",best:false,fb:"Humour-wrapped anger is still anger — but now it's deniable and easy to ignore. Third-time patterns deserve a direct sentence, not a joke."},
   {t:"Privately: 'When my team was committed to Friday without me in the room — third time now — I was genuinely frustrated. I need to be in the loop before commitments. Can we agree on that?'",best:true,fb:"Specific, factual, states the feeling once without heat, ends with a clear request. Hard to argue with, easy to respect."},
   {t:"Escalate to your shared boss with a documented timeline of all three incidents.",best:false,fb:"Escalating before a direct conversation reads as political warfare and burns the relationship. Escalation is the second move if the direct request fails — not the first."}]}}]},
{id:"ground",title:"Ground",subtitle:"From helplessness to agency",icon:"⛰️",tint:"var(--moss)",lessons:[
 {id:"g1",title:"The helplessness trap",min:3,sections:[
  ["Where helplessness comes from",`Helplessness is the feeling that outcomes are disconnected from effort. Corporate finance manufactures it in bulk: deals die for reasons that have nothing to do with your work; decisions land from three levels up; a reorg redraws your world overnight. Psychologist Martin Seligman showed that with enough uncontrollable stress, we stop trying even where we do have control. That's the trap — the feeling spreads beyond the facts.`],
  ["The trap generalises; reality doesn't",`One genuinely uncontrollable quarter and the mind whispers that everything is uncontrollable — your hours, your career, your mood. Notice that move. Helplessness is accurate about specific things and almost always wrong as a general theory of your life.`],
  ["The antidote is precision",`The way out isn't positive thinking — it's an audit. What here is actually mine to move? The next lesson gives you the tool. For now, just catch the moment the feeling tries to go from "I can't control this decision" to "I can't control anything."`]],
  take:["Helplessness = the felt disconnect between effort and outcome.","It generalises beyond the facts — one uncontrollable thing colours everything.","The antidote is a precise audit of what is and isn't yours to move."],
  reflect:"Where in your work does helplessness show up most? Is the feeling precise, or has it spread?"},
 {id:"g2",title:"The control map",min:4,sections:[
  ["Three circles",`Take any situation that's eating you and sort every piece into three circles. Control: your preparation, your responses, your hours of sleep, what you escalate, how you communicate. Influence: your boss's view of you, your team's morale, the client's mood, promotion decisions. Concern: the deal environment, reorgs, the economy, other people's temperaments.`],
  ["The energy audit",`Now the uncomfortable question: where does your worry-time actually go? For most people under pressure, 80% of mental energy pools in the Concern circle — precisely where it can achieve nothing. Stoics called this the dichotomy of control; it predates modern psychology by two millennia because it works.`],
  ["Move one ring inward",`The practice: for anything in Concern, find its handle in Influence or Control. Can't control the reorg → can control being visibly excellent and having your CV honest. Can't control the MD's temper → can control your preparation and how you time your asks. Every worry either has a handle you can grip, or it doesn't — in which case it's weather, and you dress for weather; you don't argue with it.`]],
  take:["Sort any mess into Control / Influence / Concern.","Energy pooled in the Concern circle achieves nothing and costs everything.","For each concern, find its handle one ring inward — or accept it as weather."],
  reflect:"Take today's biggest worry. Which circle is it in? What's its handle one ring inward?",
  scenario:{prompt:`Rumours of restructuring are everywhere. Your team keeps asking you what will happen; you don't know, and your own role may be at risk. You notice yourself refreshing news and Slack constantly. Best use of your energy?`,options:[
   {t:"Work your network hard for intel so you're never surprised.",best:false,fb:"Some intel-gathering is reasonable, but rumour-chasing is Concern-circle activity dressed as action — it feeds the anxiety loop and produces mostly noise."},
   {t:"Map it: Control — my performance, my CV, honesty with my team about what I know and don't. Influence — how leadership sees my team's value. Concern — the decision itself. Act on the first two.",best:true,fb:"This is the control map doing its job. Notice it also gives your team something honest and steady to hold onto — which is itself an Influence-circle move."},
   {t:"Reassure the team it will all be fine so morale holds.",best:false,fb:"Promising what you can't control trades this week's comfort for your long-term credibility. 'Here's what I know, here's what I don't, here's what we control' is stronger and still steadying."}]}},
 {id:"g3",title:"Micro-moves",min:3,sections:[
  ["Agency compounds like interest",`Helplessness is broken by evidence, not affirmations. Each small completed action — one email sent, one decision made, one desk cleared — is a data point proving effort still connects to outcome. The size of the move barely matters; the completion does. Psychologists call it mastery experience; the name matters less than the evidence.`],
  ["Shrink until it's doable now",`Overwhelmed by the whole? Shrink the next move until resistance disappears. Not "fix the model" — "open the file." Not "resolve the conflict" — "draft one sentence asking for 15 minutes." The absurdly small first step isn't a trick; it's how stuck systems restart.`],
  ["End the day on a completion",`One habit with outsized returns: never end the workday mid-failure. Close with one small completed thing — a tidy handover note, tomorrow's first task written down, one email cleared. Your brain files the day by its ending. Give it a completion to file.`]],
  take:["Agency is rebuilt by evidence: small, completed actions.","Shrink the next step until the resistance disappears.","End every day on a completion, however small."],
  reflect:"What's one thing you've been circling for days? What's its absurdly small first step?"},
 {id:"g4",title:"Asking for help isn't losing face",min:4,sections:[
  ["The lone-hero tax",`If you were raised to equate self-sufficiency with worth — common where academic and career excellence carried family honour — asking for help can feel like public failure. So the load grows silently until something cracks. But watch actual senior leaders: they ask for help constantly. They just call it 'leveraging resources' and 'aligning stakeholders.'`],
  ["Reframe: asking is an executive skill",`A precise, early ask signals judgement, not weakness: you sized the problem, identified what's missing, and moved before it became expensive. What actually damages reputations is the surprise blow-up in week six that a five-minute conversation in week one would have prevented.`],
  ["Make the ask specific",`Weak: "I'm drowning." Strong: "I need either a day's extension or one analyst for two days — which works better for you?" Specific asks are easy to grant and read as competence. And the same applies off the desk: telling one friend how the quarter actually felt is the personal-life version, and it's just as much a skill.`]],
  take:["Silent overload isn't strength; it's deferred, compounding risk.","Early, precise asks read as judgement — surprise blow-ups read as failure.","Make asks specific and optioned: easy to grant, easy to respect."],
  reflect:"What are you currently carrying alone that a specific, five-minute ask could halve?"}]},
{id:"presence",title:"Presence",subtitle:"Composure as a leadership tool",icon:"🤝",tint:"var(--indigo)",lessons:[
 {id:"p1",title:"Your mood is public infrastructure",min:3,sections:[
  ["Emotional contagion is real and fast",`Humans sync moods automatically — and the syncing runs down the hierarchy far more strongly than up. As the manager, your Tuesday-morning stress becomes your team's Tuesday-morning stress within an hour, without a word said. You stopped having fully private moods the day you got direct reports.`],
  ["They're reading you all day",`Your team studies your face on calls, your punctuation on Slack, the speed of your replies. A terse "fine." from you at 9am can cost a junior analyst a whole anxious morning. This isn't a reason to perform fake positivity — it's a reason to regulate for real, because the returns are multiplied by headcount.`],
  ["Steady is the gift",`The most valuable thing a leader under pressure transmits is regulated presence: urgency without panic, seriousness without doom. "This is hard, and we can handle it" — said with a settled nervous system — is worth more to a team than any pep talk. Every tool in this app quietly serves that sentence.`]],
  take:["Moods propagate down hierarchies fast and silently.","Your team reads your signals all day; small tells have big costs.","Regulated presence — calm urgency — is the leader's real gift."],
  reflect:"What does your team most likely 'catch' from you in a bad week? What would you want them to catch instead?"},
 {id:"p2",title:"Regulate before you respond",min:3,sections:[
  ["Buy three seconds, own the room",`In tense meetings, the person who can insert three seconds between hearing and speaking has an unfair advantage. Tactics that look natural: take a sip of water; write the point down; repeat their statement back — "so your concern is timing" — which both buys time and makes the other person feel heard. Nobody knows you're regulating. That's the point.`],
  ["The question is a fire-break",`When challenged aggressively, a genuine question beats a fast defence: "What would you need to see to be comfortable?" "Which assumption bothers you most?" Questions shift you from defending to examining, drop the temperature, and often reveal the challenge was thinner than it sounded.`],
  ["Call the break",`If a meeting is genuinely running hot, naming it is senior behaviour: "Let's take five and come back to this with the numbers." Composure isn't never feeling heat — it's being the person in the room who notices the temperature and has the standing to adjust it.`]],
  take:["Three seconds of pause is an advantage nobody can see.","A genuine question de-escalates faster than a fast defence.","Naming the temperature and calling a break is senior behaviour."],
  reflect:"In your last heated meeting, what would three extra seconds have changed?"},
 {id:"p3",title:"Feedback without heat",min:4,sections:[
  ["Anger corrupts the message",`Feedback delivered hot achieves the opposite of its intent: the recipient's threat response spikes, and all processing goes to survival, not learning. They'll remember your tone for years and the content for minutes. If you're still charged, you're not ready to deliver — that's what the Reset is for.`],
  ["SBI: situation, behaviour, impact",`The clean structure: Situation ("in Thursday's client call"), Behaviour ("the sensitivity table had last quarter's rates"), Impact ("the client caught it, and it dented our credibility in the room"). No character verdicts — not "careless", not "sloppy". Behaviour is fixable; character accusations just get defended.`],
  ["Then close the loop forward",`End with the future, jointly owned: "What would make sure the final numbers get a second pass?" People rise to being treated as the solution. And deliver praise with the same SBI precision — specific praise is fuel; vague praise is noise.`]],
  take:["Hot delivery triggers defence, not learning.","SBI: specific situation, observable behaviour, real impact — no character verdicts.","Close forward: make them co-owner of the fix. Praise with the same precision."],
  reflect:"Think of feedback you need to give. Draft it silently as SBI. What changed from the version in your head?",
  scenario:{prompt:`Your strongest analyst has been quietly missing internal deadlines for three weeks. Yesterday it caused you to look unprepared in front of your MD. You're annoyed and disappointed. How do you open the conversation?`,options:[
   {t:"'You're my best analyst, but lately you're letting me down and it made me look bad yesterday.'",best:false,fb:"'Letting me down' is a character verdict wearing feedback's clothes, and leading with your image makes it about you. You'll get an apology and a defensive shell — not information or change."},
   {t:"'Over the last three weeks the Tuesday cuts have landed late, and yesterday it left me answering the MD without the numbers. That's unlike you — what's going on?'",best:true,fb:"Specific situation and behaviour, honest impact, and then — crucially — a genuine question. Three weeks of uncharacteristic slipping usually has a cause worth knowing: burnout, a home situation, a hidden blocker."},
   {t:"Say nothing yet — they're your best performer and you don't want to demotivate them. Watch another two weeks.",best:false,fb:"Three weeks of pattern plus a real impact is past the watching stage. Silence now means the eventual conversation happens at week eight, angrier, with more damage banked — and they'd have wanted to know sooner."}]}},
 {id:"p4",title:"Pressure from above",min:3,sections:[
  ["You are the transformer, not the wire",`A manager's core physics problem: pressure arrives from above at high voltage, and your job is to step it down — pass through the urgency and the facts, filter out the panic and the heat. Leaders who forward pressure raw ('the MD is furious, everything by Monday') get burnt-out teams. Leaders who absorb it silently get ulcers. Transform it: "Priorities changed above us. Here's what actually needs to move, in what order."`],
  ["Manage up with the same EQ",`Your seniors are also stressed humans with amygdalas. Time your asks after their storms, not during. Bring problems with options attached, never bare. And when a senior is heated at you, remember the contagion lesson in reverse: their heat is usually about their pressure, not your worth. You can decline to absorb it personally while still acting on the content.`],
  ["Protect the boundary that protects the team",`Sometimes stepping pressure down means a respectful push-back up: "We can do all three by Friday at draft quality, or the top two properly — which serves you better?" That sentence, delivered calmly, is what senior people themselves do. It's also how they spot who's ready for the next level.`]],
  take:["Step pressure down: pass urgency and facts, filter panic and heat.","Time asks around your seniors' storms; bring options, not bare problems.","A calm, optioned push-back up is a senior move — and gets read as one."],
  reflect:"When pressure last arrived from above, did you pass it through raw, absorb it silently, or transform it?"},
 {id:"p5",title:"Demanding and safe — both",min:3,sections:[
  ["Safety isn't softness",`Psychological safety — the shared belief that speaking up won't be punished — is the strongest known predictor of team performance, including in high-pressure environments. It is not lowered standards. The best teams are both: brutal about the work, safe for the people. Errors get dissected; people don't.`],
  ["Your reaction to bad news sets the price of truth",`Every time someone brings you a mistake or a risk early, your face in that moment sets the price of the next warning. React with heat and the team learns to sit on problems until they explode. React with "good catch — what do we do?" and you've bought yourself an early-warning system money can't buy.`],
  ["Own your misses out loud",`The single fastest safety-builder: admit your own errors plainly. "I called that wrong — here's what I'd do differently." From a leader who also holds a hard standard, that sentence doesn't reduce respect; it multiplies it, and it licenses honesty all the way down.`]],
  take:["High standards and psychological safety aren't opposites — the best teams have both.","Your reaction to bad news sets the price of the next early warning.","Admitting your own misses out loud licenses honesty downward."],
  reflect:"Would your team tell you about a serious mistake on day one, or day ten? What's your evidence?"}]},
{id:"roots",title:"Roots",subtitle:"Identity, family, and a life outside work",icon:"🌳",tint:"var(--plum)",lessons:[
 {id:"r1",title:"Two homes, two codes",min:4,sections:[
  ["The switching load is real",`Growing up South Asian in Singapore, studying and working in Britain — you run several cultural operating systems: one for the boardroom, one for the phone call home, one for old friends, each with different rules about directness, deference, humour, and what feelings are showable. Code-switching is a genuine skill. It also has a genuine metabolic cost that mostly goes unacknowledged.`],
  ["Name the switch, drop the verdict",`The exhaustion after certain dinners or calls isn't a character flaw — it's switching cost. And notice the quiet self-criticism that can ride along: too Asian for one room, too Westernised for another. Third-culture research is clear that the richness runs the other way: you have more registers, more empathy range, more ways to read a room than the single-culture people around you.`],
  ["Keep one no-switch zone",`Protect at least one context where no performance is required — a friend who knew you before the job, a cousin, a group where every version of you is admissible. That's not a luxury. For someone who switches all day, it's infrastructure, and it's worth scheduling like a client meeting.`]],
  take:["Code-switching is a skill with a real, unacknowledged energy cost.","Multiple cultural registers are range, not inauthenticity.","Maintain one no-switch zone and treat it as infrastructure."],
  reflect:"Where in your life do you switch the least? When did you last spend time there?"},
 {id:"r2",title:"The Sunday call",min:4,sections:[
  ["Love arrives as expectation",`In many South Asian families, love is expressed as involvement: questions about promotions, money, marriage, when you're moving closer to home. From eight time zones away, a Sunday call can land as an audit. It helps to translate: behind almost every heavy question is 'we miss you and we want to be sure you're safe.' The delivery is expectation; the payload is love.`],
  ["Guilt is not a verdict",`The pull between the life you're building in London and the one imagined for you back home generates guilt on a schedule. Feel it without obeying it reflexively: guilt is evidence you care about both worlds, not proof you've betrayed either. You can honour your family deeply while making different choices than they'd script — most of them, eventually, want your happiness more than their script.`],
  ["Boundaries, warmly held",`A boundary with family doesn't need to be cold: "I want to tell you about work, and I need us to not do the marriage question every week" — said with warmth — is love plus honesty. Also practical: call when you have energy to be present, not out of scheduled duty while multitasking. One good call beats four resentful ones, and they can feel the difference.

One honest caveat: this lesson assumes love underneath the expectation. If a parent consistently leaves you smaller rather than loved — if the pattern is about their needs, not your safety — the Kin course faces that squarely. This lesson isn't written for that; that one is.`]],
  take:["Heavy questions are usually love in expectation's clothing — translate them.","Guilt means you care about both worlds; it isn't a verdict on your choices.","Warm boundaries and fewer-but-present calls beat dutiful, resentful ones.","If a parent consistently leaves you smaller, not loved — see the Kin course."],
  reflect:"What does your family actually want underneath their most repeated question?"},
 {id:"r3",title:"Friendship on a banker's calendar",min:3,sections:[
  ["Connection is a system, not a mood",`On 70-hour weeks, friendship can't run on spontaneity — there is none. It runs on small deliberate deposits: the two-line message when someone crosses your mind, the voice note on the walk between meetings, the standing monthly dinner that survives because it's standing. Consistency beats grandeur; five minutes reliably beats five hours theoretically.`],
  ["Loneliness is a leadership hazard too",`Managing a team is quietly isolating — you can't fully vent down, and up is politics. Without off-desk relationships, work relationships carry loads they were never built for, and HALT's 'L' becomes chronic. Friendships aren't the reward for surviving the demanding years; they're part of the equipment for surviving them.`],
  ["Show up as a person, not a CV",`One practice: with friends, lead with how things actually are, not the highlight reel. 'Honestly, brutal quarter, I'm tired' opens more connection in ten seconds than an hour of polished updates. You already perform all day. Friendship is where you get to stop.`]],
  take:["On demanding hours, friendship runs on small consistent deposits.","Leadership is isolating; off-desk relationships are load-bearing equipment.","Lead with the real state, not the highlight reel."],
  reflect:"Which friendship have you been meaning to tend? What's the two-minute deposit you could make today?"},
 {id:"r4",title:"Rest is a skill",min:3,sections:[
  ["Detachment is what restores",`Recovery research keeps finding the same thing: hours off don't restore you — psychological detachment does. Ten p.m. scrolling with work Slack open is not rest; it's low-grade work with worse posture. A shorter evening with a genuine mental sign-off beats a long one spent half-on.`],
  ["Build a shutdown ritual",`The mind needs a boundary marker. Cal Newport's version: review open loops, write tomorrow's first move, say an explicit 'shutdown complete.' Yours might be the walk from the station, the gym, cooking, ten minutes of breathing in this app. The form matters less than the consistency — a repeated signal that tells your nervous system the desk is closed.`],
  ["Guard one non-negotiable",`You will never find time for rest inside a demanding calendar; you can only defend it. Pick one non-negotiable block a week — the Sunday ride, the Saturday morning that's yours, the evening class — and protect it the way you'd protect a client meeting. Composure on Monday is manufactured on the weekend.`]],
  take:["Restoration requires detachment, not just hours away from the desk.","A consistent shutdown ritual tells your nervous system the day is closed.","Defend one weekly non-negotiable block like a client meeting."],
  reflect:"What could your shutdown ritual be — and what's the one weekly block worth defending?"}]},
{id:"kin",title:"Kin",subtitle:"For the family relationships that hurt",icon:"🪷",tint:"var(--rose)",lessons:[
 {id:"k1",title:"When a parent can't mirror you",min:4,sections:[
  ["Seeing the pattern clearly",`Some parents cannot reliably see their children as separate people. In a narcissistic pattern, conversations orbit back to them; your wins become their trophies or their threats; warmth arrives when you perform and withdraws when you don't; criticism is casual and apology is rare. If that list reads like your calls home, here is the most important sentence in this course: the pattern is about their inner regulation, not your worth.`],
  ["It was never about you",`A parent with a fragile self-image uses the people closest to them — especially their children — to steady it: achievement as supply, image management, control as safety. Understanding this doesn't excuse anything; it explains it. And the explanation matters, because children of such parents grow up assuming the deficit is theirs. It isn't. It never was.`],
  ["You don't need the label to trust your experience",`Whether or not anyone would ever be formally diagnosed with anything, you don't need a clinical word to take your own experience seriously. If interactions with a parent consistently leave you smaller, doubting, or drained — that is data. This course works with the pattern, whatever name it carries, and everything in it holds either way.`]],
  take:["The pattern — conversations orbiting them, conditional warmth, casual criticism — is about their regulation, not your worth.","Explanation is not excuse; but it relocates the deficit where it belongs — not in you.","You don't need a diagnosis to trust what interactions consistently do to you."],
  reflect:"After a typical call with him, what state are you left in? Write it plainly — that's the data this course works with."},
 {id:"k2",title:"You can't win the old game",min:3,sections:[
  ["The validation isn't coming",`The game you grew up inside — achieve enough and the seeing, the pride, will finally arrive — has no winning move, because the goalposts serve his regulation, not your growth. The promotion gets minimised, or annexed ("I taught him everything"). More effort in that game produces more of the same. That's not pessimism; it's the audited accounts of decades.`],
  ["Radical expectation-setting",`Much of the pain isn't the behaviour itself — it's the fresh surprise each time. So stop being surprised. Before the call, say it to yourself: "He will likely turn this to himself. He may diminish it." When it then happens on schedule, it lands as confirmation instead of a wound. This is acceptance, not approval — you're pricing in a known pattern instead of being blindsided by it every Sunday.`],
  ["Redefine the win",`The win stops being "getting him to finally see me" — that outcome sits in his circle, not yours — and becomes "staying myself in his presence": keeping your calm, your boundaries, and your own account of reality intact through one phone call. That win is available every single time, because it depends only on you. It's the control map, applied to the hardest terrain there is.`]],
  take:["The old game — achieve until he sees you — has no winning move; the goalposts serve him.","Expect the pattern out loud to yourself beforehand; predicted pain wounds less.","Redefine the win: not being seen by him, but staying yourself around him."],
  reflect:"What would 'staying myself through one call' concretely look like — what would you not do that you usually do?"},
 {id:"k3",title:"Boundaries he won't respect — that work anyway",min:4,sections:[
  ["A boundary is your action, not his agreement",`With a parent who steamrolls rules, a boundary isn't a request you hope he'll honour — it's a decision about what you will do. "If the conversation turns to demeaning my choices, I'll say I need to go, warmly, and end the call." He doesn't have to agree with it, understand it, or even notice it for it to work. He just has to experience it, consistently, without drama.`],
  ["Ration the supply and the ammunition",`Two practical rules. Share achievements sparingly — handed over, they become his trophies or his comparison material. Share vulnerabilities carefully — they can return later as weapons. This isn't dishonesty; it's giving the relationship only the weight it can actually carry, and saving your full self for the people who've earned it. A narrower channel with less pain beats a wide one that keeps flooding.`],
  ["Don't JADE",`Justify, Argue, Defend, Explain — the four hooks. Every explanation opens a debate you cannot win, because the argument was never about the topic; it's about engagement itself. The alternative is the calm broken record: "That doesn't work for me." "I've decided." No elaboration. Time-box the calls, have a warm exit line ready, and remember: shorter and warmer beats longer and wounded — for both of you.`]],
  take:["Boundaries with him are actions you take, not agreements he honours.","Achievements shared become trophies; vulnerabilities can become ammunition — ration both.","Don't JADE: justify, argue, defend, explain. The broken record, said warmly, ends the old game."],
  reflect:"What's your exit line — the warm, rehearsed sentence that ends a call going bad?",
  scenario:{prompt:`You're promoted to Director. On the Sunday call, your father: "Director? They hand that out to everyone these days. Ravi's son made partner at your age. Anyway — my knee has been terrible and nobody here takes it seriously..." What's the move?`,options:[
   {t:"Walk him through why this promotion actually is a big deal — the competition, the numbers, who else was up for it.",best:false,fb:"That's JADE — justifying to someone whose dismissal wasn't a misunderstanding but a move in the old game. You've handed him the judge's seat again, and the verdict was never going to change."},
   {t:"Evenly: 'I'm pleased with it.' Then: 'How's the knee?' — and decide separately how much of your life this channel gets from now on.",best:true,fb:"You kept the win yours (no appeal filed), declined the comparison bait entirely, and stayed warm without surrendering anything. That's 'staying yourself in his presence' — and notice it cost you two sentences, not an evening of stewing."},
   {t:"Go cold, wrap up the call fast, and resolve to stop telling him anything at all.",best:false,fb:"Understandable — but a reactive exit hands him the wounded-party story, and absolute resolutions made hot rarely hold. The rationing decision is right; make it deliberately, calmly, later — not as a door slam."}]}},
 {id:"k4",title:"The guilt, the grief, and the good life anyway",min:4,sections:[
  ["Guilt is conditioning, not a compass",`In cultures where filial duty is sacred, boundaries with a parent feel like betrayal — the guilt arrives on schedule, heavy and fluent in your mother tongue. But duty was designed as two-way care, not a licence for one person to spend another. You can honour a parent — presence, respect, practical support — without surrendering your inner life to his pattern. The guilt will still fire; it's an old alarm, wired young. Feel it, thank it for its service, and don't obey it.`],
  ["Grieve the father you needed",`Underneath the anger at the father you have is usually grief for the father you needed — the one who would ask about your life and listen to the answer, who could be proud without taking ownership. That grief is real, and it deserves to be felt on purpose rather than managed around forever. Grief felt through becomes peace. Grief avoided becomes bitterness, or the endless exhausting one-more-try.`],
  ["Build the mirrors he couldn't be",`The need he couldn't meet — being seen, delighted in, backed without conditions — doesn't expire. It gets met sideways: chosen family, the friends who knew you before the title, a partner, a mentor, someday perhaps your own children, where the pattern can end with you. And plainly: this exact terrain — adult children of narcissistic parents — is what good therapists are genuinely trained for. Using one isn't weakness; it's the same judgement as bringing in the best advisor for the hardest deal of your life.`]],
  take:["Guilt here is conditioning firing, not a moral verdict — feel it without obeying it.","Grieve the father you needed; felt-through grief becomes peace, avoided grief becomes bitterness.","The unmet need gets met sideways — chosen family, partner, mentor, therapy. It doesn't expire."],
  reflect:"What would you have wanted him to say, just once? Write it — then notice who in your life today could actually say it, and mean it."},
 {id:"k5",title:"Whose voice is your ambition?",min:3,sections:[
  ["Achievement wired to survival",`When a parent's warmth was conditional on performance, ambition gets welded to fear early: succeed and you're safe, slip and you're worthless. That wiring can build an objectively impressive career sitting on top of a miserable nervous system — where every setback feels existential, because once, in a child's economy, it was.`],
  ["Audit the voice",`When your inner critic speaks, listen for the accent. "Not good enough. Embarrassing. Look at what Ravi's son has done." Is that your voice — or his, internalised so long ago it feels like yours? The Steel course taught the critic-to-coach conversion; this adds a prior step: recognising imported material. You are allowed to decline the inheritance.`],
  ["Ambition, re-signed",`The work is not to want less — you're good at what you do and entitled to love it. The work is re-signing the contract: from "achieve so that he finally—" or "achieve or I'm nothing" to "achieve because it's mine: my craft, my team, the life I chose." Same drive, different fuel. The clean fuel burns longer — and it doesn't need his signature.`]],
  take:["Conditional warmth welds ambition to fear; setbacks feel existential because once they were.","Audit the critic's accent — much of it is his voice, internalised. Decline the inheritance.","Re-sign the contract: same ambition, your reasons, no counter-signature required."],
  reflect:"Finish both sentences honestly: 'I achieve so that he…' and 'I achieve because I…' — which one was driving this week?"}]},
{id:"steel",title:"Steel",subtitle:"Endurance for the long game",icon:"🛡️",tint:"var(--steel)",lessons:[
 {id:"st1",title:"Stress is a cycle, not a state",min:3,sections:[
  ["The load that never unloads",`Biologists call it allostatic load: stress chemistry that never fully clears because the next trigger arrives before the last one settles. On finance hours, your baseline is already elevated — which means recovery can't be left to chance. Performance under chronic load decays slowly, then suddenly; the people who last are the ones who unload deliberately.`],
  ["Complete the cycle",`Here's the catch: the stressor ending doesn't end the stress. Sending the email closes the task, but the adrenaline is still in your bloodstream, waiting for a physical full stop. The body needs its own signal: movement, a long exhale pattern, warmth, laughter, real conversation. That's why you can win the day and still lie awake at 1am — the cycle was never completed.`],
  ["Train recovery like a skill",`Elite athletes periodise; elite teams should too. Oscillation beats grinding: 90 focused minutes, then a genuine 5 — stand, walk, look out a window, no feeds. A completed stress cycle at day's end (gym, walk home, breathing) isn't self-care garnish; it's what keeps next Tuesday's judgement sharp.`]],
  take:["Chronic stress accumulates as allostatic load — it must be actively cleared.","The task ending doesn't end the stress; the body needs a physical full stop.","Oscillate: hard focus, real breaks, and a deliberate cycle-completion daily."],
  reflect:"What actually completes the cycle for you — moves the stress out of your body, not just off your screen?"},
 {id:"st2",title:"Sleep is a market edge",min:3,sections:[
  ["The amygdala on no sleep",`Sleep-deprived brains show roughly 60% more amygdala reactivity to negative stimuli. Translation: after one bad night, the same email reads as more hostile, the same setback as more catastrophic, the same colleague as more infuriating. Emotional intelligence degrades before analytical intelligence does — you'll still build the model fine; you'll just misread the room.`],
  ["When late nights are the job",`Some weeks the hours are simply the hours. Be strategic rather than heroic: protect the night before your highest-stakes day the way you'd protect the meeting itself; bank recovery immediately after a crunch instead of 'powering through' the aftermath; and treat a 20-minute afternoon nap as an instrument, not an indulgence.`],
  ["The wind-down is programmable",`You can't command sleep, but you can engineer its runway: a caffeine curfew ten hours before bed, screens off the last thirty minutes, the 4-7-8 pattern in this app, the Decompress ritual to close open loops. Consistency beats perfection — the nervous system learns the runway and starts descending on its own.`]],
  take:["Sleep loss inflames emotional reactivity long before it dents analysis.","Protect sleep around your highest-stakes moments; bank recovery after crunches.","Build a consistent runway: caffeine curfew, screens off, 4-7-8, decompress."],
  reflect:"Which reading of a situation did you get wrong recently that better sleep might have changed?"},
 {id:"st3",title:"The inner critic",min:4,sections:[
  ["The voice that thinks it's helping",`Somewhere along the way — school league tables, family pride, competitive desks — a voice moved in that treats contempt as motivation: "not good enough, should be further, everyone can see it." It claims to protect your standards. The research says otherwise: harsh self-attack raises fear and hiding; self-compassion raises accountability and persistence. The critic isn't your standards — it's your standards plus cruelty, and the cruelty adds nothing.`],
  ["Would you say it to your analyst?",`Run the double-standard test. Your best analyst misses a deadline; do you tell them they're a fraud who never belonged? Never — you'd name the miss, find the cause, set the fix. You already know how to coach excellently. The skill is turning that coaching voice on yourself.`],
  ["From critic to coach",`The conversion is mechanical: take the critic's sentence and restate it as specific, behavioural, forward-looking. "You embarrassed yourself in that meeting" becomes "I lost the thread when challenged on assumptions — next time I'll pre-write the three hardest questions." Same standard. Better fuel. This is also what the Self-criticism Reset walks you through in the moment.`]],
  take:["Self-attack raises fear and hiding; self-coaching raises accountability.","The double-standard test: would you say it, in that tone, to your best analyst?","Convert critic to coach: specific, behavioural, forward — same standard, zero contempt."],
  reflect:"What's your critic's favourite sentence? Write its coach's-voice translation.",
  scenario:{prompt:`You misread what a client wanted and the deck landed flat. It's 11pm and the voice starts: "You're a fraud. This level was a mistake. Everyone in that room saw it." What do you do with that?`,options:[
   {t:"Agree with it and channel the sting — fear keeps you sharp.",best:false,fb:"Fear fuel burns fast and dirty: it narrows thinking, kills sleep, and makes the next meeting worse, not better. Studies are consistent — self-attack predicts avoidance and hiding, not improvement."},
   {t:"Translate it: 'I misread the ask. Next time I confirm scope in writing before building.' One fix, then sleep.",best:true,fb:"That's the coach's voice: the miss is fully acknowledged, the fix is specific, and your nervous system gets to stand down. Same standard as the critic — minus the part that was never helping."},
   {t:"Drown it out — put on a show, scroll, pour a drink, don't engage.",best:false,fb:"Suppression is a loan, not a payment. The critic comes back at 3am with interest. Thirty seconds of translation costs less than a night of avoidance."}]}},
 {id:"st4",title:"You are not your thoughts",min:3,sections:[
  ["Thoughts are events, not verdicts",`Your mind produces thousands of thoughts a day — forecasts, replays, verdicts, noise. Treating each one as truth is like acting on every idea shouted out in a brainstorm. Psychologists call the alternative defusion: seeing a thought as an event in the mind, generated content — not a command, not a fact.`],
  ["Label the process",`The technique is almost embarrassingly simple. Take the sticky thought — "I'll be found out" — and restate it as "I'm having the thought that I'll be found out." Say it again slower. The content hasn't changed; your position relative to it has. You've stepped from inside the thought to beside it, and from beside it, it loses its grip.`],
  ["Let the stream carry them",`The classic practice: picture a stream with leaves drifting past, and place each thought on a leaf as it arises. The goal is not to stop thinking — minds don't stop — but to stop boarding every leaf. Two minutes of this after a hard day teaches the skill; the 90-second wave lesson is its emotional twin.`]],
  take:["A thought is an event in the mind, not a verdict on reality.","Prefix it: 'I'm having the thought that…' — distance changes everything.","The goal isn't stopping thoughts; it's not boarding every one."],
  reflect:"Which recurring thought would lose the most power if you stopped treating it as a fact?"},
 {id:"st5",title:"What it's all for",min:3,sections:[
  ["Pressure without purpose corrodes",`The same 70-hour week feels completely different depending on whether it's connected to something you chose. Burnout research keeps finding that meaning buffers load: people endure enormous demands when the work maps to their values, and crumble under lighter loads that feel pointless. If the pressure has been feeling heavier lately, check the connection before checking the workload.`],
  ["Name your compass",`Pick the three values you'd actually defend — craft, family, fairness, growth, building people, security, adventure. Write them down. Decisions get faster ("does this serve any of the three?"), and your emotional life gets more legible: anger is almost always a value being stepped on, so knowing your values is emotional literacy by another route.`],
  ["Audit the ladder",`Once or twice a year, ask the uncomfortable one: is this ladder leaning against my wall — or a wall assembled from Singapore expectations, London prestige, and momentum? Any answer is fine. Staying is powerful when it's chosen again, consciously. What corrodes is climbing on autopilot and calling the exhaustion fate.`]],
  take:["Meaning buffers load: connected pressure is bearable, pointless pressure corrodes.","Three named values make decisions faster and emotions more legible.","Re-choose the ladder consciously — autopilot is what exhausts."],
  reflect:"What are your three? And does this season of work serve any of them?"}]}];

const RESETS={
 "Anger":{icon:"🔥",steps:[
  [20,"Exhale the surge","Breathe in for 4, out for 8. Long exhales, jaw loose, shoulders down. The chemical wave passes in about 90 seconds — you're already inside it."],
  [20,"Name the boundary",`Silently finish this sentence: "This anger is protecting…" My time? My standards? My team? Naming the value turns heat into information.`],
  [20,"Choose, don't react","One rule: nothing irreversible in the next ten minutes. No sent email, no verdict. Decide your one calm next step — then take only that."]]},
 "Frustration":{icon:"😤",steps:[
  [20,"Drop the shoulders","Slow breath in, long breath out. Unclench the jaw and hands. Frustration lives in the body first — release the grip."],
  [20,"Find the blockage","Frustration = a goal that's blocked. Name the goal, name the blocker. Is the blocker in your control, your influence, or just weather?"],
  [20,"One micro-move","Pick the smallest action that puts anything back in motion — one message, one decision, one 15-minute slot booked. Motion dissolves frustration."]]},
 "Helplessness":{icon:"🪨",steps:[
  [20,"Feet on the floor","Breathe out slowly. Feel your feet, your seat, your hands. You are here, and this is one situation — not your whole life."],
  [20,"Shrink the frame",`The feeling says "nothing I do matters." Test it: name one thing in this mess that is genuinely yours to move, however small.`],
  [20,"Prove it","Do — or schedule — that one thing in the next hour. Agency is rebuilt by evidence, and evidence starts small."]]},
 "Overwhelm":{icon:"🌪️",steps:[
  [20,"Stop adding","Long exhale. Nothing new gets added for sixty seconds — no tabs, no messages, no mental list-growing."],
  [20,"Triage like an operator","Of everything on the pile: what actually must happen today? Usually it's two things, not nine. Name the two."],
  [20,"Serial, not parallel","Pick the first of the two. Everything else formally waits. One thing at a time is not slower — it's how anything ships."]]},
 "Anxiety":{icon:"〰️",steps:[
  [20,"Slow the system","Physiological sigh: two quick inhales through the nose, one long sigh out. Twice more. It's the fastest known downshift."],
  [20,"Separate fact from forecast","Anxiety trades in forecasts. What is actually true right now, versus what your mind is projecting? Say the facts only."],
  [20,"Prepare, don't ruminate","If the worry has an action — a check, a prep note, an ask — name it and schedule it. If it has none, it's weather. Let it pass."]]},
 "Self-criticism":{icon:"🪞",steps:[
  [20,"Hear the tone",`Catch the sentence the critic just said. Would you say it, in that tone, to your best analyst after a miss? Notice the double standard.`],
  [20,"Zoom out","Everyone operating at your level misses. The miss is real; the verdict — 'fraud', 'not good enough' — is not a fact. It's a feeling doing an impression of one."],
  [20,"Switch to the coach","Restate it the way your best coach would: one specific thing to do differently, zero contempt. Same standard, better fuel."]]}};

/* ================= State ================= */
let S;
function load(){
  try{ S=JSON.parse(localStorage.getItem("samatva"))||null; }catch(e){ S=null; }
  if(!S) S={name:"",onboarded:false,checkIns:[],journal:[],done:[],calmSec:0,reframes:0,resets:0};
  if(!S.theme) S.theme="auto";
  if(!S.worries) S.worries=[];
  if(!S.resetLog) S.resetLog=[];
  if(!S.profile) S.profile=[];
}
function save(){ try{ localStorage.setItem("samatva",JSON.stringify(S)); }catch(e){} }
function effectiveTheme(){
  if(S.theme!=="auto") return S.theme;
  return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
}
function applyTheme(){
  if(S.theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",S.theme);
}
function toggleTheme(){
  S.theme=effectiveTheme()==="dark"?"light":"dark";
  save(); applyTheme(); render();
}
function setTheme(t){ S.theme=t; save(); applyTheme(); render(); }
load();
applyTheme();

let nav={tab:"today",page:null,p:{}};
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function goTab(t){ stopBreath(); nav={tab:t,page:null,p:{}}; render(); window.scrollTo(0,0); }
function goPage(pg,p){ stopBreath(); nav.page=pg; nav.p=p||{}; render(); window.scrollTo(0,0); }

function todayCheckIn(){
  const t=new Date().toDateString();
  return [...S.checkIns].reverse().find(c=>new Date(c.date).toDateString()===t);
}
function nextLesson(){
  for(const c of COURSES){ const l=c.lessons.find(l=>!S.done.includes(l.id)); if(l) return [c,l]; }
  return null;
}
function courseProg(c){ return c.lessons.filter(l=>S.done.includes(l.id)).length/c.lessons.length; }

/* ================= Render ================= */
function render(){
  const app=document.getElementById("app");
  const bar=document.getElementById("tabbar");
  if(!S.onboarded){ bar.style.display="none"; app.innerHTML=viewOnboard(); return; }
  bar.style.display="";
  ["today","learn","tools","reflect"].forEach(t=>{
    document.getElementById("tab-"+t).className=(nav.tab===t&&!nav.page)||nav.tab===t?"on":"";
  });
  let html="";
  if(nav.page==="course") html=viewCourse(nav.p.id);
  else if(nav.page==="lesson") html=viewLesson(nav.p.cid,nav.p.lid);
  else if(nav.page==="breathe") html=viewBreathe(nav.p.pat||"box");
  else if(nav.page==="ground") html=viewGround();
  else if(nav.page==="reframe") html=viewReframe();
  else if(nav.page==="prepare") html=viewPrepare();
  else if(nav.page==="script") html=viewScript();
  else if(nav.page==="worries") html=viewWorries();
  else if(nav.page==="decompress") html=viewDecompress();
  else if(nav.page==="settings") html=viewSettings();
  else if(nav.tab==="today") html=viewToday();
  else if(nav.tab==="learn") html=viewLearn();
  else if(nav.tab==="tools") html=viewTools();
  else if(nav.tab==="reflect") html=viewReflect();
  app.innerHTML=`<div class="fade">${html}</div>`;
  if(nav.page==="breathe") initBreath();
}

/* ---------- Onboarding ---------- */
function viewOnboard(){
  return `
  <div class="center" style="padding-top:9vh">
    <div style="font-size:52px">☸️</div>
    <h1 style="font-size:34px; margin:14px 0 6px">Samatva</h1>
    <p class="sub" style="max-width:330px; margin:0 auto 26px">Equanimity, from the Sanskrit.<br>"Samatvam yoga ucyate" — evenness of mind is excellence in action.</p>
    <div style="text-align:left; max-width:360px; margin:0 auto 26px">
      <div class="take"><b>📖</b><span><b>Short lessons</b> — two to four minutes, written for demanding days.</span></div>
      <div class="take"><b>🌬️</b><span><b>Tools for the moment</b> — breathing, resets and reframes for when pressure hits.</span></div>
      <div class="take"><b>🪞</b><span><b>Quiet progress</b> — milestones and patterns. No streaks, no guilt mechanics.</span></div>
      <div class="take"><b>🔒</b><span><b>Private</b> — everything stays in this browser. No account, no cloud.</span></div>
    </div>
    <div style="max-width:340px; margin:0 auto">
      <input type="text" id="obname" placeholder="What should I call you?" style="text-align:center; font-size:17px; margin-bottom:16px">
      <div class="eyebrow" style="margin-bottom:8px">What's your world? (shapes what gets suggested)</div>
      <div class="chips" style="justify-content:center; margin-bottom:16px">
        ${PROFILE_OPTS.map(p=>`<button class="chip ob-p" data-p="${p}" onclick="this.classList.toggle('on')">${p}</button>`).join("")}
      </div>
      <button class="btn" onclick="finishOnboard()">Begin</button>
    </div>
  </div>`;
}
function finishOnboard(){
  const n=document.getElementById("obname").value.trim();
  if(!n) return;
  S.name=n;
  S.profile=[...document.querySelectorAll(".ob-p.on")].map(el=>el.dataset.p);
  S.onboarded=true; save(); render();
}

/* ---------- Today ---------- */
function greeting(){
  const h=new Date().getHours();
  const n=S.name?`, ${esc(S.name)}`:"";
  if(h>=5&&h<12) return "Good morning"+n;
  if(h>=12&&h<18) return "Good afternoon"+n;
  if(h>=18&&h<23) return "Good evening"+n;
  return "Still up"+n+"?";
}
// A quiet, contextual nudge: reads the most recent difficult check-in (last 18h)
// and points to the one or two tools built for that exact state.
function suggestionCard(){
  const cutoff=Date.now()-18*3600000;
  const recent=[...S.checkIns].reverse().find(c=>new Date(c.date).getTime()>cutoff&&c.emotions.some(e=>DIFFICULT.has(e)));
  if(!recent) return "";
  // A hard moment tagged Family gets its own path — the Kin course
  if(recent.contexts.includes("Family")){
    const kin=COURSES.find(c=>c.id==="kin");
    const kl=kin.lessons.find(l=>!S.done.includes(l.id))||kin.lessons[0];
    return `<div class="card">
      <div class="eyebrow" style="color:var(--rose); margin-bottom:6px">For right now</div>
      <p style="font-size:14.5px; margin:0 0 10px">A hard family moment, logged. Kin was written for exactly this — and a Reset helps first if it's still fresh.</p>
      <div class="chips">
        <button class="chip on" onclick="goPage('lesson',{cid:'kin',lid:'${kl.id}'})">🪷 ${kl.title}</button>
        <button class="chip" onclick="openReset()">⏮️ Reset first</button>
      </div></div>`;
  }
  const e=recent.emotions.find(x=>DIFFICULT.has(x));
  const M={
    Angry:["That anger you logged — don't carry it into the next meeting.","⏮️ 60-second Reset","openReset()","🔁 Put it on trial","goPage('reframe')"],
    Frustrated:["Frustration on the books. Turn it into information before it turns into an email.","⏮️ 60-second Reset","openReset()","🔁 Thought record","goPage('reframe')"],
    Anxious:["You logged anxiety. Two moves: slow the body, then park what you can't act on.","🌬️ Physiological sigh","goPage('breathe',{pat:'sigh'})","🅿️ Park the worry","goPage('worries')"],
    Overwhelmed:["Overwhelm logged. Stop adding; start triaging.","⏮️ Reset: overwhelm","openReset()","✋ Ground yourself","goPage('ground')"],
    Helpless:["Helplessness is a control problem. Map what's actually yours to move.","📖 The control map","goPage('lesson',{cid:'ground',lid:'g2'})","🔁 Thought record","goPage('reframe')"],
    Drained:["Running on empty changes every reading. Protect the evening.","🌙 Decompress","goPage('decompress')","📖 Rest is a skill","goPage('lesson',{cid:'roots',lid:'r4'})"],
    Low:["A low day deserves gentleness, not analysis.","🪞 Self-compassion reset","openReset()","🌙 Decompress","goPage('decompress')"]
  };
  const m=M[e]||M.Frustrated;
  return `<div class="card">
    <div class="eyebrow" style="color:var(--ember); margin-bottom:6px">For right now</div>
    <p style="font-size:14.5px; margin:0 0 10px">${m[0]}</p>
    <div class="chips">
      <button class="chip on" onclick="${m[2]}">${m[1]}</button>
      <button class="chip" onclick="${m[4]}">${m[3]}</button>
    </div></div>`;
}

/* ---------- Check-in ---------- */

function openCheckIn(){
  ci={mood:3,emotions:[],contexts:[]};
  const ov=document.createElement("div"); ov.className="overlay"; ov.id="ci-overlay";
  ov.innerHTML=`<div class="inner">
    <div class="sheetbar"><button onclick="closeOverlay('ci-overlay')">Cancel</button>
      <b class="serif">Check in</b><button onclick="saveCheckIn()"><b>Save</b></button></div>
    <h2>How's the weather in there?</h2>
    <div class="row" style="margin:10px 0 18px">
      <span class="moodface" id="ci-face">⛅</span>

        <input type="range" min="1" max="5" step="1" value="3" oninput="ciMood(this.value)"></div>
    </div>
    <div class="eyebrow" style="margin-bottom:8px">Name it (optional, but it helps)</div>

function rsStart(k){ rs.k=k; rs.i=0; rs.left=RESETS[k].steps[0][0]; rsTick(true); rs.timer=setInterval(()=>rsTick(false),1000); }
function rsTick(first){
  if(!first){ rs.left--; if(rs.left<=0){ rsAdvance(); return; } }
  const st=RESETS[rs.k].steps[rs.i];
  const total=st[0], done=total-rs.left, C=2*Math.PI*62;
  document.getElementById("rs-inner").innerHTML=`

      </svg><div class="num">${rs.left}</div></div>

function rsAdvance(){
  if(rs.i<2){ rs.i++; rs.left=RESETS[rs.k].steps[rs.i][0]; rsTick(true); }
  else{
    clearInterval(rs.timer); rs.timer=null;
    S.resets++; S.resetLog.push(rs.k); S.calmSec+=RESETS[rs.k].steps.reduce((a,s)=>a+s[0],0); save();

// Profile- and pattern-driven lesson suggestions: which course matters most
// to this person right now, given who they told us they are and what they log.
function suggestedLessons(){
  const firstUndone=cid=>{
    const c=COURSES.find(x=>x.id===cid);
    const l=c.lessons.find(x=>!S.done.includes(x.id));
    return l?{c,l}:null;
  };
  const picks=[];
  const addPick=(cid,why)=>{
    const p=firstUndone(cid);
    if(p&&!picks.some(x=>x.l.id===p.l.id)) picks.push({...p,why});
  };
  // Recent difficult family check-ins outrank everything
  const cutoff=Date.now()-14*86400000;
  const famHard=S.checkIns.filter(c=>new Date(c.date).getTime()>cutoff
    &&c.contexts.includes("Family")&&c.emotions.some(e=>DIFFICULT.has(e))).length;
  if(famHard>=1||S.profile.includes("Family is complicated")) addPick("kin","Because family is complicated");
  if(S.profile.includes("I manage a team")) addPick("presence","Because you lead a team");
  if(S.profile.includes("High-stakes meetings")) addPick("presence","For the rooms that matter");
  if(S.profile.includes("Long hours")) addPick("steel","For the long hours");
  if(S.profile.includes("Far from home")) addPick("roots","For the distance from home");
  const nl=nextLesson();
  if(nl&&!picks.some(x=>x.l.id===nl[1].id)) picks.push({c:nl[0],l:nl[1],why:"Next in your path"});
  return picks.slice(0,2);
}

    style="font:inherit; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink)">
    ${Object.keys(PATTERNS).map(k=>`<option value="${k}" ${k===pat?"selected":""}>${PATTERNS[k].name}</option>`).join("")}
  </select>
