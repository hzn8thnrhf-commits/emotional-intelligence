// Cross-tool pattern engine: mirrors what your check-ins, thought records,
// resets and worry ledger say about you — observations, never verdicts.
function insights(){
  const out=[];
  const cutoff=Date.now()-14*86400000;
  const recent=S.checkIns.filter(c=>new Date(c.date).getTime()>cutoff);

  // Thought-record analytics (all time)
  const trs=S.journal.filter(j=>j.kind==="Reframe"&&j.meta);
  if(trs.length>=2){
    const avg=Math.round(trs.reduce((a,t)=>a+(t.meta.before-t.meta.after),0)/trs.length);
    if(avg>0) out.push(`Across ${trs.length} thought records, putting the thought on trial has dropped the feeling by ${avg} points on average. The tool works for you — reach for it early.`);
    const dc={};
    trs.forEach(t=>(t.meta.patterns||[]).forEach(p=>dc[p]=(dc[p]||0)+1));
    const topD=Object.entries(dc).sort((a,b)=>b[1]-a[1])[0];
    const DL={"Mind reading":"Regulate before you respond","Catastrophising":"You are not your thoughts","All-or-nothing":"Micro-moves","Personalising":"The control map","Should-storms":"The inner critic","Discounting wins":"The inner critic"};
    if(topD&&topD[1]>=2&&DL[topD[0]]) out.push(`“${topD[0]}” is your mind's favourite pattern — it appears in ${topD[1]} of ${trs.length} thought records. The lesson “${DL[topD[0]]}” is aimed straight at it.`);
  }

  // Worry ledger calibration
  const reviewed=(S.worries||[]).filter(w=>w.status!=="open");
  if(reviewed.length>=3){
    const never=reviewed.filter(w=>w.status==="didnt").length;
    out.push(`Of ${reviewed.length} worries you've parked and reviewed, ${Math.round(never/reviewed.length*100)}% never happened. Worth remembering at the next 2am forecast.`);
  }

  // Reset pattern
  if((S.resetLog||[]).length>=2){
    const rc={}; S.resetLog.forEach(k=>rc[k]=(rc[k]||0)+1);
    const topR=Object.entries(rc).sort((a,b)=>b[1]-a[1])[0];
    if(topR[1]>=2) out.push(`${topR[0]} is what most often sends you to Reset (${topR[1]} of ${S.resetLog.length} times). That's a pattern the courses are built for — not a failing.`);
  }

  if(recent.length>=3){
    const diff=recent.filter(c=>c.emotions.some(e=>DIFFICULT.has(e)));
    if(diff.length){
      const ev=diff.filter(c=>new Date(c.date).getHours()>=18).length;
      if(ev/diff.length>0.6) out.push("Most of your harder moments land in the evening. A short decompress before you leave the desk may change how the night goes.");
    }
    // Which emotion travels with which trigger
    const pairs={};
    diff.forEach(c=>c.emotions.filter(e=>DIFFICULT.has(e)).forEach(e=>c.contexts.forEach(x=>{
      const k=e+"|"+x; pairs[k]=(pairs[k]||0)+1;
    })));
    const topP=Object.entries(pairs).sort((a,b)=>b[1]-a[1])[0];
    if(topP&&topP[1]>=3){
      const [e,x]=topP[0].split("|");
      out.push(`“${e}” and “${x}” travel together in your check-ins — ${topP[1]} times in two weeks. That exact pairing is worth one thought record.`);
    }
    const famHard=diff.filter(c=>c.contexts.includes("Family")).length;
    if(famHard>=2) out.push(`Family appears in ${famHard} of your harder check-ins this fortnight. The Kin course was written for exactly that terrain — gently, and at your pace.`);
    const ctx={};
    recent.forEach(c=>c.contexts.forEach(x=>ctx[x]=(ctx[x]||0)+1));
    const top=Object.entries(ctx).sort((a,b)=>b[1]-a[1])[0];
    if(top&&top[1]>=3&&top[0]!=="Family") out.push(`“${top[0]}” shows up most often in your check-ins. Worth a look at the Control Map lesson if you haven't yet.`);
    const fr=recent.filter(c=>c.emotions.some(e=>famOf(e)==="Anger")).length;
    if(fr>=3) out.push(`Frustration has come up ${fr} times in two weeks. The Heat course and the 60-second Reset are built exactly for this.`);
    const avg=recent.reduce((a,c)=>a+c.mood,0)/recent.length;
    if(avg>=3.6) out.push("Your average mood over the last two weeks has been on the brighter side. Notice what's working — that's data too.");
  }
  return out.slice(0,5);
}

function weekStats(){
  const now=Date.now(), wk=7*86400000;
  const inWin=(d,start,end)=>{ const t=new Date(d).getTime(); return t>start&&t<=end; };
  const thisCI=S.checkIns.filter(c=>inWin(c.date,now-wk,now));
  const lastCI=S.checkIns.filter(c=>inWin(c.date,now-2*wk,now-wk));
  const avg=a=>a.length?a.reduce((x,c)=>x+c.mood,0)/a.length:null;
  const moodNow=avg(thisCI), moodPrev=avg(lastCI);
  const counts=(arr,fn)=>{ const m={}; arr.forEach(c=>fn(c).forEach(x=>m[x]=(m[x]||0)+1)); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const topEmo=counts(thisCI,c=>c.emotions.filter(e=>DIFFICULT.has(e)))[0];
  const topCtx=counts(thisCI,c=>c.contexts)[0];
  const trs=S.journal.filter(j=>j.kind==="Reframe"&&j.meta&&inWin(j.date,now-wk,now));
  const drop=trs.length?Math.round(trs.reduce((a,t)=>a+(t.meta.before-t.meta.after),0)/trs.length):null;
  const reviewed=S.worries.filter(w=>w.status!=="open").length;
  const lessons=Object.entries(S.doneAt).filter(([,d])=>inWin(d,now-wk,now)).length;
  return {thisCI,moodNow,moodPrev,topEmo,topCtx,trs,drop,reviewed,lessons};
}

  <h1 style="margin-top:2px">Settings</h1>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">You</div>
    <input type="text" value="${esc(S.name)}" onchange="S.name=this.value.trim(); save()"></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">Your world</div>
    <div class="hint" style="margin-bottom:8px">Shapes which lessons and tools get suggested to you.</div>
    <div class="chips">
      ${PROFILE_OPTS.map(p=>`<button class="chip${S.profile.includes(p)?" on":""}" onclick="togProfile('${p}')">${p}</button>`).join("")}
    </div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">Voice guidance</div>

    <div class="chips">
      <button class="chip${S.voice?" on":""}" onclick="S.voice=true; save(); render()">On</button>
      <button class="chip${S.voice?"":" on"}" onclick="S.voice=false; save(); render()">Off</button>
    </div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">Appearance</div>
    <div class="chips">
      <button class="chip${S.theme==="auto"?" on":""}" onclick="setTheme('auto')">Match device</button>
      <button class="chip${S.theme==="light"?" on":""}" onclick="setTheme('light')">Day</button>
      <button class="chip${S.theme==="dark"?" on":""}" onclick="setTheme('dark')">Night</button>
    </div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">About Samatva</div>
    <p style="font-size:14px; margin:0 0 8px">Samatva — Sanskrit for equanimity. "Samatvam yoga ucyate": evenness of mind is excellence in action (Bhagavad Gita 2.48).</p>
    <p class="sub" style="font-size:14px; margin:0">Built as a pocket support system for demanding days: short lessons, honest check-ins, and tools for the moments that run hot.</p></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">Privacy</div>
    <p style="font-size:14px; margin:0">🔒 Everything stays in this browser's local storage. No account, no cloud, no analytics.</p></div>

      <button class="chip" onclick="document.getElementById('imp-file').click()">Restore from backup</button>
    </div>
    <input type="file" id="imp-file" accept=".json,application/json" style="display:none" onchange="importData(this)"></div>

  <button class="btn ghost" style="color:var(--ember)" onclick="if(confirm('Erase everything? This can\\'t be undone.')){localStorage.removeItem('samatva'); load(); nav={tab:'today',page:null,p:{}}; render();}">Erase all data</button>`;
}

render();
if("serviceWorker" in navigator && location.protocol==="https:"){
  try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
}
</script>
</body>
</html>
